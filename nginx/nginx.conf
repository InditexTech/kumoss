server {
    listen 80;
    listen [::]:80;

    # Security Headers
    add_header X-Frame-Options            "SAMEORIGIN";
    add_header X-Content-Type-Options     "nosniff";

    client_max_body_size 4m;

    # SSE — disable buffering so events stream immediately
    location /api/v1/events/subscribe/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 600;
        proxy_send_timeout    600;
        proxy_read_timeout    600;

        proxy_pass http://core:8000;
    }

    # API Proxy
    location /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;

        proxy_pass http://core:8000;
    }

    # The admin panel's Langfuse link. Langfuse has a port of its own (the
    # server block below); redirecting from here keeps its address out of
    # the SPA and the core.
    location = /langfuse {
        return 302 $scheme://$host:3000/;
    }

    # priority with ^~
    location ^~ /favicon/ {
        root /public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ^~ /assets/ {
        root /public/dist/;
        try_files $uri =404;
        expires max;
    }

    location / {
        root /public/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    gzip on;
    gzip_http_version 1.1;
    gzip_types text/css application/javascript application/json text/javascript;
    gzip_min_length 1k;
    gzip_comp_level 6;

    # Logging
    access_log /dev/stdout combined;
    error_log /dev/stdout warn;
}

# object-storage rustfs
server {
   listen       9000;
   listen  [::]:9000;

   client_max_body_size 10m;
   proxy_buffering off;
   proxy_request_buffering off;

   # Server-level headers: this block is independent of the port-80 server
   # above, so its security headers must be restated here. They sit at
   # server scope (never inside a location): a location-level add_header
   # would drop every server-level header for that location (nginx
   # inheritance), which is what header-redefinition flagged.
   add_header X-Frame-Options         "SAMEORIGIN" always;
   add_header X-Content-Type-Options  "nosniff" always;
   add_header Access-Control-Allow-Origin "*" always;
   add_header Access-Control-Expose-Headers "x-amz-meta-type, x-amz-meta-new_file" always;

   location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Disable Nginx from converting HEAD to GET
      proxy_cache_convert_head off;
      proxy_connect_timeout 300;

      # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
      proxy_http_version 1.1;
      chunked_transfer_encoding off;

      proxy_pass http://object-storage:9000;
   }
}


# Langfuse UI and API. A port of its own: the stock Langfuse image cannot
# serve under a path prefix (it bakes its base path in at build time).
server {
   listen       3000;
   listen  [::]:3000;

   # Trace and prompt payloads can be large.
   client_max_body_size 10m;

   add_header X-Frame-Options         "SAMEORIGIN" always;
   add_header X-Content-Type-Options  "nosniff" always;

   location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      # Session cookies set by the login flow outgrow the default buffers.
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_read_timeout 300;

      proxy_pass http://langfuse-web:3000;
   }
}
