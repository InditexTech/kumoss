[project]
name = "Nebula"
version = "0.1.0"
description = "FastAPI-based API with Terraform support"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.54",
    "fastapi[standard]>=0.139.2",
    "httpx[http2]>=0.28.1",
    "deepdiff>=9.1.0",
    "jinja2>=3.1.6",
    "arize-phoenix>=19.4.0",
    "openinference-semantic-conventions>=0.1.30",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-api>=1.44.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "azure-storage-blob>=12.30.0",
    "graphql-core<3.3.0",
    "pyjwt[crypto]>=2.15.0",
    "pyyaml>=6.0.3",
    "redis==8.0.1",
    "mcp==2.2.0",
    "litellm>=1.103.2",
    "google-cloud-aiplatform>=1.165.1",
]

[dependency-groups]
tooling = [
    "basedpyright>=1.39.9",
    "debugpy>=1.8.21",
    "openapi-python-client==0.29.1",
    "ipython>=9.16.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
]
