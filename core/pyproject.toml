[project]
name = "Nebula"
version = "1.0.0"
description = "FastAPI-based API with Terraform support"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.54",
    "fastapi[standard]>=0.139.2",
    "httpx[http2]>=0.28.1",
    "deepdiff>=9.1.0",
    "anthropic[vertex]>=0.118.0",
    "google-genai>=2.14.0",
    "jinja2>=3.1.6",
    "arize-phoenix>=19.4.0",
    "openinference-semantic-conventions>=0.1.30",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-api>=1.44.0",
    "aioretry>=6.3.1",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "azure-storage-blob>=12.30.0",
    "graphql-core<3.3.0",
    "pyyaml>=6.0",
    "mcp==1.28.1",
    "litellm>=1.93.0",
    "google-cloud-aiplatform>=1.163.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "debugpy>=1.8.21",
]
