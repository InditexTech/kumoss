description: GCP networking conventions (VPC networks, subnetworks, firewall rules, Cloud NAT, private access, load balancing).
body: |
  # GCP Networking Guidelines

  ## Topology
  - Default to one custom-mode VPC network per environment (`dev`,
    `staging`, `prod`). Never use auto-mode networks or the `default`
    network.
  - For multi-project deployments, prefer a Shared VPC: the host
    project owns the network and subnetworks, service projects attach
    workloads to them.
  - Connect environments or on-premises networks through VPC Network
    Peering, Network Connectivity Center, Cloud VPN, or Cloud
    Interconnect; do not chain peerings (peering is not transitive).

  ## Address space
  - Use RFC1918 ranges. Avoid overlapping with on-premises CIDRs or
    other networks that will be peered.
  - Allocate a `/16` per VPC network by default and carve regional
    `/20` subnetworks within it; use `/24` where a tier is small.
  - Reserve secondary ranges for GKE pods and services on the
    subnetworks that host clusters.
  - Reserve one private services access range per VPC network (see
    Private connectivity) outside the subnetwork ranges.

  ## Subnetworks
  - Subnetworks are regional; create one per tier per region:
    `web`, `app`, `data`, `mgmt`.
  - Enable `private_ip_google_access = true` on every subnetwork so
    workloads reach Google APIs without external IPs.
  - Enable VPC Flow Logs (`log_config`) on every subnetwork and never
    disable them. Production: `aggregation_interval =
    "INTERVAL_5_SEC"`, `flow_sampling = 0.5`, `metadata =
    "INCLUDE_ALL_METADATA"`. Outside production, `INTERVAL_10_MIN`
    with `flow_sampling = 0.25` is acceptable.
  - Name subnetworks `snet-<environment>-<tier>-<region>`.

  ## Firewall rules
  - Default-deny: rely on the implied deny-ingress rule and add
    explicit, narrow allow rules.
  - Name rules `fw-<network>-<ingress|egress>-<purpose>`.
  - Target rules with service accounts (`target_service_accounts`)
    rather than network tags where possible; use tags only for
    resources that cannot run as a dedicated service account.
  - Allow administrative SSH and RDP only from the Identity-Aware
    Proxy range `35.235.240.0/20`, combined with OS Login. Do not
    deploy bastion hosts with external IPs.
  - Allow health checks only on the health-check port, from
    `130.211.0.0/22` and `35.191.0.0/16` (Application Load Balancers,
    proxy Network Load Balancers, and managed instance group
    autohealing); passthrough Network Load Balancers also need
    `209.85.152.0/22` and `209.85.204.0/22`.
  - Enable firewall rule logging (`log_config { metadata =
    "INCLUDE_ALL_METADATA" }`) on allow rules in production.
  - Prefer hierarchical firewall policies at folder level for rules
    that apply to every project.

  ## Cloud Router and Cloud NAT
  - One Cloud Router per VPC network per region.
  - Provide outbound internet access for private workloads through
    Cloud NAT attached to that router; do not assign external IPs
    to instances for egress.
  - Log Cloud NAT errors only (`filter = "ERRORS_ONLY"`) unless the
    request asks for full logging.

  ## Private connectivity
  - Reach Cloud SQL, Memorystore, and other managed services through
    private services access or Private Service Connect, never their
    public IPs. For private services access, reserve a
    `google_compute_global_address` with `purpose = "VPC_PEERING"`,
    `address_type = "INTERNAL"` and a `/20` or larger prefix, then
    create one `google_service_networking_connection` per VPC network
    that every managed service shares.
  - Never remove or shrink a private services access range or
    connection that managed services already use.
  - Deploy GKE clusters with private nodes and restrict the control
    plane with authorized networks or the IAM-protected DNS-based
    endpoint.
  - Access Cloud Run, Cloud Run functions, and other serverless
    products from the VPC through Direct VPC egress or a Serverless
    VPC Access connector, and restrict their ingress to internal
    traffic when they are not public.

  ## Load balancing
  - Use the global external Application Load Balancer
    (`load_balancing_scheme = "EXTERNAL_MANAGED"`, never the classic
    `EXTERNAL` scheme) for public HTTP(S) entry points, with a Cloud
    Armor security policy attached to every backend service.
  - Use internal Application or Network Load Balancers for traffic
    between tiers inside the VPC.
  - Terminate TLS at the load balancer with Google-managed
    certificates and an SSL policy that enforces TLS 1.2 or later,
    unless the request requires otherwise.

  Replace this body with your organization's authoritative networking
  standards.
