description: GCP actions Kumoss must never generate (security and cost guardrails).
body: |
  # STRICTLY FORBIDDEN GCP ACTIONS

  Never generate Terraform that performs any of the following. If a
  request requires one of these, refuse and explain why.

  ## Networking
  - Firewall rules or firewall policy rules with `source_ranges =
    ["0.0.0.0/0"]` (or `::/0`) on ports other than 80 and 443,
    including SSH (22) and RDP (3389); use Identity-Aware Proxy TCP
    forwarding from `35.235.240.0/20` for administrative access.
  - External IP addresses (`access_config` blocks) on Compute Engine
    instances or instance templates, and public IPs on Cloud SQL,
    Memorystore, or GKE nodes, without an explicit user request.
    Publish workloads through a load balancer and reach the internet
    through Cloud NAT.
  - Deploying resources into the `default` network or creating
    auto-mode VPC networks.
  - Disabling VPC Flow Logs or Private Google Access on existing
    subnetworks.
  - `can_ip_forward = true` on instances or instance templates
    unless the request is explicitly for a network appliance.
  - Cloud SQL `authorized_networks` that contain `0.0.0.0/0`.
  - Public (non-private) GKE nodes, or a GKE control plane endpoint
    open to `0.0.0.0/0`, without an explicit user request.

  ## Compute
  - Attaching the Compute Engine default service account to
    instances, instance templates, GKE nodes, Cloud Run services, or
    Cloud Run functions.
  - Disabling Shielded VM secure boot, vTPM, or integrity monitoring
    on images that support them.
  - Setting `enable-oslogin = "FALSE"` or `serial-port-enable =
    "TRUE"`, or adding `ssh-keys` to instance or project metadata;
    use OS Login.

  ## Identity and access
  - Binding basic roles (`roles/owner`, `roles/editor`,
    `roles/viewer`) to service accounts, or binding any role at
    organization or folder scope without an explicit user request.
  - IAM bindings for `allUsers` or `allAuthenticatedUsers` on any
    resource other than a public website bucket, a public Cloud Run
    service, or a public Cloud Run function explicitly requested by
    the user.
  - Creating user-managed service account keys
    (`google_service_account_key`); use workload identity
    federation or attached runtime service accounts.
  - Authoritative `google_<resource>_iam_policy` resources, which
    drop every binding Terraform does not manage.
  - Granting `roles/iam.serviceAccountUser` or
    `roles/iam.serviceAccountTokenCreator` at project scope.
  - Storing credentials in instance metadata, startup scripts,
    labels, descriptions, variable defaults, or Terraform outputs.

  ## Data
  - Disabling uniform bucket-level access, or setting public access
    prevention to `inherited`, on Cloud Storage buckets that are not
    an explicitly requested public bucket.
  - Setting `deletion_protection = false`, `force_destroy = true`,
    or `delete_contents_on_destroy = true` on Cloud SQL instances,
    Spanner databases, BigQuery datasets and tables, Cloud Storage
    buckets, or GKE clusters without an explicit user request.
  - Removing `lifecycle.prevent_destroy` or customer-managed
    encryption keys (CMEK) from resources that already have them.
  - Changes that force replacement of a stateful resource (Cloud
    SQL, Spanner, BigQuery, Cloud Storage, persistent disks,
    Memorystore, KMS keys) unless the user explicitly asked for the
    replacement. Standalone deletions are always rejected by the
    compliance check, even when requested.
  - Locking a bucket retention policy (`is_locked = true`) without
    an explicit user request; the lock is irreversible.

  ## Cost
  - Provisioning accelerator-optimized or memory-optimized machine
    families (e.g. `a2-*`, `a3-*`, `a4-*`, `g2-*`, `m1-*`, `m2-*`,
    `m3-*`, `m4-*`, `x4-*`), GPUs, or TPUs without an explicit user
    request.
  - Creating standalone Compute Engine instances with no instance
    schedule, or managed instance groups with no autoscaler, in
    non-production environments.
  - Purchasing committed-use discounts, BigQuery slot reservations,
    or Spanner processing units above the minimum without explicit
    capacity planning from the user.
  - Enabling multi-region Cloud Storage or Spanner configurations
    without an explicit user request.

  Replace this body with your organization's authoritative
  forbidden-action policy.
