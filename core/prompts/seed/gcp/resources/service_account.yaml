description: GCP IAM service account template.
body: |
  # GCP Service Account

  ```hcl
  resource "google_service_account" "this" {
    project      = var.project_id
    account_id   = "sa-${var.workload}"
    display_name = "${var.workload} service account"
    description  = "Used by ${var.workload} workload"
  }

  resource "google_project_iam_member" "this" {
    for_each = toset(var.roles)
    project  = var.project_id
    role     = each.value
    member   = "serviceAccount:${google_service_account.this.email}"
  }
  ```

  ## Inputs commonly required
  - `workload` — short identifier for the workload using this SA.
  - `roles` — list of `roles/...` strings to bind.

  ## Notes
  - One service account per workload.
  - Do not create `google_service_account_key`. Use workload identity
    federation (for GKE: Workload Identity; for CI: WIF; for Cloud
    Run / Functions: runtime service account).
  - Bind roles via `google_project_iam_member` (additive), never
    `google_project_iam_policy` (authoritative — it wipes other
    bindings).
