description: GCP Service Account default configuration (least-privilege, additive IAM, workload identity, no keys).
body: |
  # GCP Service Account

  For a Service Account, unless explicitly requested otherwise, use
  the following default configuration:

  - Account ID convention: `sa-<workload>` (6-30 characters).
  - Provide a meaningful `display_name` and `description`
    indicating the workload the service account serves.
  - One service account per workload — do not share service
    accounts across unrelated workloads, and never use the Compute
    Engine or App Engine default service accounts.
  - Bind IAM roles with the additive `google_<resource>_iam_member`
    resources (one per role per member). Never use authoritative
    `_iam_policy` resources, and avoid `_iam_binding`, as they
    remove bindings Terraform does not manage.
  - Grant the least-privileged predefined role on the narrowest
    resource that satisfies the use case. Never grant basic roles
    (Owner, Editor, Viewer).
  - Grant `roles/iam.serviceAccountUser` (to deploy workloads that
    run as the account) and `roles/iam.serviceAccountTokenCreator`
    (to impersonate it) with `google_service_account_iam_member` on
    the account itself, never at project scope.
  - Never create service account keys. Use instead:
    - For GKE: Workload Identity Federation for GKE.
    - For CI/CD: Workload Identity Federation with OIDC and an
      attribute condition restricting repository and branch.
    - For Compute Engine, Cloud Run, and Cloud Run functions: the
      attached runtime service account.
  - If the organization enforces IAM conditions, apply conditions
    on the role binding (e.g. resource-based, time-based).
  - Prefer service account impersonation for cross-project access
    instead of granting direct roles in the target project.
  - Service accounts do not support labels.
