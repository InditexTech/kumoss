description: GCP Service Account default configuration (least-privilege, workload identity, no keys).
body: |
  # GCP Service Account

  For a Service Account, unless explicitly requested otherwise, use
  the following default configuration:

  - Account ID convention: `sa-<workload>`.
  - Provide a meaningful display name and description indicating
    the workload the service account serves.
  - One service account per workload — do not share service
    accounts across unrelated workloads.
  - Bind IAM roles using additive member bindings (one binding per
    role per member). Never use authoritative policy bindings, as
    they wipe all other bindings on the resource.
  - Grant the least-privileged predefined role that satisfies the
    use case. Avoid primitive roles (Owner, Editor, Viewer) at
    project level.
  - Never create service account keys. Use Workload Identity
    Federation instead:
    - For GKE: use Workload Identity.
    - For CI/CD: use Workload Identity Federation with OIDC.
    - For Cloud Run and Cloud Functions: use the runtime service
      account directly.
  - If the organization enforces IAM conditions, apply conditions
    on the role binding (e.g. resource-based, time-based).
  - Consider using service account impersonation for cross-project
    access instead of granting direct roles in the target project.
