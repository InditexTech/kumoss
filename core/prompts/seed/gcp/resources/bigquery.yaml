description: GCP BigQuery default configuration (datasets, access control, partitioning, encryption, cost).
body: |
  # GCP BigQuery

  For BigQuery resources, unless explicitly requested otherwise,
  use the following default configuration:

  ## Dataset
  - Naming convention: `bq_<application>_<purpose>_<environment>`
    (underscores only — BigQuery dataset IDs do not support
    hyphens).
  - Location set to a specific region (e.g. `europe-west1`) or the
    multi-region (`EU`, `US`) the data residency requirements name.
    The location is immutable once created.
  - Do not set a default table or partition expiration unless the
    user states a retention period; an expiration deletes data.
  - Keep time travel at the default 7 days (`max_time_travel_hours
    = 168`).
  - Encryption uses Google-managed keys by default. Use CMEK via
    Cloud KMS (`default_encryption_configuration`) only when
    explicitly requested.
  - Grant access with `google_bigquery_dataset_iam_member` at the
    dataset level: `roles/bigquery.dataViewer` for read and
    `roles/bigquery.dataEditor` for write. Do not combine those
    resources with inline `access` blocks on the dataset, which are
    authoritative. Avoid project-level BigQuery data roles.
  - `delete_contents_on_destroy = false`. Override only when the
    user explicitly requests it.
  - Add `lifecycle { prevent_destroy = true }` for production
    datasets.

  ## Tables (when the user specifies a schema)
  - Enable time-based partitioning (ingestion time or a
    date/timestamp column) for large tables and set
    `require_partition_filter = true` on them.
  - Enable clustering on high-cardinality columns frequently used
    in filters.
  - Keep `deletion_protection = true` (the provider default).
  - Do not invent table schemas. When the user provides one, keep it
    in a separate JSON file loaded with `file()`.

  ## Cost control
  - Use on-demand pricing by default. Use reservations (editions)
    only when the user has predictable workloads and requests
    capacity-based pricing.
  - Grant `roles/bigquery.jobUser` only to principals that run
    queries, in the project that pays for them.
