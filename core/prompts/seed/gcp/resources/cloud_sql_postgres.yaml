description: GCP Cloud SQL for PostgreSQL default configuration (edition, HA, private networking, backups, maintenance).
body: |
  # GCP Cloud SQL for PostgreSQL

  For a Cloud SQL for PostgreSQL instance, unless explicitly
  requested otherwise, use the following default configuration:

  - Naming convention: `sql-<application>-<environment>`.
  - Use the latest stable PostgreSQL major version unless the user
    specifies otherwise (`database_version`, e.g. `POSTGRES_17`).
  - Set `edition` explicitly, because recent PostgreSQL versions
    default to Enterprise Plus:
    - Non-production: `edition = "ENTERPRISE"` with tier
      `db-custom-1-3840` (1 vCPU, 3.75 GB).
    - Production: `edition = "ENTERPRISE"` with `db-custom-2-7680`
      or higher, or `ENTERPRISE_PLUS` with a `db-perf-optimized-N-*`
      tier when the user needs its availability SLA or data cache.
  - Availability type `REGIONAL` (HA with automatic failover) for
    production; `ZONAL` for non-production.
  - Disk type `PD_SSD`, sized for the workload, with
    `disk_autoresize = true`.
  - Networking: `ipv4_enabled = false` and `private_network` set to
    the VPC network, which must already have a private services
    access connection (see the networking guidelines). Set
    `ssl_mode = "ENCRYPTED_ONLY"` or
    `"TRUSTED_CLIENT_CERTIFICATE_REQUIRED"`.
  - Backups enabled with point-in-time recovery, at least 7
    retained backups, and 7 days of transaction log retention. Set a
    `start_time` outside peak hours.
  - Maintenance window (day and hour) defined, update track
    `stable`.
  - Both `deletion_protection = true` (Terraform) and
    `deletion_protection_enabled = true` (API-level), plus
    `lifecycle { prevent_destroy = true }`.
  - Database flags tuned for the workload (e.g.
    `log_min_duration_statement` for slow query logging,
    `cloudsql.iam_authentication = on` for IAM database users).
  - Query Insights enabled with query string length 1024 and
    `query_plans_per_minute = 5`.
  - Prefer Cloud SQL IAM database authentication for application
    service accounts (`google_sql_user` with type
    `CLOUD_IAM_SERVICE_ACCOUNT`). Built-in user passwords live in
    Secret Manager — never hardcode them or expose them in outputs.
  - Apply standard labels (`user_labels`): environment, owner, and
    managed_by.
