description: GCP Cloud NAT default configuration (logging, IP allocation, port allocation, timeouts).
body: |
  # GCP Cloud NAT

  For a Cloud NAT gateway, unless explicitly requested otherwise,
  use the following default configuration:

  - Naming convention: `nat-<network>-<region>`.
  - Associate with a Cloud Router in the same region and network.
  - NAT IP allocation method set to `AUTO_ONLY` (GCP auto-allocates
    external IPs). Use `MANUAL_ONLY` with reserved
    `google_compute_address` resources only when the user requires
    static egress IPs (e.g. for allow-listing with third parties).
  - Source subnetwork IP ranges set to
    `ALL_SUBNETWORKS_ALL_IP_RANGES` to cover all private subnets.
    Restrict to specific subnets only when the user explicitly
    requests it.
  - Enable logging with `filter = "ERRORS_ONLY"` for cost
    efficiency. Use `ALL` for troubleshooting when requested.
  - Enable dynamic port allocation (`enable_dynamic_port_allocation
    = true`) with `min_ports_per_vm = 64` and `max_ports_per_vm =
    4096`; dynamic port allocation requires
    `enable_endpoint_independent_mapping = false`.
  - TCP established idle timeout 1200 seconds, TCP transitory idle
    timeout 30 seconds, and UDP idle timeout 30 seconds (the
    defaults). Adjust only when the workload requires long-lived
    outbound connections.
  - For high-availability production workloads, ensure sufficient
    NAT IPs to avoid port exhaustion — each IP provides 64,512
    ports.
  - Cloud NAT does not support labels.
