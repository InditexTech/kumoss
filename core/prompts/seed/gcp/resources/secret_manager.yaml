description: GCP Secret Manager default configuration (replication, secret values, rotation, per-secret IAM).
body: |
  # GCP Secret Manager

  For a Secret Manager secret, unless explicitly requested
  otherwise, use the following default configuration:

  - Naming convention (`secret_id`):
    `sm-<application>-<purpose>-<environment>`.
  - Replication `user_managed` with replicas only in the workspace
    region(s), so the secret respects data residency. Use automatic
    replication only when the user states there is no residency
    constraint.
  - Terraform creates the secret container. Never put a secret value
    in Terraform code, variable defaults, tfvars files, or outputs.
    Add versions outside Terraform; create a
    `google_secret_manager_secret_version` only when the value is
    generated in Terraform itself (e.g. by `random_password`) and
    the user accepts that it is stored in the Terraform state.
  - Configure `rotation` (period and next rotation time) with a
    Pub/Sub topic in `topics` only when a rotation process exists or
    is requested.
  - Set `version_destroy_ttl` (e.g. `"86400s"`) so destroyed
    versions can be recovered during a grace period.
  - Grant `roles/secretmanager.secretAccessor` per secret and per
    workload service account with
    `google_secret_manager_secret_iam_member`; never project-wide.
  - Encryption: Google-managed keys by default; set
    `customer_managed_encryption` on each replica only when CMEK is
    requested.
