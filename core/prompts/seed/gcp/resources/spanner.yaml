description: GCP Cloud Spanner default configuration (instance, edition, database, protection, backup).
body: |
  # GCP Cloud Spanner

  For a Cloud Spanner instance, unless explicitly requested
  otherwise, use the following default configuration:

  ## Instance
  - Naming convention: `spn-<application>-<environment>`.
  - Use a regional configuration (e.g. `regional-europe-west1`) for
    cost efficiency. Use multi-regional configurations only when the
    user explicitly requires cross-region high availability.
  - `edition = "STANDARD"` unless the user needs features of the
    Enterprise editions.
  - Processing units set to 100 (the minimum) for non-production.
    For production, size based on the workload.
  - Enable autoscaling for production instances through
    `autoscaling_config` with minimum and maximum processing units
    and target high-priority CPU and storage utilization.
  - Add `lifecycle { prevent_destroy = true }`.

  ## Database
  - Naming convention: `db-<application>-<purpose>-<environment>`.
  - Use the GoogleSQL dialect unless the user explicitly requires
    the PostgreSQL dialect.
  - Keep `deletion_protection = true` (Terraform) and set
    `enable_drop_protection = true` (API-level) for production.
  - Do not define the schema inline — DDL belongs to a separate
    migration process. Only specify initial `ddl` if the user
    provides the schema.
  - Set `version_retention_period` (point-in-time recovery window,
    up to 7 days) for production databases.
  - Encryption uses Google-managed keys by default. Use CMEK via
    Cloud KMS only when explicitly requested.

  ## Backup
  - Configure a `google_spanner_backup_schedule` with a retention
    of at least 7 days for production databases.
