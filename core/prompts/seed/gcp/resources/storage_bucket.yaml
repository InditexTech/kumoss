description: GCP Cloud Storage Bucket default configuration (access control, soft delete, versioning, lifecycle, encryption).
body: |
  # GCP Storage Bucket

  For a Cloud Storage Bucket, unless explicitly requested otherwise,
  use the following default configuration:

  - Naming convention: `<project-id>-<purpose>`. Bucket names are
    globally unique; prefix with the project ID to avoid collisions.
  - Location: a single region matching the workloads that use the
    bucket. Use a dual-region or multi-region only on explicit
    request. The location is immutable.
  - Storage class `STANDARD`. When access patterns are unknown,
    enable Autoclass instead of hand-written class transitions; use
    `NEARLINE`, `COLDLINE`, or `ARCHIVE` only when the user
    specifies infrequent access.
  - `uniform_bucket_level_access = true` — this disables legacy ACLs
    and is the recommended default.
  - `public_access_prevention = "enforced"`. Override only if the
    request explicitly requires a public bucket (e.g. a static
    website).
  - `force_destroy = false`. Terraform destroy will fail if the
    bucket contains objects.
  - Versioning enabled to protect against accidental deletion and
    overwriting, with a lifecycle rule that deletes non-current
    versions after 90 days (`days_since_noncurrent_time = 90`).
  - Keep the default soft delete policy (7 days retention); never
    set its retention to 0 unless the user requests it.
  - For data with regulatory retention, add a retention policy;
    lock it (`is_locked = true`) only on explicit request, because
    the lock is irreversible.
  - Encryption: Google-managed keys by default. Use CMEK
    (`encryption { default_kms_key_name }`) only when requested; the
    Cloud Storage service agent needs
    `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key.
  - Grant access with `google_storage_bucket_iam_member` at bucket
    level (e.g. `roles/storage.objectViewer`), never with ACLs.
  - Audit access through Cloud Audit Logs (Data Access logs) rather
    than legacy usage logs.
  - Add `lifecycle { prevent_destroy = true }` for production
    buckets that hold data.
  - Apply standard labels: environment, owner, and managed_by.
