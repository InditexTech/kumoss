description: GCP Cloud Storage Bucket default configuration (encryption, access control, lifecycle, retention).
body: |
  # GCP Storage Bucket

  For a Cloud Storage Bucket, unless explicitly requested otherwise,
  use the following default configuration:

  - Naming convention: `<project-id>-<purpose>`. Bucket names are
    globally unique; prefix with the project ID to avoid collisions.
  - Storage class set to STANDARD. Use NEARLINE, COLDLINE, or
    ARCHIVE only when the user specifies infrequent access patterns.
  - Uniform bucket-level access must be enabled — this disables
    legacy ACLs and is the modern recommended default.
  - Public access prevention must be set to enforced. Override only
    if the request explicitly requires a public bucket (e.g. a
    static website).
  - Force destroy must be disabled. Terraform destroy will fail if
    the bucket contains objects. Override only when intentional.
  - Versioning must be enabled to protect against accidental
    deletion and overwriting.
  - Add a lifecycle rule to transition objects to NEARLINE after
    30 days. Adjust thresholds based on data access patterns.
  - Add a lifecycle rule to delete non-current object versions
    after 90 days.
  - For sensitive data, enable a retention policy with a lock to
    prevent early deletion.
  - For customer-managed encryption, configure a CMEK using a
    Cloud KMS key. Otherwise the default Google-managed encryption
    applies automatically.
  - Enable access logging by setting a log bucket and log object
    prefix for audit trail.
  - Apply standard labels: environment and managed_by.
