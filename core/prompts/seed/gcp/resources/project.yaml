description: GCP Project default configuration (naming, APIs, billing, organization).
body: |
  # GCP Project

  For a Project, unless explicitly requested otherwise, use the
  following default configuration:

  - Project name convention: `<application>-<environment>`.
  - Project ID must be globally unique and immutable. Append a
    short random suffix to avoid name collisions across
    organizations.
  - Place the project under the appropriate organization folder
    using a folder ID.
  - Associate a billing account.
  - Enable required Google Cloud APIs immediately after project
    creation using service enablement resources. Common APIs:
    compute.googleapis.com, container.googleapis.com,
    iam.googleapis.com, logging.googleapis.com,
    monitoring.googleapis.com.
  - Project deletion is soft for 30 days — the original project ID
    can only be reused after final deletion.
  - Delete the default VPC network and default firewall rules after
    project creation to enforce custom networking.
  - Apply standard labels: environment, owner, and managed_by.
