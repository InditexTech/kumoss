description: GCP VPC Network default configuration (custom mode, routing, firewall).
body: |
  # GCP VPC Network

  For a VPC Network, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `vpc-<application>-<environment>`.
  - Always use custom subnet mode (auto_create_subnetworks disabled).
    Auto mode creates a /20 subnet per region, which is wasteful
    and creates an unnecessarily large attack surface.
  - Routing mode set to REGIONAL to keep the blast radius small.
    Only switch to GLOBAL when the request explicitly requires
    cross-region dynamic routing.
  - Do not delete default routes on create unless the user
    explicitly requests a fully isolated network with no internet
    egress.
  - Subnetworks are defined as separate resources, not inline.
  - The default network in a project should not be used — always
    create explicit VPC networks.
  - Apply standard labels: environment and managed_by.
