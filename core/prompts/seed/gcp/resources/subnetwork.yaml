description: GCP Subnetwork default configuration (private Google access, flow logs, secondary ranges).
body: |
  # GCP Subnetwork

  For a Subnetwork, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `snet-<purpose>` (e.g. snet-web, snet-app,
    snet-data).
  - Assign CIDR ranges carved from the parent VPC's planned address
    space.
  - Enable Private Google Access so VMs without external IPs can
    reach Google APIs and services.
  - Enable VPC flow logs for security monitoring and
    troubleshooting in production. Use an aggregation interval of
    10 minutes, flow sampling at 0.5, and include all metadata.
    Disable or reduce sampling in non-production to manage cost.
  - For GKE clusters, allocate secondary IP ranges for pods and
    services using secondary range blocks.
  - One subnetwork per purpose per region.
  - Apply standard labels where supported.
