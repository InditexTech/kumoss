description: GCP Load Balancer default configuration (Application Load Balancer, health checks, TLS, CDN, Cloud Armor).
body: |
  # GCP Load Balancer

  For a Load Balancer, unless explicitly requested otherwise, use
  the following default configuration:

  ## Type selection
  - Use the global external Application Load Balancer
    (`load_balancing_scheme = "EXTERNAL_MANAGED"`) for public-facing
    web workloads. This is the default when the user asks for a load
    balancer without specifying the type. Never use the classic
    `EXTERNAL` scheme for new load balancers.
  - Use an internal Application Load Balancer (`INTERNAL_MANAGED`)
    for internal HTTP(S) services; it needs a proxy-only subnetwork
    in the region.
  - Use a passthrough Network Load Balancer (TCP/UDP) only when the
    user requires non-HTTP protocols or client IP preservation.
  - Use a regional load balancer only when explicitly requested or
    when data residency requires it.

  ## Frontend
  - Naming convention: `lb-<application>-<environment>` for the
    forwarding rule, with `ip-`, `cert-` and `bes-` prefixes for the
    address, certificate, and backend service.
  - Reserve a static IP address (`google_compute_global_address`)
    for the forwarding rule.
  - Use HTTPS (port 443) with a Google-managed certificate
    (Certificate Manager or `google_compute_managed_ssl_certificate`).
    Redirect HTTP (port 80) to HTTPS with a separate URL map that
    sets `default_url_redirect { https_redirect = true }`.
  - Attach an SSL policy with `min_tls_version = "TLS_1_2"` and the
    `MODERN` or `RESTRICTED` profile.

  ## Backend
  - Managed instance groups are added as backends through their
    `instance_group` output with `balancing_mode = "UTILIZATION"`;
    Cloud Run and Cloud Run functions through a serverless network
    endpoint group.
  - Configure health checks (`hc-<application>-<environment>`) with
    check interval 10 seconds, timeout 5 seconds, healthy threshold
    2, unhealthy threshold 3, on the application's health path. Add
    the firewall rule that allows the health-check ranges.
  - Enable Cloud CDN only on backends that serve cacheable content.
    Disable it for dynamic API backends.
  - Connection draining timeout of 300 seconds.
  - Session affinity set to `NONE` (stateless) unless the user
    specifies otherwise.
  - Enable backend service logging (`log_config`) with a sample
    rate of 1.0 for production and 0.1 for non-production.

  ## Security
  - Attach a Cloud Armor security policy (see `cloud_armor`) to
    every backend service of a public-facing load balancer.
  - Enable Identity-Aware Proxy (IAP) for internal applications
    that require user authentication.
  - Apply the standard labels to forwarding rules and reserved
    addresses; backend services, URL maps, and health checks do not
    support labels.
