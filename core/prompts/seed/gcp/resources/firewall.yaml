description: GCP Firewall Rule default configuration (least-privilege, service-account targeting, priority, logging).
body: |
  # GCP VPC Firewall Rule

  For a Firewall Rule, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `fw-<network>-<ingress|egress>-<purpose>`
    (e.g. fw-vpc-shop-prod-ingress-https-lb).
  - Never use source ranges `0.0.0.0/0` for ingress rules unless the
    port is 80 or 443 and the target is explicitly public-facing.
    Always scope to known CIDRs, source service accounts, or source
    tags.
  - Scope the rule with `target_service_accounts` (preferred) or
    `target_tags`. Avoid network-wide rules. Service accounts give
    stronger identity guarantees than tags, which anyone with
    instance edit permissions can set.
  - Administrative SSH (22) and RDP (3389) only from the
    Identity-Aware Proxy range `35.235.240.0/20`.
  - Load balancer and autohealing health checks only from
    `130.211.0.0/22` and `35.191.0.0/16` on the health-check port.
  - Use priority 1000 by default; lower numbers evaluate first. Give
    narrow allow rules a priority below that of any broad deny rule
    they must override.
  - For egress restriction, set `direction = "EGRESS"`, use
    `destination_ranges`, and pair a low-priority deny-all egress
    rule with higher-priority allow rules.
  - Enable logging (`log_config { metadata =
    "INCLUDE_ALL_METADATA" }`) on production allow rules.
  - Every rule has a `description` explaining its purpose.
  - Consider hierarchical firewall policies at the folder level, or
    network firewall policies with secure tags, for rules shared by
    many projects instead of duplicating per-VPC firewall rules.
  - Firewall rules do not support labels.
