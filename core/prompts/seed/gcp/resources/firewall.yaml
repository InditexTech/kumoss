description: GCP Firewall Rule default configuration (least-privilege, tagging, priority).
body: |
  # GCP VPC Firewall Rule

  For a Firewall Rule, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `<action>-<protocol>-<purpose>-<network>`
    (e.g. allow-https-web-vpc-prod).
  - Never use source ranges 0.0.0.0/0 for ingress rules unless the
    resource is explicitly public-facing (load balancer frontend,
    CDN-fronted service). Always scope to known CIDRs, source tags,
    or source service accounts.
  - Use target tags or target service accounts to scope which
    instances the rule applies to. Avoid network-wide rules.
  - Prefer service account-based targeting over network tags for
    stronger identity guarantees — tags can be set by any user with
    instance edit permissions.
  - Priority numbering should use 1000 as the default. Lower
    numbers evaluate first. Use priorities below 1000 for
    higher-priority allow rules and above 1000 for deny rules.
  - For egress restriction, set direction to EGRESS and use
    destination ranges.
  - Every rule should have a clear description explaining its
    purpose.
  - Consider using Hierarchical Firewall Policies at the
    organization or folder level for organization-wide rules
    instead of per-VPC firewall rules.
