description: GCP Cloud Run default configuration (scaling, ingress, networking, identity, secrets).
body: |
  # GCP Cloud Run

  For a Cloud Run service, unless explicitly requested otherwise,
  use the following default configuration:

  - Use `google_cloud_run_v2_service`; never the v1
    `google_cloud_run_service` resource.
  - Naming convention: `run-<application>-<service>-<environment>`.
  - Use the second-generation execution environment
    (`EXECUTION_ENVIRONMENT_GEN2`).
  - Minimum instances 0 for non-production (scale to zero) and at
    least 1 for production to avoid cold starts.
  - Maximum instances based on expected load. Default to 10 unless
    the user specifies otherwise.
  - Max concurrent requests per instance 80 (the default). Adjust
    based on the application's concurrency model.
  - CPU only allocated during request processing (`cpu_idle =
    true`) for cost efficiency, with `startup_cpu_boost = true`.
    Use always-allocated CPU only for background processing or
    WebSocket workloads.
  - Memory limit 512Mi and CPU limit 1 unless the user specifies
    otherwise.
  - Request timeout 300 seconds (the default). Increase up to 3600
    seconds for long-running requests.
  - Ingress `INGRESS_TRAFFIC_INTERNAL_ONLY` for services that should
    not be publicly accessible. For public services, prefer
    `INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER` behind an external
    Application Load Balancer with Cloud Armor; use
    `INGRESS_TRAFFIC_ALL` only when explicitly required.
  - Grant `roles/run.invoker` to specific service accounts with
    `google_cloud_run_v2_service_iam_member`. Grant it to `allUsers`
    only when the user explicitly requests a public service.
  - Use Direct VPC egress (`vpc_access` with a network interface)
    or a Serverless VPC Access connector for access to private
    resources (Cloud SQL, Memorystore, internal services), with
    `egress = "PRIVATE_RANGES_ONLY"` unless all traffic must leave
    through the VPC.
  - Use a dedicated runtime service account per service — never the
    default Compute Engine service account.
  - Store secrets in Secret Manager and reference them through
    `value_source.secret_key_ref` or secret volumes — never
    hardcode sensitive values. Pin secret versions in production.
  - Pull images from Artifact Registry in the same region.
  - Enable startup and liveness probes for production services.
