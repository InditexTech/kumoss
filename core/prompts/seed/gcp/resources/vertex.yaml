description: GCP Vertex AI default configuration (networking, encryption, service account, endpoints, Workbench).
body: |
  # GCP Vertex AI

  For Vertex AI resources, unless explicitly requested otherwise,
  use the following default configuration:

  ## General
  - Enable the required APIs: aiplatform.googleapis.com,
    compute.googleapis.com, and storage.googleapis.com.
  - Use a dedicated service account for Vertex AI workloads — do
    not use the default Compute Engine service account. Grant only
    the roles needed (e.g. `roles/aiplatform.user`, and
    `roles/storage.objectViewer` on the data bucket).
  - Keep resources in one region, matching the training data.
  - Encryption uses Google-managed keys by default. Use CMEK via
    Cloud KMS only when explicitly requested.
  - Apply standard labels: environment, owner, and managed_by.

  ## Datasets and training
  - Store training data in a Cloud Storage bucket following the
    `storage_bucket` template defaults.
  - For custom training jobs, specify machine type, accelerator
    type, and count based on the workload. Default to
    `n2-standard-4` with no GPU for experimentation; add GPUs only
    when the user requests deep learning training.
  - For network-isolated training, use a Private Service Connect
    interface or VPC peering to the Vertex AI service network.

  ## Endpoints
  - Naming convention: `vtx-<model>-<environment>`.
  - Deploy models to endpoints in the same region as the training
    data.
  - Enable autoscaling with a minimum replica count of 1 for
    production; for non-production, keep the minimum replica count
    as low as the deployment type allows.
  - Enable request/response logging for monitoring and auditing
    predictions.
  - Use private endpoints (Private Service Connect) for
    network-isolated inference to avoid exposing the endpoint
    publicly.

  ## Feature Store (if requested)
  - Use Vertex AI Feature Store with BigQuery as the offline store
    and an online store for low-latency serving.
  - Enable monitoring for feature drift detection.

  ## Workbench and cost control
  - Use Vertex AI Workbench instances (`google_workbench_instance`)
    with no public IP, a dedicated service account, and idle
    shutdown enabled; never the deprecated managed or user-managed
    notebooks.
  - Set timeouts on training jobs to avoid runaway costs.
