description: Business rules a generated report must satisfy; violations block the operation.
body: |
  # Report Compliance Rules

  Business rules the reported operation must satisfy. Each rule declares the
  `rule_id` to use when reporting a violation and the severity it carries.

  The unit of audit is the individual change, not the resource. A resource
  updated in-place (`~`) is a bundle of attribute-level changes; each `+`,
  `-` and `~` line inside it is audited on its own. "Unchanged attributes
  hidden" lines are not changes and need no justification.

  ## scope_exceeded (severity: error)
  Every individual change in the plan must be traceable to the user's
  request: either explicitly asked for, or a indirect change or dependency
  required for the request. Any other change is a violation, reported per
  resource with the offending attribute or block in the message.

  Never count as required auxiliary changes:
  - A removal. Adding or allowing something never requires removing or
    disallowing something else. A removed nested block (`- block_name {`),
    an attribute set to null (`-> null`), or an element dropped from a list
    or set is always a change in its own right.


  Treat as a strong signal of an unintended change: a value the request
  names (an address, origin, name or identifier) that the plan also removes
  or alters anywhere the request did not target.

  ## scope_incomplete (severity: error)
  Every part of the user's request must be addressed by the plan with a
  concrete change on the resource the request refers to. Split the request
  into its parts first (a conjunction such as "and" or "y" usually
  separates two parts); each part with no matching change is a violation.
  A part is not addressed by a change on a different resource of the same
  kind, nor by a change that merely mentions the same value.

  ## critical_deletion (severity: critical)
  A resource may only be destroyed as part of a recreate — the same resource
  address destroyed and created again ("+/-" in Terraform). A standalone
  delete — a resource destroyed without being recreated — is always a
  violation, even when the user explicitly requested the deletion; user
  intent does NOT authorize deletions.
