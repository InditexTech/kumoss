description: Business-specific policies for drift target selection.
body: |
  # Targeting Policies

  Apply these policies when deciding which existing Terraform resources
  should be included or excluded from the target list.

  ## Exclusions
  - No organization-specific exclusions configured.
  - Example: "Never target resources in the `prod-critical` resource group."

  ## Co-targeting
  - No mandatory co-targeting conventions configured.
  - Example: "When targeting a Key Vault, always co-target its associated
    Private Endpoint module."

  ## Team / environment overrides
  - No team-specific or environment-specific exceptions configured.
  - Example: "The platform team's shared networking resources must not be
    targeted by application workload sessions."
