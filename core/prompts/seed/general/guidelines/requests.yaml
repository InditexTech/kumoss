description: Criteria for assessing whether a user request is in scope and fulfillable.
body: |
  # Request Assessment Guidelines

  Apply these criteria when deciding whether a request can be fulfilled.

  ## In scope
  - Cloud infrastructure managed with Terraform, within what the current
    operation covers.
  - Questions about that infrastructure that resolve directly into such work.

  ## Fulfillable
  A request is fulfillable when it is in scope, violates no prohibited
  action, and can be executed with defaults. Missing parameters never make
  a request unfulfillable: naming conventions supply names, resource module
  templates supply settings, and the existing workspace supplies placement
  (resource group, region, environment).

  ## Not fulfillable — reject and explain why
  - Out of scope: not an actionable request for the current operation.
  - Prohibited: fulfilling it would violate a prohibited action.
  - Ambiguous target: it modifies, deletes, or asks about an existing
    resource but neither the request, the workspace, nor the conversation
    history makes clear which one.
  - Missing referent: it refers to something as already existing that is
    not present in the workspace.

  When accepting an underspecified request, state the defaults and
  assumptions being applied. When in doubt about parameters, accept.

  Replace this body with your organization's authoritative request-triage
  criteria. These defaults are deliberately generic.
