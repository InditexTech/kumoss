description: Business-specific policies for predictive target selection.
body: |
  # Predictive Target Policies

  Apply these policies when deciding which existing Terraform resources
  should be included or excluded from the predictive target list.

  ## Exclusions
  - No organization-specific exclusions configured.
  - Example: "Never target resources in the `prod-critical` resource group."

  ## Co-targeting
  - No mandatory co-targeting conventions configured.
  - Example: "When targeting a Key Vault, always co-target its associated
    Private Endpoint module."

  ## Team / environment overrides
  - No team-specific or environment-specific exceptions configured.
  - Example: "The platform team's shared networking resources must not be
    targeted by application workload sessions."

  ---

  This prompt is reserved for **business-related** targeting rules only.
  Do NOT add rules about target string formats, data-source handling,
  module-vs-resource logic, or diff-history exclusion here — those are
  core model behavior and are managed in the system template.

  Replace this body with your organization's authoritative targeting
  policies. These defaults are deliberately generic.
