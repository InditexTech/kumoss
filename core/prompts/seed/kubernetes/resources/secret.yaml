description: Kubernetes Secret default configuration (types, encoding, state exposure, external secrets, encryption).
body: |
  # Kubernetes Secret

  For a Secret, unless explicitly requested otherwise, use the
  following default configuration:

  - Resource type: `kubernetes_secret_v1`.
  - Naming convention: `<app>-<purpose>-secret`.
  - Default type: `Opaque` for arbitrary key-value pairs.
  - Use `kubernetes.io/tls` for TLS certificates (requires `tls.crt`
    and `tls.key` keys).
  - Use `kubernetes.io/dockerconfigjson` for image pull secrets.
  - Use `kubernetes.io/basic-auth` for basic authentication
    credentials (requires `username` and `password` keys).
  - Encoding: the provider base64-encodes `data` itself — put plain
    values in `data` and never pre-encode them (that double-encodes).
    Use `binary_data` only for content that is already
    base64-encoded.
  - Never put values in literals or variable defaults, and never
    declare a required variable for them: the engine cannot supply
    it.
    - A credential Terraform can generate comes from
      `random_password`. The value lands in the Terraform state in
      plain text — say so; any output carrying it is
      `sensitive = true`.
    - Externally provided values are not put in Terraform at all.
      Reference an existing Secret by name (`secret_key_ref` or a
      `secret` volume in the workload; a
      `data "kubernetes_secret_v1"` lookup only when Terraform itself
      needs a value, since it copies it into the state) or, when the
      cluster runs External Secrets Operator, create an
      `ExternalSecret` with `kubernetes_manifest`. State in the
      summary which Secret or external entry must be created out of
      band.
  - Kubernetes Secrets are base64-encoded, NOT encrypted at rest by
    default. Enable etcd encryption via `EncryptionConfiguration`
    at the cluster level, or use a KMS provider.
  - Set `immutable = true` only for secrets that must not change
    after creation; any later change then replaces the Secret (+/-).
  - Prefer external secrets management over storing secret values
    in Terraform state, using a tool already installed in the
    cluster (its objects need `kubernetes_manifest`, which requires
    the CRDs at plan time):
    - External Secrets Operator — syncs from Vault, AWS Secrets
      Manager, Azure Key Vault, GCP Secret Manager.
    - Secrets Store CSI Driver — mounts external secrets as volumes
      without Kubernetes Secret objects.
    - Sealed Secrets — encrypted at rest in Git, decrypted in-cluster.
  - Mount as a volume with specific `items` and `default_mode = "0400"`
    for file-based secrets; use `env_from` for environment variables.
  - Never output secret values; any output derived from a Secret is
    `sensitive = true`.
