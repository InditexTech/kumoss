description: Kubernetes Secret default configuration (types, encoding, external secrets).
body: |
  # Kubernetes Secret

  For a Secret, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `<app>-<purpose>-secret`.
  - Default type: `Opaque` for arbitrary key-value pairs.
  - Use `kubernetes.io/tls` for TLS certificates (requires `tls.crt`
    and `tls.key` keys).
  - Use `kubernetes.io/dockerconfigjson` for image pull secrets.
  - Values in `data` must be base64-encoded; use `string_data` for
    plain-text values that Terraform will encode automatically.
  - Set `immutable = true` for secrets that should not change after
    creation.
  - Prefer external secrets management (e.g., External Secrets
    Operator, Sealed Secrets, or Vault) over storing secret values
    directly in Terraform state.
  - Mount as a volume with specific `items` and `default_mode = "0400"`
    for file-based secrets; use `env_from` for environment variables.
  - Apply standard labels for identification.
  - Never log or output secret values in Terraform outputs.
