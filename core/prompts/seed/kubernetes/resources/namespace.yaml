description: Kubernetes Namespace default configuration (labels, resource quotas, limit ranges).
body: |
  # Kubernetes Namespace

  For a Namespace, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `<team>-<application>-<environment>`.
  - Apply standard Kubernetes labels: `app.kubernetes.io/managed-by`,
    `app.kubernetes.io/part-of`.
  - Never use `default`, `kube-system`, `kube-public`, or
    `kube-node-lease` for application workloads.
  - Consider pairing with a `kubernetes_resource_quota` to enforce
    CPU, memory, and object count limits.
  - Consider pairing with a `kubernetes_limit_range` to set default
    container resource requests and limits.
  - Apply a default-deny ingress NetworkPolicy immediately after
    namespace creation.
  - Use annotations for metadata such as team ownership and
    cost-center attribution.
