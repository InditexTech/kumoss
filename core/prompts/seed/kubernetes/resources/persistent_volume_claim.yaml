description: Kubernetes PersistentVolumeClaim default configuration (storage class, access modes, size, immutability, lifecycle).
body: |
  # Kubernetes PersistentVolumeClaim

  For a PersistentVolumeClaim, unless explicitly requested otherwise,
  use the following default configuration:

  - Resource type: `kubernetes_persistent_volume_claim_v1`.
  - Naming convention: `<app>-<purpose>-pvc`.
  - Set `storage_class_name` explicitly — do not rely on the cluster
    default unless it is well-documented.
  - Default `access_modes = ["ReadWriteOnce"]`. Use `ReadWriteMany`
    only when multiple pods need concurrent write access (requires
    a storage class that supports it, e.g., NFS, EFS, Azure Files).
    Use `ReadWriteOncePod` (K8s 1.29+) when only a single pod
    should have write access — stricter than `ReadWriteOnce` which
    allows multiple pods on the same node.
  - Immutable fields: `storage_class_name`, `access_modes` and
    `volume_mode` cannot change after creation. Changing them makes
    Terraform replace the PVC (+/-), which can destroy the volume
    and its data. Never change them unless the user explicitly
    asked for the replacement, and state the data loss in the
    summary.
  - Size `resources.requests.storage` appropriately. It can only
    grow, never shrink (a smaller value forces replacement), and
    only grows in place when the StorageClass has
    `allow_volume_expansion = true`; never reduce it.
  - Set `volume_mode = "Filesystem"` (default). Use `Block` only
    for applications that manage raw block devices.
  - For StatefulSets, define PVCs via `volume_claim_template` on
    the StatefulSet rather than as standalone resources.
  - Set `wait_for_bound = true` (Terraform default) to block until
    the PVC is bound. Set to `false` for `WaitForFirstConsumer`
    storage classes where binding happens on pod scheduling.
  - Add a `lifecycle` block with `prevent_destroy = true` for
    production data volumes, and never remove an existing one.
