description: Kubernetes ClusterRoleBinding default configuration (subjects, role references, immutability).
body: |
  # Kubernetes ClusterRoleBinding

  For a ClusterRoleBinding, unless explicitly requested otherwise,
  use the following default configuration:

  - Resource type: `kubernetes_cluster_role_binding_v1`.
  - Naming convention: `<app>-<purpose>-crb`, where `<purpose>`
    names the role granted.
  - Use ClusterRoleBinding only when the bound ClusterRole needs
    cluster-wide scope. For namespace-scoped access, use
    `kubernetes_role_binding_v1` instead.
  - `role_ref` must reference an existing ClusterRole:
    - `api_group = "rbac.authorization.k8s.io"`.
    - `kind = "ClusterRole"`.
    - `name` — the ClusterRole to bind.
  - `role_ref` is immutable: changing it makes Terraform replace
    the binding (+/-). Subjects lose the granted access briefly
    between destroy and create.
  - Define `subject` blocks specifying:
    - `kind` — `ServiceAccount`, `User`, or `Group`.
    - `name` — the subject identifier.
    - `namespace` — required when kind is `ServiceAccount`.
  - Never bind `cluster-admin` to application ServiceAccounts.
  - Prefer binding to Groups over individual Users for human access.
