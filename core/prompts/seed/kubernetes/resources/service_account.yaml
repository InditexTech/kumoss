description: Kubernetes ServiceAccount default configuration (token mounting, RBAC binding, workload identity).
body: |
  # Kubernetes ServiceAccount

  For a ServiceAccount, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `<app>-<component>-sa`.
  - Create a dedicated ServiceAccount per workload — never use the
    namespace `default` ServiceAccount for application pods.
  - Set `automount_service_account_token = false` as default.
    Override to `true` only when the pod explicitly requires
    Kubernetes API access.
  - Since K8s 1.24, long-lived ServiceAccount tokens are no longer
    auto-created. For workloads that need API access, use the
    TokenRequest API via projected service account token volumes
    for short-lived, automatically rotated tokens.
  - If a legacy long-lived token is required, create a
    `kubernetes_secret` of type `kubernetes.io/service-account-token`
    referencing the ServiceAccount.
  - Pair with a `kubernetes_role_binding` or
    `kubernetes_cluster_role_binding` granting least-privilege access.
  - For cloud-managed clusters, annotate the ServiceAccount for
    workload identity federation:
    - EKS: `eks.amazonaws.com/role-arn`.
    - GKE: `iam.gke.io/gcp-service-account`.
    - AKS: `azure.workload.identity/client-id`.
  - Add `image_pull_secret` references when pods need to pull from
    private container registries.
  - Apply standard labels for identification.
