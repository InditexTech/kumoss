description: Kubernetes NetworkPolicy default configuration (ingress/egress rules, pod selectors).
body: |
  # Kubernetes NetworkPolicy

  For a NetworkPolicy, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `<app>-<purpose>-netpol`.
  - Start with a default-deny-all ingress policy per namespace:
    - `pod_selector {}` (empty = all pods).
    - `policy_types = ["Ingress"]`.
    - No `ingress` rules = deny all inbound traffic.
  - Then add explicit allow policies per workload:
    - Use `pod_selector` with `match_labels` to target specific pods.
    - Define `ingress` rules with `from` blocks using
      `pod_selector`, `namespace_selector`, or `ip_block`.
    - Specify `ports` to restrict by protocol and port number.
  - For egress control:
    - Add `"Egress"` to `policy_types`.
    - Define `egress` rules with `to` blocks and `ports`.
    - Allow DNS egress (port 53, TCP and UDP) to `kube-system`
      namespace for all pods.
  - Use `namespace_selector` with labels to allow cross-namespace
    communication.
  - NetworkPolicies require a CNI plugin that supports them (Calico,
    Cilium, Weave Net). Verify the cluster's CNI before relying on
    policies.
  - Apply standard labels for identification.
