description: Resource-name abbreviations the prompt compositor offers to the LLM.
body: |
  # Kubernetes Resource Name Abbreviations

  Standard short suffixes used in resource names. Names follow
  `<app>-<component>-<suffix>`, where `<component>` is the
  component, purpose or task the object serves (see the Resource
  Creation guidelines). Namespaces carry no suffix: they are named
  `<app>-<environment>`.

  | Resource                       | Suffix  |
  |--------------------------------|---------|
  | Deployment                     | deploy  |
  | StatefulSet                    | sts     |
  | DaemonSet                      | ds      |
  | Job                            | job     |
  | CronJob                        | cj      |
  | Service                        | svc     |
  | Ingress                        | ing     |
  | ConfigMap                      | cm      |
  | Secret                         | secret  |
  | PersistentVolumeClaim          | pvc     |
  | PersistentVolume               | pv      |
  | StorageClass                   | sc      |
  | PriorityClass                  | pc      |
  | ServiceAccount                 | sa      |
  | ClusterRole                    | cr      |
  | ClusterRoleBinding             | crb     |
  | Role                           | role    |
  | RoleBinding                    | rb      |
  | NetworkPolicy                  | netpol  |
  | HorizontalPodAutoscaler        | hpa     |
  | PodDisruptionBudget            | pdb     |
  | ResourceQuota                  | quota   |
  | LimitRange                     | limits  |

  Replace this list with your organization's naming standard.
