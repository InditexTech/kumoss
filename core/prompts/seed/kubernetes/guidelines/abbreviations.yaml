description: Resource-name abbreviations the prompt compositor offers to the LLM.
body: |
  # Kubernetes Resource Name Abbreviations

  Standard short prefixes used in resource names. The LLM may pick
  from this list when generating Terraform.

  | Resource                       | Prefix  |
  |--------------------------------|---------|
  | Namespace                      | ns      |
  | Deployment                     | deploy  |
  | StatefulSet                    | sts     |
  | DaemonSet                      | ds      |
  | Service                        | svc     |
  | Ingress                        | ing     |
  | ConfigMap                      | cm      |
  | Secret                         | sec     |
  | PersistentVolumeClaim          | pvc     |
  | PersistentVolume               | pv      |
  | StorageClass                   | sc      |
  | ServiceAccount                 | sa      |
  | ClusterRole                    | cr      |
  | ClusterRoleBinding             | crb     |
  | Role                           | role    |
  | RoleBinding                    | rb      |
  | NetworkPolicy                  | netpol  |
  | HorizontalPodAutoscaler        | hpa     |
  | PodDisruptionBudget            | pdb     |
  | CronJob                        | cj      |
  | Job                            | job     |
  | ResourceQuota                  | quota   |
  | LimitRange                     | lr      |


  If the resource you are creating is not in this list, you may use the first letter 
  of each word in the resource type as a prefix. For example, for a resource type 
  `kubernetes_some_random_resource_created`, you could use the prefix `srrc`. 

  Replace this list with your organization's naming standard.
