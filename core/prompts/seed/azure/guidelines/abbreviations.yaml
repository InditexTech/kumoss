description: Resource-name abbreviations the prompt compositor offers to the LLM.
body: |
  # Azure Resource Name Abbreviations

  Standard short prefixes used in resource names. The LLM may pick
  from this list when generating Terraform.

  | Resource                       | Prefix |
  |--------------------------------|--------|
  | Resource group                 | rg     |
  | Virtual network                | vnet   |
  | Subnet                         | snet   |
  | Network security group         | nsg    |
  | Public IP                      | pip    |
  | Load balancer                  | lb     |
  | Application gateway            | agw    |
  | Storage account                | st     |
  | Key vault                      | kv     |
  | Virtual machine                | vm     |
  | Managed disk                   | disk   |
  | AKS cluster                    | aks    |
  | Container registry             | acr    |
  | App service                    | app    |
  | App service plan               | asp    |
  | Function app                   | func   |
  | SQL server                     | sql    |
  | SQL database                   | sqldb  |
  | Cosmos DB account              | cosmos |
  | Log Analytics workspace        | log    |
  | Application Insights           | appi   |

  If the resource you are creating is not in this list, you may use the first letter 
  of each word in the resource type as a prefix. For example, for a resource type 
  `azure_some_random_resource_created`, you could use the prefix `srrc`.

  Replace this list with your organization's naming standard.
