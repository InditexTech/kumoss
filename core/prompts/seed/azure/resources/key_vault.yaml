description: Azure Key Vault default configuration (security, networking, lifecycle).
body: |
  # Azure Key Vault

  For a Key Vault, unless explicitly requested otherwise, use the
  following default configuration:

  - SKU tier set to Standard.
  - Do not create any certificate, secret, or key initially.
  - `purge_protection_enabled = true`; once enabled it cannot be
    turned off.
  - `soft_delete_retention_days = 90`; it cannot be changed after
    creation.
  - `rbac_authorization_enabled = true` (required in provider 5.x,
    replacing `enable_rbac_authorization`) — do not use legacy
    access policies.
  - Add a lifecycle block with prevent_destroy for production
    vaults. Changing the name forces replacement of the vault.
  - Network access depends on who writes into the vault. When the
    same configuration creates secrets, keys or certificates (e.g. a
    generated admin password or a CMK), the Kumoss engine, which
    runs outside the VNet, must reach the data plane:
    - Default: `public_network_access_enabled = true` with
      `network_acls { default_action = "Deny", bypass =
      "AzureServices", ip_rules = [...] }` listing the engine egress
      CIDRs the request or workspace provides.
    - Private-only (public access disabled plus a private endpoint)
      only when the request or workspace states the engine runs
      inside the VNet.
  - A vault that only holds secrets written by others may be
    private-only: public network access disabled, `network_acls`
    `default_action = "Deny"` and `bypass = "AzureServices"`, and no
    IP or virtual network rules (they have no effect).
  - A private vault is reached through a private endpoint in the
    dedicated `snet-pe` subnet with a `private_dns_zone_group` to
    `privatelink.vaultcore.azure.net`.
  - Never write data-plane objects into a vault the engine cannot
    reach (it fails with 403 ForbiddenByConnection); state the
    vault's access path in the summary.
  - Naming convention: `kv-<application>-<environment>`.
  - Key Vault names are 3-24 characters and globally unique.
  - Grant consumers access via RBAC role assignments (e.g.
    Key Vault Secrets User, Key Vault Secrets Officer) — never
    use access policies in new configurations.
