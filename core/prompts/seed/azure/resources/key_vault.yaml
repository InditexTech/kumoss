description: Azure Key Vault default configuration (security, networking, lifecycle).
body: |
  # Azure Key Vault

  For a Key Vault, unless explicitly requested otherwise, use the
  following default configuration:

  - SKU tier set to Standard.
  - Do not create any certificate, secret, or key initially.
  - Purge protection must be enabled.
  - Soft-delete retention set to 90 days.
  - Use RBAC authorization mode — do not use legacy access policies.
  - Network restrictions must be enabled with default action set to
    Deny.
  - Add any existing subnet in the project to the allow list of the
    network restriction via virtual network rules.
  - Add a lifecycle block with ignore_changes on the IP rules
    section, so changes to allowed IPs made outside Terraform are
    not reverted.
  - Public network access must be disabled.
  - Apply standard tags: environment and managed_by.
  - Naming convention: `kv-<application>-<environment>`.
  - Key Vault names are 3-24 characters and globally unique.
  - Grant consumers access via RBAC role assignments (e.g.
    Key Vault Secrets User, Key Vault Secrets Officer) — never
    use access policies in new configurations.
