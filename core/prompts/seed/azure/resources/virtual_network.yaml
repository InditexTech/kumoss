description: Azure Virtual Network default configuration (address space, subnets, peering, diagnostics).
body: |
  # Azure Virtual Network

  For a Virtual Network, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `vnet-<application>-<environment>`.
  - Set `location = azurerm_resource_group.<x>.location`; never
    hardcode a region.
  - Allocate a /16 address space from RFC 1918 ranges by default.
    Avoid overlapping with on-premises or peered VNet CIDRs.
  - Do not declare inline `subnet` blocks. Create every subnet as a
    standalone `azurerm_subnet` (see `subnet`): one per tier (web,
    app, data, mgmt) plus `snet-pe` for private endpoints.
  - Carve /24 subnets within the VNet address space.
  - Do not associate a DDoS Network Protection plan by default; it
    carries a significant fixed monthly cost. Add one only when the
    user explicitly requests it.
  - Enable diagnostic settings to send VNet metrics and logs to a
    Log Analytics workspace.
  - One VNet per environment (dev, staging, prod).
  - For multi-environment deployments, use hub-and-spoke topology —
    spoke VNets peer to a single hub; spokes do not peer to each
    other.
