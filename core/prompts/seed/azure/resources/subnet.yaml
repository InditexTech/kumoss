description: Azure Subnet default configuration (addressing, service endpoints, delegation).
body: |
  # Azure Subnet

  For a Subnet, unless explicitly requested otherwise, use the
  following default configuration:

  - Prefer declaring subnets as inline blocks on the parent virtual
    network resource. Use standalone subnet resources only when the
    subnet must be referenced from outside the module that owns the
    VNet.
  - Naming convention: `snet-<purpose>` (e.g. snet-web, snet-app,
    snet-data, snet-mgmt).
  - Address prefix should be carved from the parent VNet CIDR using
    /24 ranges.
  - Enable service endpoints relevant to the workload (e.g.
    Microsoft.Storage, Microsoft.Sql, Microsoft.KeyVault).
  - For Azure Bastion, the subnet name must be exactly
    `AzureBastionSubnet` with a minimum /27 prefix.
  - For Azure Application Gateway, the subnet must be dedicated and
    named `snet-agw` or similar — do not share with other resources.
  - Associate an NSG to every subnet immediately after creation.
  - Private endpoints should be co-located in the consumer's subnet.
