description: Standalone Azure subnet template (when not declared inline on the VNet).
body: |
  # Azure Subnet (standalone)

  Use this only when the subnet must be referenced from outside the
  module that owns its parent VNet. Otherwise prefer inline subnet
  blocks on the `azurerm_virtual_network` resource.

  ```hcl
  resource "azurerm_subnet" "this" {
    name                 = "snet-${var.purpose}"
    resource_group_name  = var.resource_group_name
    virtual_network_name = var.virtual_network_name
    address_prefixes     = [var.address_prefix]

    service_endpoints = var.service_endpoints
  }
  ```

  ## Inputs commonly required
  - `purpose` — what the subnet hosts (`web`, `app`, `data`, `bastion`).
  - `virtual_network_name`, `resource_group_name` — parent references.
  - `address_prefix` — CIDR, e.g. `10.0.1.0/24`.
  - `service_endpoints` — list of service endpoints to enable.

  ## Notes
  - For Azure Bastion, the subnet name MUST be exactly
    `AzureBastionSubnet`.
