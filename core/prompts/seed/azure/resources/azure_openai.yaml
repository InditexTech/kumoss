description: Azure OpenAI Service default configuration (networking, identity, deployments).
body: |
  # Azure OpenAI Service

  For an Azure OpenAI account, unless explicitly requested otherwise,
  use the following default configuration:

  - Naming convention: `oai-<application>-<environment>`.
  - An `azurerm_cognitive_account` with `kind = "OpenAI"` and SKU
    S0 (the only generally available tier).
  - Public network access must be disabled.
  - Configure a private endpoint in the dedicated `snet-pe` subnet
    with a `private_dns_zone_group` to
    `privatelink.openai.azure.com`.
  - Network ACLs default action set to Deny, with no IP rules.
  - Set `local_auth_enabled = false` (API keys disabled). Clients
    authenticate with managed identity and RBAC (Cognitive Services
    OpenAI User role).
  - Enable system-assigned managed identity on the account.
  - Custom subdomain name must be set — it is required for private
    endpoint and Entra ID authentication. Set it at creation and
    never change it: changing it (or `kind`) forces replacement of
    the account.
  - Do not create any model deployments initially unless the user
    specifies which models to deploy.
  - When creating model deployments (`azurerm_cognitive_deployment`,
    whose deployment type and capacity go in the `sku` block), set a
    tokens-per-minute capacity appropriate to the workload. Newer
    models are often only offered with the GlobalStandard or
    DataZoneStandard deployment types; check availability. Prefer
    DataZoneStandard (EU data zone) when data residency in the EU
    matters, Standard (regional) when the model supports it, and
    Provisioned Throughput only on request.
  - Enable diagnostic settings to send logs and metrics to a Log
    Analytics workspace.
  - Content filtering policies are enabled by default — do not
    disable them unless the user explicitly requests it.
  - Model deployments do not support tags.
