description: Azure Application Insights default configuration (workspace-based, retention, sampling).
body: |
  # Azure Application Insights

  For Application Insights, unless explicitly requested otherwise,
  use the following default configuration:

  - Naming convention: `appi-<application>-<environment>`.
  - Must be workspace-based (linked to a Log Analytics workspace).
    Classic (standalone) mode is deprecated and must not be used.
  - Application type set to web unless the user specifies otherwise
    (e.g. java, other).
  - Daily data cap should be configured to prevent unexpected cost
    spikes. Set a cap appropriate to the workload and alert when
    the cap is approaching.
  - Retention period set to 30 days (default). Increase only when
    the user explicitly requests longer retention.
  - Sampling should be enabled to reduce telemetry volume and cost
    while maintaining statistical accuracy. The default adaptive
    sampling rate is appropriate for most workloads.
  - Internet ingestion and query must be enabled or disabled based
    on the network isolation requirements. For private workloads,
    use Azure Monitor Private Link Scope (AMPLS).
  - Disable IP masking only when the user explicitly requests it
    — IP masking is enabled by default for privacy.
  - The instrumentation key and connection string are outputs that
    should be stored in Key Vault or passed via app settings
    references — never hardcode them.
  - Apply standard tags: environment and managed_by.
