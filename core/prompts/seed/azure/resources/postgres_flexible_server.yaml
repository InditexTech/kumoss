description: Azure Database for PostgreSQL Flexible Server default configuration (HA, networking, backups, monitoring).
body: |
  # Azure Database for PostgreSQL — Flexible Server

  For a PostgreSQL Flexible Server, unless explicitly requested
  otherwise, use the following default configuration:

  - Naming convention: `psql-<application>-<environment>`.
  - Use the latest stable PostgreSQL major version unless the user
    specifies otherwise. A major version upgrade restarts the
    server — high impact.
  - SKU tier set to Burstable (B-series) for non-production and
    General Purpose (D-series) for production. Use Memory Optimized
    (E-series) or larger sizes only on explicit request.
  - Storage size should match the workload. Enable auto-grow so the
    server scales storage automatically when nearing capacity.
    Storage can only grow, never shrink.
  - High availability must be enabled for production with
    zone-redundant mode (standby in a different AZ) in regions that
    support availability zones; use same-zone HA only when
    zone-redundant is not available in the region, and state the
    assumption. Azure moves `zone` and the standby zone on failover,
    so add them to `lifecycle { ignore_changes }` instead of letting
    Terraform fail back.
  - Public network access must be disabled. Use VNet integration
    (a subnet delegated to
    `Microsoft.DBforPostgreSQL/flexibleServers`, dedicated to the
    server) or, on request, a private endpoint in `snet-pe`.
    Changing the networking mode (`delegated_subnet_id`,
    `private_dns_zone_id`) forces replacement, as does
    `administrator_login`.
  - Private DNS zone must be linked to the VNet for name resolution.
  - Authentication: prefer Microsoft Entra ID only, with password
    authentication disabled and an Entra administrator set. When
    password authentication is required, generate the administrator
    password with `random_password`, store it as a Key Vault secret,
    and mark any variable or output carrying it `sensitive = true`.
    Never put the password in a variable default, tfvars, or plain
    output.
  - Backup retention set to 7 days minimum. Geo-redundant backup
    should be enabled for production (`geo_redundant_backup_enabled`
    can only be set at creation; changing it on an existing server
    forces replacement, so never retrofit it without a request).
  - Define a maintenance window (day, hour) to control when
    maintenance occurs.
  - Enable diagnostic settings to send PostgreSQL logs and metrics
    to a Log Analytics workspace.
  - Add a lifecycle block with prevent_destroy.
  - Server parameters should be configured via a separate
    configuration resource for auditability.
  - Server configurations and databases do not support tags.
