description: Azure Resource Group default configuration (naming, tagging, region).
body: |
  # Azure Resource Group

  For a Resource Group, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `rg-<application>-<environment>`.
  - Location should match the primary deployment region.
  - A resource group is the foundational container — every module
    should begin with one.
  - Child resources do not inherit the resource group's location:
    set `location = azurerm_resource_group.<x>.location` on every
    resource that takes one, and never hardcode regions on
    individual resources.
  - Changing the name or location of a resource group forces its
    replacement together with everything in it; never change them
    without an explicit request, and call it out in the summary.
  - One resource group per application per environment, unless the
    user explicitly requests a shared resource group.
