description: Azure Virtual Machine default configuration (managed disks, identity, networking, monitoring).
body: |
  # Azure Virtual Machine

  For a Virtual Machine, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `vm-<application>-<environment>`.
  - Use `azurerm_linux_virtual_machine` (default) or
    `azurerm_windows_virtual_machine` when the user specifies
    Windows. Never use the legacy `azurerm_virtual_machine`
    resource.
  - Build exactly what was requested. When a production workload
    would be better served by a scale set (self-healing, scaling),
    suggest `vm_scale_set` in the summary instead of substituting it.
  - VM size should match the workload. Prefer B-series for
    non-production and D-series or E-series for production. Do not
    provision sizes above that default without explicit request.
    Changing `size` restarts the VM — high impact.
  - OS disk must use managed disks with Premium SSD (Premium_LRS)
    for production or Standard SSD (StandardSSD_LRS) for
    non-production.
  - OS disk encryption must be enabled (enabled by default with
    platform-managed keys; use customer-managed keys via Disk
    Encryption Set when requested).
  - Set `zone` for production VMs in regions that support
    availability zones (state the assumption); omit it elsewhere.
    Its managed disks and any zonal public IP or NAT Gateway use the
    same zone. Changing `zone`, the source image, `admin_username`,
    or `custom_data` forces replacement — never retrofit them
    without a request.
  - Disable public IP assignment. Place the VM in a private subnet
    and use Azure Bastion or a load balancer for access.
  - Enable system-assigned managed identity for authentication to
    other Azure services — avoid storing credentials on the VM.
  - Use SSH key authentication for Linux VMs. Do not use password
    authentication — set disable_password_authentication to true.
    Pass the public key as a variable; never generate or output a
    private key.
  - For Windows VMs, use Azure AD join where possible, and generate
    the admin password with `random_password` stored in Key Vault;
    never a variable default or output.
  - Configure the guest only through `custom_data` (base64-encoded
    cloud-init). Never use the CustomScript extension,
    `azurerm_virtual_machine_run_command`, or provisioners. Never
    put secrets in `custom_data`; read them from Key Vault at boot
    with the managed identity. Changing `custom_data` forces
    replacement.
  - Add `boot_diagnostics {}` with no storage account URI, so Azure
    uses managed storage.
  - Install the Azure Monitor Agent extension only together with an
    `azurerm_monitor_data_collection_rule` (destination: the
    environment's Log Analytics workspace) and an
    `azurerm_monitor_data_collection_rule_association` to the VM;
    without a DCR the agent collects nothing.
  - Non-production VMs get an auto-shutdown schedule: an
    `azurerm_dev_test_global_vm_shutdown_schedule` with
    `virtual_machine_id`, `location` (the VM's), `enabled = true`,
    `daily_recurrence_time` (e.g. `"1900"`), `timezone` (the team's
    Windows time zone ID, e.g. `"W. Europe Standard Time"`), and
    `notification_settings { enabled = false }`.
  - Associate a Network Security Group to the VM's subnet, not
    directly to the NIC, unless per-NIC filtering is required.
