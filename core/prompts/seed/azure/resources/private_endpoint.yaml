description: Azure Private Endpoint default configuration (dedicated subnet, service connection, DNS zone group).
body: |
  # Azure Private Endpoint

  For a Private Endpoint, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `pep-<target-resource-name>-<subresource>`
    (e.g. `pep-kv-shop-prod-vault`).
  - `azurerm_private_endpoint` with
    `location = azurerm_resource_group.<x>.location` (the VNet's
    region) and `subnet_id` pointing at the dedicated `snet-pe`
    subnet. Never place it in a delegated subnet.
  - One `private_service_connection` with
    `private_connection_resource_id` set to the target resource,
    `is_manual_connection = false`, and `subresource_names` set to
    the target sub-resource, for example `blob` or `file` (storage),
    `vault` (Key Vault), `registry` (Container Registry),
    `namespace` (Service Bus), `account` (Azure OpenAI),
    `postgresqlServer` (PostgreSQL Flexible Server), `Sql` (Cosmos
    DB NoSQL).
  - Always add a `private_dns_zone_group` (name `default`) with
    `private_dns_zone_ids` pointing at the matching `privatelink.*`
    zone from the `private_dns_zone` template, so the A record is
    managed automatically. Never create A records by hand.
  - Set `custom_network_interface_name = "nic-<endpoint-name>"` for
    predictable NIC names.
  - Changing the subnet, target resource, or sub-resource forces
    replacement and briefly breaks private connectivity — high
    impact.
  - Disable public network access on the target resource; do not
    keep IP or VNet firewall rules there as well.
