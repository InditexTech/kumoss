description: Azure Storage account template (Storage account, blob, file, queue, table).
body: |
  # Azure Storage Account

  ```hcl
  resource "azurerm_storage_account" "main" {
    name                            = "st${var.application}${var.environment}"
    resource_group_name             = azurerm_resource_group.main.name
    location                        = azurerm_resource_group.main.location
    account_tier                    = "Standard"
    account_replication_type        = "LRS"
    min_tls_version                 = "TLS1_2"
    public_network_access_enabled   = false
    allow_nested_items_to_be_public = false

    blob_properties {
      versioning_enabled = true
      delete_retention_policy {
        days = 7
      }
    }

    tags = {
      environment = var.environment
      managed_by  = "terraform"
    }
  }
  ```

  ## Notes
  - Storage account names are 3-24 characters, lowercase, alphanumeric
    only, and globally unique. The `st<app><env>` pattern usually
    works but may need a suffix in shared subscriptions.
  - `public_network_access_enabled = false` is the default; if public
    access is genuinely required, the request must say so explicitly.
  - Pair with `azurerm_private_endpoint` when consumers live inside a
    VNet.
