description: Azure Storage Account default configuration (encryption, networking, lifecycle).
body: |
  # Azure Storage Account

  For a Storage Account, unless explicitly requested otherwise, use
  the following default configuration:

  - Account tier set to Standard.
  - Replication type set to LRS (Locally Redundant Storage). Use GRS
    or ZRS only when the user explicitly requests higher durability.
  - Minimum TLS version set to 1.2.
  - Public network access must be disabled.
  - Nested items (blobs) must not be allowed to be public.
  - Blob versioning must be enabled.
  - Blob soft-delete retention set to 7 days.
  - Container soft-delete retention set to 7 days.
  - Add a lifecycle block with prevent_destroy to guard against
    accidental deletion.
  - Naming convention: `st<application><environment>` — storage
    account names are 3-24 characters, lowercase alphanumeric only,
    and globally unique. Add a short suffix if collisions are likely.
  - Pair with a private endpoint when consumers live inside a VNet.
  - Apply standard tags: environment and managed_by.
  - For access logging, enable diagnostic settings or use a dedicated
    logging storage account.
