description: VMware vSphere actions Kumoss must never generate (security, platform and cost guardrails).
body: |
  # STRICTLY FORBIDDEN VMWARE VSPHERE ACTIONS

  Never generate Terraform that performs any of the following. If a
  request requires one of these, refuse and explain why.

  ## Platform and hosts
  - Managing ESXi hosts or their configuration: `vsphere_host`,
    `vsphere_host_port_group`, `vsphere_host_virtual_switch`,
    `vsphere_vnic`, `vsphere_host_config_*` and similar host-level
    resources belong to the platform team.
  - Enabling SSH or the ESXi Shell, placing hosts in maintenance
    mode, or removing hosts from a cluster.
  - Disabling vSphere HA or DRS on an existing compute cluster.
  - Managing licenses (`vsphere_license`) or vCenter-wide settings.
  - Attaching virtual machines to management, vMotion, vSAN, NFS or
    iSCSI storage networks.

  ## Networking
  - Port groups with `allow_promiscuous`, `allow_forged_transmits`
    or `allow_mac_changes` set to `true` without an explicit user
    request (promiscuous mode exposes all traffic on the segment).
  - VLAN trunk port groups (`vlan_range` covering 0-4094) for
    workload virtual machines.
  - Placing workload virtual machines on VLAN 0, VLAN 1 or the
    native VLAN.

  ## Identity and access
  - Provider blocks with `allow_unverified_ssl = true` (or any
    `allow_unverified_ssl`, `vsphere_server`, `user` or `password`
    argument): TLS verification and credentials come from the IaC
    engine's environment, which enables unverified TLS only in labs.
  - Assigning the built-in `Administrator` role, or a custom role with
    all privileges, to any principal.
  - Entity permissions on the vCenter root folder or a datacenter
    with `propagate = true` without an explicit user request.
  - `vsphere_entity_permissions` on an object not created in the same
    workspace: the resource is authoritative and removes permissions
    granted outside Terraform.
  - Permissions granted to individual users instead of SSO groups.
  - Literal vCenter credentials, guest OS passwords, private keys or
    tokens in Terraform code, variable defaults, outputs,
    `extra_config`, `vapp` properties or `customize` blocks. Never
    declare a required variable for them either: the engine cannot
    supply it. Generate credentials with `random_password` (for
    example the Windows `admin_password`; the value lands in the
    state), mark outputs that carry them `sensitive = true`, and for
    Linux guests rely on the template's own key-based access with no
    password. `guestinfo` / `extra_config` values are readable by any
    vCenter user with read access to the VM.

  ## Data
  - Changes that force replacement of a virtual machine, a
    `vsphere_virtual_disk`, a datastore cluster or a content library
    (see "Deletion safeguards" in the resource creation guidelines)
    unless the user explicitly asked for the replacement. Standalone
    deletions are always rejected by the compliance check, even when
    requested.
  - Removing `lifecycle.prevent_destroy` from resources that already
    have it, without an explicit user request.
  - Disabling VM encryption, or removing an encryption storage
    policy or vTPM device, from an existing virtual machine or disk
    without an explicit user request.
  - Disks in `independent_nonpersistent` mode for data that must
    survive a power cycle.
  - Managing `vsphere_virtual_machine_snapshot` resources at all.
    Snapshots are an operational tool, not infrastructure as code,
    and never a backup mechanism.

  ## Cost and capacity
  - Virtual machines above 16 vCPUs or 128 GB of memory without an
    explicit user request.
  - CPU or memory reservations, or `memory_reservation_locked_to_max`,
    without an explicit user request.
  - Thick eager-zeroed disks (`eagerly_scrub = true`) without an
    explicit user request.
  - PCI passthrough or vGPU devices (`pci_device_id`) without an
    explicit user request.
  - Deploying OVF/OVA images from URLs outside the organization's
    approved artifact repository or content library.

  Replace this body with your organization's authoritative
  forbidden-action policy.
