description: VMware vSphere RBAC and identity conventions.
body: |
  # VMware vSphere Permissions Guidelines

  ## Model
  - vSphere access is a permission that binds a principal (user or
    group) to a role (a set of privileges) on an inventory object,
    optionally propagating to its children.
  - Grant the narrowest role on the narrowest object: a VM folder,
    resource pool, datastore or port group. Never grant on the
    datacenter or the vCenter root by default; do so only on an
    explicit user request, and with `propagate = true` there only
    when the request says so.
  - Use `propagate = true` only on folders and resource pools that
    exist for the workload being granted.

  ## Roles
  - Prefer the built-in `ReadOnly` and `NoAccess` roles where they
    suffice. For anything else, create a custom role with the
    explicit privilege list the use case needs.
  - Never assign the built-in `Administrator` role and never create
    a role holding all privileges.
  - Name custom roles after their purpose, e.g.
    `role-<application>-vm-operator`.

  ## Principals
  - Grant permissions to SSO or identity-provider groups, never to
    individual users or to `vsphere.local` local accounts.
  - The account Terraform runs as is a dedicated service account
    holding only the privileges needed on the target folders,
    resource pools, datastores and networks.

  ## Credentials
  - The IaC engine supplies `VSPHERE_SERVER`, `VSPHERE_USER` and
    `VSPHERE_PASSWORD` from its environment; never set `user` or
    `password` in the provider block and never add credential
    variables.
  - Guest OS passwords are generated with `random_password` (the
    value lands in the state; outputs carrying it are
    `sensitive = true`); never declare a required variable for them.
  - TLS verification is controlled by the engine environment
    (`VSPHERE_ALLOW_UNVERIFIED_SSL`, set only in labs); never set
    `allow_unverified_ssl` in code. Outside labs verification stays
    on and the vCenter certificate is trusted through the system CA
    store.

  Replace this body with your organization's authoritative access
  standards.
