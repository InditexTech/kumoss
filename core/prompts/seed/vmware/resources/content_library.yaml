description: VMware vSphere content library default configuration (templates, publication, storage).
body: |
  # VMware vSphere Content Library

  For a `vsphere_content_library`, unless explicitly requested
  otherwise, use the following default configuration:

  - Naming convention: `cl-<purpose>-<site>`.
  - Use a content library to distribute approved VM templates, OVF
    and ISO images; do not copy templates by hand between vCenters.
  - `storage_backing` points to a shared datastore, looked up with
    `data "vsphere_datastore"`.
  - Do not publish the library unless requested. When it is
    published, set `authentication_method = "BASIC"` with a password
    from `random_password` (the value lands in the state; expose it
    only through a `sensitive = true` output).
  - Subscribed libraries set `on_demand = true` to download items
    only when used.
  - `vsphere_content_library_item` sources (`file_url`) must point at
    the organization's approved artifact repository over HTTPS (see
    the `content_library_item` template).
  - Changing `storage_backing` replaces the library and every item
    in it; never change it on an existing library unless the user
    asked for the replacement, and call it out.
  - Add `lifecycle { prevent_destroy = true }` for libraries that
    hold production templates.
