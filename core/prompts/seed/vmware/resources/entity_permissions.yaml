description: VMware vSphere entity permissions default configuration (group, role, scope, propagation).
body: |
  # VMware vSphere Entity Permissions

  For a `vsphere_entity_permissions`, unless explicitly requested
  otherwise, use the following default configuration:

  - Grant on the narrowest object: the workload's VM folder or
    resource pool (`entity_type = "Folder"` or `"ResourcePool"`), not
    the datacenter or the vCenter root.
  - Each `permissions` block names an identity-provider group
    (`user_or_group = "<DOMAIN>\\<group>"`, `is_group = true`); never
    an individual user or a `vsphere.local` account.
  - `role_id` references a `vsphere_role` or the built-in role looked
    up with `data "vsphere_role"`; never the `Administrator` role.
  - `propagate = true` only on folders and resource pools dedicated
    to the workload.
  - The resource is authoritative for the entity's permissions:
    applying it removes any permission on that entity that is not
    listed, including ones granted outside Terraform. Only target
    folders and resource pools created in the same workspace; never
    point it at a shared or pre-existing object, and warn about this
    in the summary.
  - Changing `entity_id` or `entity_type` replaces the resource:
    permissions on the old entity are removed. Call it out.
  - Keep all permissions for one entity in a single resource; do not
    split them across several `vsphere_entity_permissions` blocks.
