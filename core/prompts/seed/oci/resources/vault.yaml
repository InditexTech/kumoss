description: OCI Vault default configuration (vault type, master encryption key, secrets).
body: |
  # OCI Vault

  For Vault resources, unless explicitly requested otherwise, use
  the following default configuration:

  ## Vault
  - Naming convention: `vlt-<application>-<environment>`.
  - Vault type: DEFAULT for general use. Use VIRTUAL_PRIVATE only
    when the user requires a dedicated HSM partition (higher cost).
    `vault_type` is immutable; changing it replaces the vault and
    every key in it.
  - Create the vault in the application compartment.
  - Do not create secrets or keys inline with the vault — use
    separate resources.
  - Add a lifecycle block with prevent_destroy for production
    vaults. Vault deletion has a mandatory 7-30 day pending
    deletion period.

  ## Master Encryption Key
  - Naming convention: `key-<purpose>-<application>-<environment>`.
  - `management_endpoint` comes from the vault.
  - `key_shape.length` is in BYTES, not bits: AES-256 is
    `key_shape { algorithm = "AES", length = 32 }` (the default for
    symmetric encryption). RSA uses 256, 384 or 512 bytes (2048,
    3072 or 4096 bits); use RSA or ECDSA only for asymmetric use
    cases such as signing.
  - Protection mode: HSM for production. SOFTWARE only for
    non-production cost optimization. `protection_mode` forces
    replacement of the key, and so does `key_shape` — never change
    either on an existing key; create a new key and re-key consumers
    instead.
  - Rotate production keys every 90 days. Use automatic key
    rotation only on vault types that support it (historically
    VIRTUAL_PRIVATE); otherwise document a manual rotation.
  - Consuming services need service policies before they can use
    the key (see the CMEK notes in each resource template).

  ## Secrets
  - Naming convention: `secret-<name>-<environment>`.
  - Store all sensitive values (database passwords, API keys,
    certificates) as vault secrets.
  - Prefer `enable_auto_generation = true` with a
    `secret_generation_context` (e.g. a passphrase or database
    password template), so the value is generated by the service.
  - `oci_vault_secret` with `secret_content` stores the content in
    Terraform state. Use it only when the value must come from
    Terraform, never with a literal or a variable default, and
    state this in the summary. Never put secrets in outputs.
  - Use secret versions for rotation. Set expiry rules where
    applicable.
  - Grant access via IAM policies to specific groups or dynamic
    groups — never grant broad vault access.
