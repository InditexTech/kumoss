description: OCI Subnet default configuration (CIDR, access type, route table).
body: |
  # OCI Subnet

  For a Subnet, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `snet-<purpose>-<application>-<environment>`.
  - Use regional subnets (spanning all availability domains) unless
    AD-specific placement is explicitly required.
  - Default to private subnets. Only create public subnets for load
    balancers, bastion hosts, or resources that explicitly need
    direct internet access.
  - Private subnets set `prohibit_public_ip_on_vnic = true`. It is
    immutable: changing it replaces the subnet, which fails or
    disrupts everything attached to it.
  - CIDR block should be carved from the parent VCN CIDR with room
    for growth. Typical sizes: /24 for general workloads, /28 for
    small utility subnets.
  - Set `dns_label`: at most 15 alphanumeric characters, starting
    with a letter, no hyphens, unique within the VCN. It is
    immutable — changing it replaces the subnet.
  - `vcn_id` and `availability_domain` (regional versus
    AD-specific) also force replacement — never change them on an
    existing subnet without an explicit request.
  - Associate with a custom route table (see `route_table`) — do not
    use the VCN default route table.
  - Associate with a custom security list or Network Security Group
    — do not rely on the default security list.
  - For private subnets, the route table should include a NAT
    Gateway rule for outbound internet access and a Service Gateway
    rule for Oracle services.
  - For public subnets, the route table should include an Internet
    Gateway rule.
