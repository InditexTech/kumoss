description: AWS CloudWatch default configuration (log groups, metric alarms, dashboards).
body: |
  # AWS CloudWatch

  For CloudWatch resources, unless explicitly requested otherwise,
  use the following default configuration:

  ## Log Groups
  - Naming convention: `/app/<application>/<environment>` for
    application logs; follow AWS service conventions for service
    logs (e.g. `/aws/lambda/<function-name>`).
  - Tag naming convention: `cwlog-<application>-<environment>`.
  - Always set a retention period (e.g. 30, 60, or 90 days). The
    default is infinite retention, which accumulates cost over time.
  - CloudWatch Logs always encrypts log data at rest with
    service-managed keys; leave `kms_key_id` unset by default. Use a
    customer-managed KMS key only when the request or the workspace
    requires one (reuse an existing logs key rather than creating a
    new one), in the same region. Its key policy must then allow
    the CloudWatch Logs service principal
    (`logs.<region>.amazonaws.com`) `kms:Encrypt*`,
    `kms:Decrypt*`, `kms:ReEncrypt*`, `kms:GenerateDataKey*`, and
    `kms:Describe*`, with an `ArnLike` condition on
    `kms:EncryptionContext:aws:logs:arn` matching
    `arn:aws:logs:<region>:<account-id>:log-group:<name>` (or a
    name prefix with `*`). Build the ARNs from the
    `aws_caller_identity` and `aws_region` data sources
    (`data.aws_region.current.region` in provider v6).
  - Use STANDARD log group class by default. Use INFREQUENT_ACCESS
    class for log groups that are rarely queried to reduce ingestion
    costs by approximately 50%. `name` and `log_group_class` apply at
    creation; on an existing log group they force replacement and
    lose the stored logs.
  - Dashboards take no tags.

  ## Metric Alarms
  - Naming convention:
    `cwalarm-<application>-<metric>-<environment>`.
  - Set treat_missing_data to "missing" — this preserves the alarm
    state when data points are absent rather than triggering false
    positives (breaching) or silently resolving (notBreaching).
  - Always configure alarm actions (SNS topic ARNs) for
    notification and OK actions for recovery notification.
  - Use composite alarms to combine multiple related alarms into a
    single actionable alert and reduce notification noise.
  - For application-specific metrics, publish custom metrics via
    the CloudWatch agent or PutMetricData API.

  ## Dashboards
  - Naming convention: `cwdash-<application>-<environment>`.
  - Define dashboard widgets as a structured JSON body.
  - Build the widget list in a local variable for readability.
  - Group related metrics into logical widget sections (e.g.
    compute, database, application).
