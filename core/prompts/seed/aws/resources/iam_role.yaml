description: AWS IAM Role default configuration (trust policy, least-privilege, boundaries).
body: |
  # AWS IAM Role

  For an IAM Role, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `role-<application>-<workload>-<environment>`.
  - One role per workload — do not share roles across unrelated
    workloads.
  - Define the trust policy (assume role policy) using a policy
    document data source, not an inline JSON string — this provides
    type checking and composability.
  - Scope the trust policy to the specific AWS service principal
    that will assume the role (e.g. ec2.amazonaws.com,
    lambda.amazonaws.com).
  - To prevent confused-deputy attacks, add `aws:SourceAccount` or
    `aws:SourceArn` conditions to the trust policy only for services
    that document support for them when assuming the role. Do not
    add them for `ec2.amazonaws.com` (instance profiles) or any
    service that does not send these keys, or the role cannot be
    assumed.
  - Attach managed policies using additive attachments. Never use
    authoritative policy attachment resources, as they remove other
    attachments on the same policy.
  - For inline policies scoped to a single role, define them using
    a policy document data source attached to the role.
  - Set a permissions boundary when the organization enforces IAM
    boundaries to cap effective permissions.
  - Use a path (e.g. /app/) to organize roles hierarchically and
    enable path-based IAM policy scoping. `name` and `path` apply at
    creation; on an existing role or policy they force replacement,
    which breaks every instance profile and trust reference to it.
    Never retrofit them unless asked.
  - Policy attachments take no tags.
