description: AWS Aurora Cluster default configuration (Multi-AZ, encryption, backups, monitoring).
body: |
  # AWS Aurora Cluster

  For an Aurora Cluster, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `aurora-<application>-<environment>` for the
    cluster and `aurora-<application>-<environment>-<index>` for
    each instance.
  - Create a DB subnet group using private subnets across at least
    two availability zones.
  - Storage encryption must be enabled with KMS. Specify a
    customer-managed key when provided; otherwise the AWS-managed
    key is acceptable. `storage_encrypted` and `kms_key_id` apply at
    creation; on an existing cluster they force replacement, as do
    `cluster_identifier`, `engine`, `db_subnet_group_name`, and an
    instance's `availability_zone`.
  - Use managed master user password (Secrets Manager integration)
    — never hardcode database passwords in variables or outputs.
  - Create a minimum of 2 cluster instances for production (writer
    plus at least one reader in a separate AZ) for compute high
    availability. Aurora automatically replicates data across three
    AZs at the storage layer.
  - All instances must have publicly accessible set to false.
  - Automated backup retention set to 7 days minimum.
  - Define a preferred backup window and maintenance window that do
    not overlap.
  - Copy tags to snapshots must be enabled.
  - `skip_final_snapshot = false` with a `final_snapshot_identifier`
    (e.g. `aurora-<application>-<environment>-final`).
  - `deletion_protection = true` on the cluster.
  - Add a lifecycle block with prevent_destroy on the cluster.
  - Auto minor version upgrade must be enabled on all instances.
  - Enable Performance Insights on each instance with 7-day
    retention (free tier) only on instance classes that support it;
    small burstable classes may not, so check the engine's support
    matrix before enabling it. AWS is moving Performance Insights to
    CloudWatch Database Insights; when the provider version and
    region support Database Insights, prefer its standard mode, and
    enable the advanced (paid) mode only on request.
  - Enhanced Monitoring must be enabled on each instance with a
    60-second interval. This requires an IAM role with the
    AmazonRDSEnhancedMonitoringRole managed policy.
  - Enable CloudWatch log exports relevant to the engine (e.g.
    postgresql for Aurora PostgreSQL; audit, error, and slowquery
    for Aurora MySQL).
  - Prefer Graviton-based instance classes (db.r7g) for production
    and db.t4g for non-production.
  - For variable or unpredictable workloads, consider Aurora
    Serverless v2 by using the serverless instance class with
    scaling configuration on the cluster.
  - Define cluster instances as separate resources (not using count
    on the cluster) so each can be individually managed and placed.
    Leave `availability_zone` unset on instances (AWS spreads them)
    or take it from `data "aws_availability_zones"`; never hardcode
    AZ names.
  - Non-production clusters get an EventBridge Scheduler stop/start
    schedule, as in the `ec2` template, with the targets
    `arn:aws:scheduler:::aws-sdk:rds:stopDBCluster` and
    `arn:aws:scheduler:::aws-sdk:rds:startDBCluster`, `input =
    jsonencode({ DbClusterIdentifier =
    aws_rds_cluster.<name>.cluster_identifier })`, and a scheduler
    role allowed `rds:StopDBCluster` and `rds:StartDBCluster` on the
    cluster ARN. Aurora starts a stopped cluster again
    automatically after seven days; the daily stop schedule stops it
    again. For Aurora Serverless v2, a minimum capacity of 0 ACUs
    (automatic pause) is an alternative where the engine version
    supports it.
