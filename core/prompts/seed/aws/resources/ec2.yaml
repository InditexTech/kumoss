description: AWS EC2 Instance default configuration (IMDSv2, encryption, monitoring, SSM, non-production schedule).
body: |
  # AWS EC2 Instance

  For an EC2 Instance, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `ec2-<application>-<environment>`.
  - Use an `aws_ami` data source with `most_recent = true` and
    `owners = ["amazon"]` (provider v6 rejects `most_recent` lookups
    without `owners` or an owner/image ID filter), filtered by name
    pattern, HVM virtualization type, and an
    `architecture` filter that matches the instance type (`arm64`
    for Graviton types, `x86_64` otherwise). An arm64 AMI on an
    x86 instance type (or the reverse) fails at launch.
  - Instance metadata service must enforce IMDSv2 (http_tokens
    required, hop limit 1) to prevent SSRF-based credential theft.
  - Associate public IP must be disabled. For internet-facing
    workloads, use a load balancer (ALB or NLB) in front of
    instances in private subnets.
  - Root volume must use gp3 storage type with encryption enabled
    via KMS. Encryption and the KMS key apply at creation; on an
    existing instance they force replacement, so never add them to
    one unless the user asked for the replacement.
  - Place the instance in a private subnet chosen from the
    workspace's subnets; `subnet_id`, `availability_zone`, and
    `ami` also force replacement.
  - Set CPU options with the `cpu_options` block (`core_count`,
    `threads_per_core`); the top-level `cpu_core_count` and
    `cpu_threads_per_core` were removed in provider v6.
  - Attach an IAM instance profile for the role the instance
    assumes — never use long-lived access keys on instances.
  - Enable detailed CloudWatch monitoring (1-minute intervals, billed
    per metric) in production only; non-production keeps basic
    5-minute monitoring unless requested.
  - Add a lifecycle block with ignore_changes on the AMI to prevent
    drift when the AMI data source resolves a newer image. Remove
    this if Terraform should trigger re-creation on new AMIs.
  - Prefer Graviton-based instance types (t4g, m7g, c7g) for
    better price-performance, together with the arm64 AMI filter
    above. Use x86 types only when the workload has native x86
    dependencies.
  - For production workloads, use an Auto Scaling group
    (`auto_scaling_group` with a `launch_template`) instead of
    standalone instances for self-healing and horizontal scaling.
  - Connect via SSM Session Manager instead of SSH — this requires
    no SSH keys, no bastion host, and no inbound security group
    rules. Attach the AmazonSSMManagedInstanceCore managed policy
    to the instance role.
  - Configure the guest only through `user_data` (shell script or
    cloud-init) — never provisioners. Never put secrets in
    `user_data`; it is readable from the instance metadata and the
    EC2 API. Fetch secrets from Secrets Manager or SSM Parameter
    Store at boot.
  - Changing `user_data` on an existing instance stops and starts it
    (or replaces it when `user_data_replace_on_change = true`). Both
    are high impact: state the restart or replacement in the
    summary. Provider v6 stores `user_data` in clear text in the
    state; use `user_data_base64` for pre-encoded content.
  - Tag the root volume through `root_block_device.tags` (never
    mixed with `volume_tags`).

  ## Non-production stop/start schedule
  Standalone non-production instances get an EventBridge Scheduler
  stop/start schedule (e.g. stop 20:00, start 07:00 on weekdays in
  the team's time zone):

  - Two `aws_scheduler_schedule` resources,
    `sch-<application>-<environment>-stop` and `-start`, with
    `schedule_expression = "cron(0 20 ? * MON-FRI *)"` (and the
    start time), `schedule_expression_timezone` set to the team's
    time zone, and `flexible_time_window { mode = "OFF" }`.
  - `target.arn` is the universal SDK target
    `arn:aws:scheduler:::aws-sdk:ec2:stopInstances` (or
    `...:ec2:startInstances`), with `input = jsonencode({
    InstanceIds = [aws_instance.<name>.id] })`.
  - A dedicated scheduler role
    (`role-<application>-scheduler-<environment>`) trusted by
    `scheduler.amazonaws.com` with an `aws:SourceAccount`
    condition, allowed `ec2:StopInstances` and `ec2:StartInstances`
    on the instance ARN only. When the volumes use a
    customer-managed KMS key, also allow `kms:CreateGrant` on that
    key with `kms:GrantIsForAWSResource = true`, or the start
    fails.
  - Schedules take no `tags`; put them in an
    `aws_scheduler_schedule_group` per application when tagging is
    required.
