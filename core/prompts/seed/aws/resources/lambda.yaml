description: AWS Lambda Function default configuration (Graviton, tracing, DLQ, logging, VPC).
body: |
  # AWS Lambda Function

  For a Lambda Function, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `lmb-<application>-<purpose>-<environment>`.
  - Architecture set to arm64 (Graviton), which is approximately
    20% cheaper and often faster. Use x86_64 only when native
    dependencies require it.
  - The execution role must have the AWSLambdaBasicExecutionRole
    managed policy. If the function is VPC-attached, also add
    AWSLambdaVPCAccessExecutionRole.
  - Do not set `reserved_concurrent_executions` unless requested.
    New accounts can have a low concurrency quota, and AWS rejects a
    reservation that leaves less than the minimum unreserved
    concurrency. When requested, size it to the downstream limits.
  - In production, or on request, enable AWS X-Ray active tracing
    (`tracing_config { mode = "Active" }`) and attach the
    AWSXRayDaemonWriteAccess managed policy to the execution role.
  - For asynchronous invocations, configure a dead-letter queue
    (SQS or SNS) in `dead_letter_config` so no events are silently
    lost, and grant the execution role `sqs:SendMessage` (or
    `sns:Publish`) scoped to that queue or topic ARN only. An
    on-failure destination on `aws_lambda_function_event_invoke_config`
    is an alternative.
  - Create the CloudWatch log group explicitly in Terraform with a
    defined retention period (e.g. 30 days). If not created
    explicitly, Lambda auto-creates the log group with infinite
    retention. Log data is always encrypted at rest with
    service-managed keys; add a customer-managed key only as the
    `cloudwatch` template describes.
  - Log group naming convention:
    `/aws/lambda/<function-name>`.
  - When the function accesses VPC resources (RDS, ElastiCache,
    etc.), attach it to private subnets. VPC-attached Lambdas need
    a NAT Gateway for outbound internet access; use VPC endpoints
    for AWS service calls to avoid NAT costs.
  - Use source code hash to trigger redeployment when the package
    changes.
  - For container-based Lambda, use image URI and Image package
    type instead of filename, handler, and runtime.
  - Never put secrets in `environment` variables; read them from
    Secrets Manager or SSM Parameter Store at runtime.
