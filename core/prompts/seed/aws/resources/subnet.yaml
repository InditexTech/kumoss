description: AWS Subnet default configuration (AZ placement, public IP, routing).
body: |
  # AWS Subnet

  For a Subnet, unless explicitly requested otherwise, use the
  following default configuration:

  - Naming convention: `snet-<purpose>-<environment>` (e.g.
    snet-web-prod, snet-app-dev, snet-data-staging).
  - Carve /24 CIDR blocks from the parent VPC address space.
  - `map_public_ip_on_launch = false` on every subnet, public ones
    included. Load balancers and NAT Gateways get public addresses
    without it; instances belong in private subnets.
  - For high availability, create one subnet per availability zone
    per tier, iterating over the AZs read from `data
    "aws_availability_zones" "available"` (up to three, as many as
    the region has) and suffixing the name with the AZ; never
    hardcode AZ names or letters.
  - `cidr_block`, `availability_zone`, and `vpc_id` force
    replacement; never change them on an existing subnet unless
    asked.
  - Associate each subnet with an explicit route table. Subnets
    without an explicit association use the VPC main route table,
    which may have unintended routes.
  - One subnet tier per function: public, app, data, mgmt.
  - Public subnets route 0.0.0.0/0 through the Internet Gateway.
  - Private subnets route 0.0.0.0/0 through a NAT Gateway deployed
    in a public subnet.
