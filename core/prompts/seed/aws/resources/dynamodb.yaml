description: AWS DynamoDB Table default configuration (on-demand, encryption, PITR, deletion protection).
body: |
  # AWS DynamoDB Table

  For a DynamoDB Table, unless explicitly requested otherwise, use
  the following default configuration:

  - Naming convention: `ddb-<application>-<table>-<environment>`.
  - The table name, `hash_key`, `range_key`, and local secondary
    indexes apply at creation; on an existing table changing them
    forces replacement and loses the data.
  - Billing mode set to PAY_PER_REQUEST (on-demand), which scales
    automatically with no capacity planning. Switch to PROVISIONED
    only when the user provides explicit read/write capacity values
    and auto-scaling configuration.
  - Define attribute blocks only for the partition key, sort key,
    and any GSI/LSI key attributes. DynamoDB is schemaless for
    non-key attributes.
  - Point-in-time recovery must be enabled for continuous backups
    with 35-day recovery capability.
  - Tables are always encrypted at rest. Set
    `server_side_encryption { enabled = true }`, which uses the AWS
    managed key `aws/dynamodb`, and add `kms_key_arn` when a
    customer-managed key is provided. Omitting the block (or
    `enabled = false`) falls back to an AWS-owned key, which is
    acceptable only when the user asks for the lowest-cost option.
  - `deletion_protection_enabled = true` — the table cannot be
    deleted via the API until deletion protection is explicitly
    disabled.
  - Add a lifecycle block with prevent_destroy.
  - Table class set to STANDARD. Use STANDARD_INFREQUENT_ACCESS
    only when the user indicates the table has infrequent reads,
    to reduce storage costs.
  - For Global Secondary Indexes, add the index definition and
    corresponding attribute definitions. Each GSI has its own
    throughput and should be sized independently.
