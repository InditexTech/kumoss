description: AWS Secrets Manager secret default configuration (container only, KMS, recovery window, rotation, resource policy).
body: |
  # AWS Secrets Manager Secret

  For a Secrets Manager secret, unless explicitly requested
  otherwise, use the following default configuration:

  - Naming convention: `sm-<application>-<purpose>-<environment>`.
    `name` forces replacement, and a deleted name stays reserved
    until its recovery window ends.
  - Terraform creates the secret container
    (`aws_secretsmanager_secret`) only. Never put a secret value in
    code, variable defaults, tfvars files, or outputs. Set the value
    out of band. Create an `aws_secretsmanager_secret_version` only
    when the value is generated in Terraform itself (e.g. by
    `random_password`) and the user accepts that it is stored in
    the Terraform state.
  - For RDS, Aurora, and Redshift admin passwords, prefer the
    service-managed secret (`manage_master_user_password = true`)
    over a Terraform-created one.
  - `kms_key_id` set to a customer-managed key when the secret is
    shared across accounts or the request asks for it; otherwise
    the AWS managed `aws/secretsmanager` key.
  - `recovery_window_in_days = 30` (7 minimum), never 0.
  - Rotation with `aws_secretsmanager_secret_rotation` and a rotation
    Lambda when a rotation process exists or is requested.
  - Grant read access per secret: `secretsmanager:GetSecretValue`
    on the secret ARN in the workload role's policy, or an
    `aws_secretsmanager_secret_policy` with `block_public_policy =
    true` for cross-account access.
  - Replicate to other regions only on request.
