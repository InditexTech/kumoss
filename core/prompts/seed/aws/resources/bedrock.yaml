description: AWS Bedrock default configuration (model use, guardrails, invocation logging, VPC).
body: |
  # AWS Bedrock

  For Amazon Bedrock resources, unless explicitly requested
  otherwise, use the following default configuration:

  ## Model access
  - Foundation-model access is not managed in Terraform. It is
    granted per account and region outside Terraform (Bedrock
    console or account-level settings, depending on the model);
    Terraform only references models by ID or ARN. State this in
    the summary when the request depends on a model being enabled.
  - Prefer on-demand throughput for variable workloads. Use
    Provisioned Throughput only when the user explicitly requests
    guaranteed capacity or has negotiated commitments (it is billed
    hourly with a commitment term).

  ## Custom models (fine-tuning)
  - Store training data in an S3 bucket following the S3 bucket
    template defaults.
  - Use a dedicated IAM role for the customization job with access
    scoped to the specific S3 bucket and Bedrock actions.
  - Output model artifacts to a dedicated S3 bucket with encryption.
  - Encryption uses AWS-managed keys by default. Use a
    customer-managed KMS key when explicitly requested.

  ## Guardrails
  - Create guardrails to define content filtering policies,
    denied topics, and word filters appropriate to the use case.
  - Guardrail naming convention:
    `bedrock-guardrail-<application>-<environment>`.
  - Set blocked messaging thresholds based on the application's
    content safety requirements.
  - Enable PII detection and redaction when processing user input
    that may contain personal data.

  ## Invocation logging
  - `aws_bedrock_model_invocation_logging_configuration` is a single
    setting per account and region: creating it overwrites any
    existing configuration. Check whether one exists (it may be
    owned by a platform team) and say so in the summary before
    adding it.
  - Deliver logs to an S3 bucket and/or CloudWatch Logs. The S3
    bucket needs a bucket policy allowing the `bedrock.amazonaws.com`
    service principal `s3:PutObject` on the log prefix, conditioned
    on `aws:SourceAccount` and `aws:SourceArn`
    (`arn:aws:bedrock:<region>:<account-id>:*`). CloudWatch delivery
    needs an IAM role that Bedrock assumes to write to the log
    group.
  - Log both input and output data unless privacy requirements
    prohibit it.
  - Logs stay encrypted at rest: the S3 bucket as the S3 bucket
    template describes, and CloudWatch Logs with its default
    service-managed encryption. Use a customer-managed KMS key only
    when the request or the workspace requires one (see
    `cloudwatch`).

  ## Networking
  - For VPC-isolated access, create a VPC interface endpoint for
    Bedrock Runtime so API calls do not traverse the public internet.
  - Use IAM policies scoped to specific model IDs and actions —
    do not grant bedrock:* wildcard permissions.

  ## Knowledge Bases (if requested)
  - Use OpenSearch Serverless or Aurora PostgreSQL as the vector
    store.
  - Store source documents in an S3 bucket following the S3
    bucket template defaults.
  - Use a dedicated IAM role for the knowledge base with access
    scoped to the vector store and source bucket.

  ## Agents (if requested)
  - Agent naming convention:
    `bedrock-agent-<application>-<environment>`.
  - Use a dedicated IAM role with least-privilege permissions for
    the agent's action groups.
  - Store agent instructions as a clear, versioned prompt —
    do not hardcode instructions inline.
