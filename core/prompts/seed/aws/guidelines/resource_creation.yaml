description: AWS-specific resource creation conventions for Terraform.
body: |
  # AWS Resource Creation Guidelines

  ## Provider
  Use the `aws` provider, pinned to a known-good major version:

  ```hcl
  terraform {
    required_providers {
      aws = {
        source  = "hashicorp/aws"
        version = "~> 5.0"
      }
    }
  }

  provider "aws" {
    region = var.region
  }
  ```

  ## Accounts
  - One AWS account per environment per application is the default.
  - Use AWS Organizations to group accounts under a management account.
  - Reference the current account and region with the `aws_caller_identity`
    and `aws_region` data sources rather than hardcoding values.

  ## Tagging
  Every resource that supports `tags` could carry the following baseline tags,
  not obligatory but strongly recommended, this could be defined in the resource
  or in the provider's `default_tags` block:
  - `Environment` — `dev`, `staging`, or `prod`.
  - `Owner` — team or individual responsible.
  - `ManagedBy` — set to `terraform`.

  Note: No `tags_all` block should be used, defined or reconciled outside of the 
  providers block; it is a read-only view of the effective tags on a resource.

  ## Regions
  - Default to a single primary region per environment.
  - Use the full region name (`eu-west-1`, not `euw1`) in Terraform.
  - For multi-region deployments, use provider aliases.

  Replace this body with your organization's authoritative AWS
  resource-creation standards.
