description: Resource-name abbreviations the prompt compositor offers to the LLM.
body: |
  # AWS Resource Name Abbreviations

  Standard short prefixes used in resource names. The LLM may pick
  from this list when generating Terraform.

  | Resource                       | Prefix |
  |--------------------------------|--------|
  | VPC                            | vpc    |
  | Subnet                         | snet   |
  | Security group                 | sg     |
  | Internet gateway               | igw    |
  | NAT gateway                    | natgw  |
  | Route table                    | rtb    |
  | Elastic Load Balancer          | elb    |
  | Application Load Balancer      | alb    |
  | Network Load Balancer          | nlb    |
  | S3 bucket                      | s3     |
  | IAM role                       | role   |
  | IAM policy                     | pol    |
  | EC2 instance                   | ec2    |
  | EBS volume                     | ebs    |
  | EKS cluster                    | eks    |
  | ECR repository                 | ecr    |
  | Lambda function                | lmb    |
  | RDS instance                   | rds    |
  | DynamoDB table                 | ddb    |
  | SNS topic                      | sns    |
  | SQS queue                      | sqs    |
  | CloudWatch log group           | cwlog  |
  | Secrets Manager secret         | sm     |
  | KMS key                        | kms    |

  If the resource you are creating is not in this list, you may use the first letter 
  of each word in the resource type as a prefix. For example, for a resource type 
  `aws_some_random_resource_created`, you could use the prefix `srrc`. Never add the 
  letter of the cloud provider.

  Replace this list with your organization's naming standard.
