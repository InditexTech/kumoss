description: AWS resources and changes drift remediation must never reconcile.
body: |
  # Drift Exception Rules

  Drift remediation drops every change these rules cover and reports it
  as left alone on purpose. The list ships empty: add one bullet per
  exception, naming the resource address, type or attribute precisely
  enough for an agent to match it against a remediation instruction.

  ## Provider quirks (permanent false diffs)
  - No provider quirks configured.
  - Example: "The `aws` provider always reports a diff on the `tags_all`
    propagated by AWS Organizations; never reconcile it."

  ## Resources managed outside Terraform
  - No externally managed resources configured.
  - Example: "`aws_autoscaling_group.desired_capacity` is set by the
    autoscaler; never reconcile it."

  ## Environment, team and naming carve-outs
  - No carve-outs configured.
  - Example: "Never reconcile resources tagged `owner = platform`; the
    platform team manages them."

  ## Ignore tags_all fields in every resource
  - The `tags_all` attribute is a read-only attribute that is automatically
    populated by the provider with all tags applied to the resource, including
    inherited tags from the provider's `default_tags` configuration. It should
    not be defined in the Terraform configuration, as it can lead to unexpected
    behavior and errors during plan and apply operations.
  - No `tags_all` definition should be added or reconciled depending on the provider version will force failures on future actions.
  - If a resource has a `tags_all` attribute defined in the iac, the tags defined should be moved to the `tags` attribute of that resource.
