description: AWS resources and changes drift remediation must never reconcile.
body: |
  # Drift Exception Rules

  Drift remediation drops every change these rules cover and reports it
  as left alone on purpose. The list ships with one standing rule
  (`tags_all`, below); every other section is empty until you add one
  bullet per exception, naming the resource address, type or attribute
  precisely enough for an agent to match it against a remediation
  instruction.

  ## Provider quirks (permanent false diffs)
  - `tags_all` is a computed, read-only attribute: the provider fills
    it by merging the provider's `default_tags` with the resource's
    own `tags`. Never write `tags_all` in configuration and never
    reconcile a diff that shows up only in `tags_all`. Fix the tag at
    its source instead: the resource's `tags` argument or the
    provider's `default_tags` block. If existing code sets
    `tags_all`, move those tags into `tags`.
  - Example: "`aws_db_instance.engine_version` changes when AWS
    applies an automatic minor version upgrade; never downgrade it."

  ## Resources managed outside Terraform
  - No externally managed resources configured.
  - Example: "`aws_autoscaling_group.desired_capacity` is set by the
    autoscaler; never reconcile it."

  ## Environment, team and naming carve-outs
  - No carve-outs configured.
  - Example: "Never reconcile resources tagged `owner = "platform"`; the
    platform team manages them."
