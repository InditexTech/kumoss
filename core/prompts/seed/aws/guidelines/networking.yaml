description: AWS networking conventions (VPCs, subnets, gateways, security groups).
body: |
  # AWS Networking Guidelines

  ## Topology
  - Default to a multi-AZ VPC with public and private subnets per
    availability zone.
  - For multi-environment deployments, use separate VPCs per
    environment (`dev`, `staging`, `prod`) connected through Transit
    Gateway or VPC peering.

  ## Address space
  - Use RFC1918 ranges. Avoid overlapping with on-premises CIDRs
    or other VPCs that will be peered.
  - Allocate `/16` per VPC by default; carve `/24` subnets within.
  - Spread subnets across at least two availability zones, taken
    from `data "aws_availability_zones" "available"` (see
    `resource_creation`); never hardcode AZ names or letters.

  ## Subnets
  - Separate public subnets (with Internet Gateway route) from
    private subnets (with NAT Gateway route).
  - One subnet tier per function: `public`, `app`, `data`, `mgmt`.
  - Set `map_public_ip_on_launch = false` on every subnet, public
    ones included: load balancers and NAT Gateways get their public
    addresses without it.

  ## Route tables
  - One public route table shared by the public subnets (the
    Internet Gateway is regional).
  - One private route table per availability zone per tier, so each
    private subnet routes `0.0.0.0/0` through the NAT Gateway in its
    own AZ. Non-production with a single NAT Gateway may point every
    private route table at that one gateway.
  - Associate every subnet explicitly; never rely on the main route
    table.

  ## Security groups
  - One security group per workload tier, named
    `sg-<application>-<tier>-<environment>`.
  - Default-deny inbound; allow rules are explicit and narrow.
  - Prefer referencing other security groups as sources instead of
    CIDR blocks for intra-VPC traffic.
  - Avoid inline `ingress`/`egress` blocks and the legacy
    `aws_security_group_rule`; use one
    `aws_vpc_security_group_ingress_rule` or
    `aws_vpc_security_group_egress_rule` resource per rule.
  - The provider removes AWS's default allow-all egress rule from
    every new `aws_security_group`, so declare the egress each
    workload needs explicitly.

  ## VPC endpoints
  - Prefer VPC gateway endpoints for S3 and DynamoDB (free).
  - Use VPC interface endpoints (PrivateLink) for other AWS services
    to keep traffic off the public internet.
  - Place interface endpoints in private subnets.

  ## NAT Gateways
  - Deploy one NAT Gateway per availability zone for high
    availability in production.
  - A single NAT Gateway is acceptable for non-production
    environments to reduce cost.

  Replace this body with your organization's authoritative networking
  standards.
