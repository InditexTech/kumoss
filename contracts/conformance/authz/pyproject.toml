[project]
name = "kumoss-authz-conformance"
version = "2.0.0"
description = "Schemathesis-driven conformance suite for the AuthZEN authz contract."
requires-python = ">=3.13"
dependencies = [
    "schemathesis>=4.17.0",
    "pytest>=9.0.3",
    "fastapi[standard]>=0.115.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
