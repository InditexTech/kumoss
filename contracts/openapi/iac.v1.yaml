openapi: 3.1.0

info:
  title: Nebula IaC Service
  version: "1.0.0"
  summary: Run individual terraform operations as asynchronous jobs against a checked-out workspace.
  description: |
    The IaC service is a raw executor for the Terraform CLI. Each POST
    endpoint enqueues a **job** that runs exactly one terraform command
    (`init`, `validate`, `plan`, `show`, `apply`, or `import`) against
    the workspace at `workspace_path` and returns `202 Accepted` with a
    job id immediately. Clients fetch progress and results by polling
    `GET /v1/jobs/{job_id}`.

    Orchestration is the caller's job: the service does not sequence
    commands, interpret plan output, or detect drift. A caller that
    wants "validate this workspace" submits `init`, then `validate`,
    then `plan` (and `show` if it needs the plan JSON) as separate
    jobs, deciding after each one whether to continue.

    Jobs targeting the same `workspace_path` execute one at a time in
    submission (FIFO) order; jobs for different workspaces may run
    concurrently. A submission is never rejected because the
    workspace is busy — it queues.

    Two failure planes are kept distinct:

    * **Terraform-level failures** are normal outcomes: the job ends
      `succeeded` and its `OperationResult` carries the command's
      `exit_code` (non-zero on failure) plus the raw `stdout` and
      `stderr`. The service passes terraform's output through
      verbatim — including provider authentication errors.
    * **Service-level faults** (subprocess timeout, unexpected errors,
      shutdown) end the job as `failed` with a `Problem` document in
      `error`; the embedded `status` is the HTTP status code an
      equivalent synchronous API would have returned.

    Errors detectable at submission time (missing/invalid token,
    malformed body, missing workspace, missing terraform binary) are
    still reported synchronously on the POST.

    Polling an expired or unknown job returns 404. The OSS reference impl keeps jobs in
    memory, so a restart also loses them — clients MUST treat an
    unexpected 404 as job loss and resubmit if needed.

    The OSS reference implementation under `services/iac/` runs
    `terraform` directly via subprocess and operates on a docker-compose
    shared volume mounted into both the core and the IaC service.
    Enterprise implementations may instead run the commands through
    internal pipelines, against centrally-managed state backends, or with
    stricter cost / policy gates — same contract, different mechanics.

    The contract makes no assumption about how the workspace ends up on
    disk. The OSS reference impl assumes the caller has already written
    the Terraform code at `workspace_path` (typically the path the core
    cloned the repo into); other implementations may pull from
    object storage, a content-addressable cache, or an upload endpoint.
  contact:
    name: Nebula maintainers
    url: https://github.com/InditexTech/nebula
  license:
    name: Apache-2.0

    url: https://www.apache.org/licenses/LICENSE-2.0


servers:
  - url: http://iac:8082
    description: Default in-cluster URL when running via docker-compose.

tags:
  - name: init
    description: Run `terraform init` in a workspace.
  - name: validate
    description: Run `terraform validate` in a workspace.
  - name: plan
    description: Run `terraform plan` in a workspace, writing a plan file.
  - name: show
    description: Render a previously written plan file as JSON.
  - name: apply
    description: Apply a previously written plan file.
  - name: import
    description: Import existing cloud resources into Terraform state.
  - name: jobs
    description: Poll asynchronous job status and results.
  - name: ops
    description: Operational endpoints (liveness, readiness).

paths:
  /v1/init:
    post:
      operationId: init
      tags: [init]
      summary: Enqueue a `terraform init` job for a workspace.
      description: |
        Enqueues a job that runs `terraform init` against the workspace
        at `workspace_path`, then returns `202 Accepted` immediately.
        Poll `GET /v1/jobs/{job_id}` for the OperationResult carrying
        the command's exit code and raw output.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
              description: URL of the created job resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: |
            Request could not be parsed at the transport layer. The OSS
            reference impl returns the framework-default body for this
            case (see `application/json`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            `workspace_path` does not exist or is not accessible from
            the implementation. Distinct from a terraform-level
            failure, which surfaces in the job result.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            Implementation is running but missing prerequisites needed
            to accept jobs (terraform binary, configured state backend,
            etc.). Faults that only surface while the job runs end the
            job as `failed` instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

