  /v1/import/scope-resource-ids:
    post:
      operationId: scope_resource_ids
      tags: [import]
      summary: Enqueue a job listing the resource IDs present in a cloud scope.
      description: |
        Enqueues a job that queries the cloud provider named in
        `provider` for the resources that exist in the scope
        `scope_id`, then returns `202 Accepted` immediately. Poll
        `GET /v1/jobs/{job_id}` for the OperationResult: on exit code
        0, `stdout` is a JSON array of provider-native resource ID
        strings —

        * `azurerm`: ARM resource, resource-group and role-assignment
          IDs in the subscription `scope_id` (Azure Resource Graph).
          ARM IDs compare case-insensitively.
        * `google`: normalized asset names of the project's resources,
          plus one `<project>/<role>/<member>` entry per project-level
          IAM binding (Cloud Asset Inventory and Resource Manager).
        * `aws`: resource ARNs across the account's indexed regions
          (Resource Explorer, which the account must have enabled).

        Implementations are expected to leave out resources managed by
        another control plane — managed resource groups, Kubernetes
        node pools and their disks and network interfaces, service
        staging buckets, service-linked roles — since importing those
        into Terraform cannot work.

        Failures of the underlying cloud query are normal outcomes:
        the job ends `succeeded` with a non-zero `exit_code` and
        diagnostics in `stderr`.

        Here `scope_id` names the scope being listed and `provider`
        selects which provider is queried. This is the one endpoint
        that runs no Terraform command. The workspace is used to resolve provider credentials;
        the OSS reference impl calls each cloud's inventory API over
        HTTPS with the service's ambient credentials, using no
        command-line tools. `provider` accepts only the providers with
        an inventory query; any other is rejected with `422`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeResourceIdsRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
              description: URL of the created job resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: |
            Request could not be parsed at the transport layer. The OSS
            reference impl returns the framework-default body for this
            case (see `application/json`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            `workspace_path` does not exist or is not accessible from
            the implementation. Distinct from a terraform-level
            failure, which surfaces in the job result.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            Implementation is running but missing prerequisites needed
            to accept jobs (terraform binary, the cloud CLI for the
            requested provider, etc.). Faults that only surface while
            the job runs end the job as `failed` instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/jobs/{job_id}:
    get:
      operationId: get_job
      tags: [jobs]
      summary: Fetch the status and result of a previously submitted job.
      description: |
        Returns the job's current status and, once it reaches a
        terminal state, its outcome: `result` for `succeeded` jobs,
        `error` for `failed` ones. Clients poll this endpoint after a
        `202 Accepted` submission until the status is `succeeded` or
        `failed`.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The `job_id` returned by the submitting endpoint.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No job with this id: it never existed, its retention period

            elapsed, or the implementation lost it (the OSS reference
            impl keeps jobs in memory and forgets them on restart).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`job_id` is not a valid UUID."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-service bearer token. The token value is the contents of the
        environment variable named in the system config (default
        `KUMOSS_IAC_TOKEN`). Implementations MAY accept all
        requests when no token is configured for local development.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          description: |
            Bearer challenge. RFC 9110 11.6.1 requires a 401 to carry at
            least one challenge, so implementations must send this.
          required: true
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    InitRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"

    ValidateRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"

    PlanRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"
        targets:
          type: array
          description: |
            Optional `terraform plan -target=` filters. When omitted or
            empty, the entire configuration is planned.
          items:
            type: string
            minLength: 1
            maxLength: 1024
          maxItems: 4096
        plan_file:
          type: string
          description: |
            Filename (not a path) the plan is written to via
            `-out <plan_file>`, relative to the workspace root. The
            caller passes the same name to subsequent `show` / `apply`
            jobs. Restricted to a single path segment so it cannot
            escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]
        var_files:
          $ref: "#/components/schemas/VarFiles"
        vars:
          $ref: "#/components/schemas/Vars"

    Env:
      type: object
      description: |
        Environment variables added to the command's environment. Names
        the implementation's own environment already sets, and the
        reserved names listed in "Environment and input variables"
        (`TF_*` but `TF_VAR_*`, `TOFU_*`, `LD_*`, proxies, ...), are
        rejected with `422`. May contain secrets.
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
      additionalProperties:
        type: string
        maxLength: 32768
        pattern: "^[^\\u0000]*$"
      maxProperties: 256
      examples:
        - ARM_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000000

    VarFiles:
      type: array
      description: |
        Variable-definition files to pass as `-var-file`, in order,
        before `vars`. Each is a path relative to `workspace_path`;
        absolute paths and `..` segments are rejected. See "Environment
        and input variables".
      items:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^(?!/)(?!.*(^|/)\\.\\.(/|$))[^\\u0000]+$"
        examples: ["envs/dev.tfvars"]
      maxItems: 64

    Vars:
      type: object
      description: |
        Input variable values by name, of any JSON type, passed as the
        last `-var-file` so they win over every other source. May
        contain secrets: never logged, persisted, or written inside the
        workspace. See "Environment and input variables".
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,127}$"
      additionalProperties: true
      maxProperties: 1024

    ShowRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace. Restricted to a single path
            segment so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ApplyRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace; `apply` executes exactly the
            changes recorded in it. Restricted to a single path segment
            so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ImportRequest:
      type: object
      required: [workspace_path, address, resource_id]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        env:
          $ref: "#/components/schemas/Env"
        address:
          type: string
          description: |
            Terraform resource address to import into, e.g.
            `azurerm_resource_group.main`.
          minLength: 1
          maxLength: 4096
        resource_id:
          type: string
          description: |
            Provider-specific identifier of the existing cloud resource,
            e.g. an Azure resource ID or an AWS ARN.
          minLength: 1
          maxLength: 4096
        var_files:
          $ref: "#/components/schemas/VarFiles"
        vars:
          $ref: "#/components/schemas/Vars"

    StateResourceIdsRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]

    ScopeResourceIdsRequest:
      type: object
      required: [workspace_path, scope_id, provider]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service. Used to resolve the provider
            credentials the scope query runs with.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud provider scope to list — `azurerm`: subscription id,
            `google`: project id, `aws`: account id. Each is validated for its
            cloud's shape, and a scope the credentials do not own ends
            the job with exit code 1. Names the scope being listed
            rather than the scope a command runs against.
          minLength: 1
          maxLength: 1024
        provider:
          type: string
          enum: [azurerm, google, aws]
          description: |
            Terraform provider type name of the cloud the scope query
            targets. Only the providers with an inventory query are
            accepted.

    OperationResult:
      type: object
      description: |
        Raw outcome of the single command a job ran. The
        service does not interpret it: `exit_code` is the process's
        exit status (non-zero means the command failed), and `stdout` /
        `stderr` are passed through verbatim. Discovery jobs
        (`state_resource_ids`, `scope_resource_ids`) synthesize the
        same shape: exit code 0 with a JSON array of ID strings in
        `stdout`, or a non-zero exit code with diagnostics in `stderr`.
      required: [exit_code, stdout, stderr]
      additionalProperties: false
      properties:
        exit_code:
          type: integer
          description: |
            Exit status of the terraform process. 0 means the command
            succeeded; any other value is a terraform-level failure
            (diagnostics in `stderr`).
        stdout:
          type: string
          description: |
            The command's standard output, verbatim. For `plan` this is
            the human-readable plan text; for `show` (exit code 0) it
            is the plan's JSON representation.
        stderr:
          type: string
          description: The command's standard error, verbatim.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]
      description: |
        `queued`: accepted, waiting for its workspace's FIFO queue.
        `running`: the job's command or query is executing.
        `succeeded`: command ran to completion — inspect `result` for
        the terraform-level outcome (`exit_code` may be non-zero).
        `failed`: service-level fault — inspect `error`.

    JobKind:
      type: string
      enum:
        [
          init,
          validate,
          plan,
          show,
          apply,
          import,
          state_resource_ids,
          scope_resource_ids,
        ]
      description: |
        Which operation the job runs: one of the six terraform
        commands, or one of the two import-discovery queries.

    JobAccepted:
      type: object
      description: Returned by the submitting endpoints when a job is enqueued.
      required: [job_id, status]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifier to poll at `GET /v1/jobs/{job_id}`.
        status:
          $ref: "#/components/schemas/JobStatus"
          description: Always `queued` at submission time.

    Job:
      type: object
      description: |
        A submitted terraform job. All keys are always present;
        `started_at`, `finished_at`, `result`, and `error` are null
        until they become meaningful.
      required:
        [job_id, kind, status, created_at, started_at, finished_at, result, error]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
          description: When the job was accepted (UTC).
        started_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the job left the queue and began running, or null while
            still `queued`.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the job reached a terminal state, or null.
        result:
          description: |
            Non-null iff `status` is `succeeded`: the raw outcome of
            the job's command or query, regardless of `kind`.
          oneOf:
            - $ref: "#/components/schemas/OperationResult"
            - type: "null"
        error:
          description: |
            Non-null iff `status` is `failed`. The embedded `status`
            member is the HTTP status code an equivalent synchronous

            API would have returned (e.g. 500 unexpected execution
            failure, 504 subprocess timeout, 503 shut down before
            completion).
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:

      type: object
      description: |
        Problem details for HTTP APIs (RFC 7807).

      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
