  /v1/jobs/{job_id}:
    get:
      operationId: get_job
      tags: [jobs]
      summary: Fetch the status and result of a previously submitted job.
      description: |
        Returns the job's current status and, once it reaches a
        terminal state, its outcome: `result` for `succeeded` jobs,
        `error` for `failed` ones. Clients poll this endpoint after a
        `202 Accepted` submission until the status is `succeeded` or
        `failed`.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The `job_id` returned by the submitting endpoint.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            No job with this id: it never existed, its retention period

            elapsed, or the implementation lost it (the OSS reference
            impl keeps jobs in memory and forgets them on restart).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`job_id` is not a valid UUID."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-service bearer token. The token value is the contents of the
        environment variable named in the system config (default
        `NEBULA_IAC_TOKEN`). Implementations MAY accept all
        requests when no token is configured for local development.

  schemas:
    InitRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024

    ValidateRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024

    PlanRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024
        targets:
          type: array
          description: |
            Optional `terraform plan -target=` filters. When omitted or
            empty, the entire configuration is planned.
          items:
            type: string
            minLength: 1
            maxLength: 1024
          maxItems: 256
        plan_file:
          type: string
          description: |
            Filename (not a path) the plan is written to via
            `-out <plan_file>`, relative to the workspace root. The
            caller passes the same name to subsequent `show` / `apply`
            jobs. Restricted to a single path segment so it cannot
            escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ShowRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace. Restricted to a single path
            segment so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ApplyRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace; `apply` executes exactly the
            changes recorded in it. Restricted to a single path segment
            so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ImportRequest:
      type: object
      required: [workspace_path, address, resource_id]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: [string, "null"]
          description: |
            Cloud provider scope the operation targets — Azure:
            subscription id, GCP: project id, AWS: account id. Used as a
            fallback when the credentials resolved for the workspace do
            not already carry a scope. Implementations MAY ignore it when
            the resolved credentials are fully specified.
          maxLength: 1024
        address:
          type: string
          description: |
            Terraform resource address to import into, e.g.
            `azurerm_resource_group.main`.
          minLength: 1
          maxLength: 4096
        resource_id:
          type: string
          description: |
            Provider-specific identifier of the existing cloud resource,
            e.g. an Azure resource ID or an AWS ARN.
          minLength: 1
          maxLength: 4096

    OperationResult:
      type: object
      description: |
        Raw outcome of the single terraform command a job ran. The
        service does not interpret it: `exit_code` is the process's
        exit status (non-zero means the command failed), and `stdout` /
        `stderr` are passed through verbatim.
      required: [exit_code, stdout, stderr]
      additionalProperties: false
      properties:
        exit_code:
          type: integer
          description: |
            Exit status of the terraform process. 0 means the command
            succeeded; any other value is a terraform-level failure
            (diagnostics in `stderr`).
        stdout:
          type: string
          description: |
            The command's standard output, verbatim. For `plan` this is
            the human-readable plan text; for `show` (exit code 0) it
            is the plan's JSON representation.
        stderr:
          type: string
          description: The command's standard error, verbatim.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]
      description: |
        `queued`: accepted, waiting for its workspace's FIFO queue.
        `running`: terraform command executing.
        `succeeded`: command ran to completion — inspect `result` for
        the terraform-level outcome (`exit_code` may be non-zero).
        `failed`: service-level fault — inspect `error`.

    JobKind:
      type: string
      enum: [init, validate, plan, show, apply, import]
      description: Which terraform command the job runs.

    JobAccepted:
      type: object
      description: Returned by the submitting endpoints when a job is enqueued.
      required: [job_id, status]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifier to poll at `GET /v1/jobs/{job_id}`.
        status:
          $ref: "#/components/schemas/JobStatus"
          description: Always `queued` at submission time.

    Job:
      type: object
      description: |
        A submitted terraform job. All keys are always present;
        `started_at`, `finished_at`, `result`, and `error` are null
        until they become meaningful.
      required:
        [job_id, kind, status, created_at, started_at, finished_at, result, error]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
          description: When the job was accepted (UTC).
        started_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the job left the queue and began running, or null while
            still `queued`.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the job reached a terminal state, or null.
        result:
          description: |
            Non-null iff `status` is `succeeded`: the raw outcome of
            the terraform command, regardless of `kind`.
          oneOf:
            - $ref: "#/components/schemas/OperationResult"
            - type: "null"
        error:
          description: |
            Non-null iff `status` is `failed`. The embedded `status`
            member is the HTTP status code an equivalent synchronous

            API would have returned (e.g. 500 unexpected execution
            failure, 504 subprocess timeout, 503 shut down before
            completion).
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:

      type: object
      description: |
        Problem details for HTTP APIs (RFC 7807).

      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
