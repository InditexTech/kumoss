  /v1/import/scope-resource-ids:
    post:
      operationId: scope_resource_ids
      tags: [import]
      summary: Enqueue a job listing the resource IDs present in a cloud scope.
      description: |
        Enqueues a job that queries the cloud provider named in
        `terraform_provider` for the resources that exist in the scope
        `scope_id`, then returns `202 Accepted` immediately. Poll
        `GET /v1/jobs/{job_id}` for the OperationResult: on exit code
        0, `stdout` is a JSON array of provider-native resource ID
        strings —

        * `azure`: resource and resource-container IDs whose id
          contains `scope_id` (Azure Resource Graph);
        * `gcp`: asset names of the project's resources plus the IAM
          role names bound in the project (Cloud Asset Inventory);
        * `aws`: resource ARNs across the account's enabled regions
          (Resource Groups Tagging API).

        Failures of the underlying cloud query are normal outcomes:
        the job ends `succeeded` with a non-zero `exit_code` and
        diagnostics in `stderr`.

        Here `scope_id` names the scope being listed (rather than the
        scope a command runs against, as on `plan`, `apply` and
        `import`) and `terraform_provider` selects which provider is
        queried. The workspace is used to resolve provider credentials;
        the OSS reference impl shells out to the corresponding cloud
        CLI (`az`, `gcloud`, `aws`) with the service's ambient
        credentials.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeResourceIdsRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
              description: URL of the created job resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: |
            Request could not be parsed at the transport layer. The OSS
            reference impl returns the framework-default body for this
            case (see `application/json`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            `workspace_path` does not exist or is not accessible from
            the implementation. Distinct from a terraform-level
            failure, which surfaces in the job result.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            Implementation is running but missing prerequisites needed
            to accept jobs (terraform binary, the cloud CLI for the
            requested provider, etc.). Faults that only surface while
            the job runs end the job as `failed` instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/jobs/{job_id}:
    get:
      operationId: get_job
      tags: [jobs]
      summary: Fetch the status and result of a previously submitted job.
      description: |
        Returns the job's current status and, once it reaches a
        terminal state, its outcome: `result` for `succeeded` jobs,
        `error` for `failed` ones. Clients poll this endpoint after a
        `202 Accepted` submission until the status is `succeeded` or
        `failed`.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The `job_id` returned by the submitting endpoint.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No job with this id: it never existed, its retention period

            elapsed, or the implementation lost it (the OSS reference
            impl keeps jobs in memory and forgets them on restart).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`job_id` is not a valid UUID."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-service bearer token. The token value is the contents of the
        environment variable named in the system config (default
        `NEBULA_IAC_TOKEN`). Implementations MAY accept all
        requests when no token is configured for local development.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          description: |
            Bearer challenge. RFC 9110 11.6.1 requires a 401 to carry at
            least one challenge, so implementations must send this.
          required: true
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    InitRequest:
      type: object
      required: [workspace_path, scope_id, terraform_provider]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud scope the operation targets — Azure: subscription id,
            GCP: project id, AWS: account id, OCI: compartment OCID.
            Required: generated provider blocks do not carry a scope,
            so where the cloud has a provider-level variable for one
            the implementation injects it into the engine's
            environment for this command only (see "Scope injection").
          minLength: 1
          maxLength: 1024
        terraform_provider:
          $ref: "#/components/schemas/TerraformProvider"
          description: |
            Cloud the command runs against. Where that cloud has one,
            it selects the environment variable `scope_id` is injected
            as (see "Scope injection").

    ValidateRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]

    PlanRequest:
      type: object
      required: [workspace_path, scope_id, terraform_provider, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud scope the operation targets — Azure: subscription id,
            GCP: project id, AWS: account id, OCI: compartment OCID.
            Required: generated provider blocks do not carry a scope,
            so where the cloud has a provider-level variable for one
            the implementation injects it into the engine's
            environment for this command only (see "Scope injection").
          minLength: 1
          maxLength: 1024
        terraform_provider:
          $ref: "#/components/schemas/TerraformProvider"
          description: |
            Cloud the command runs against. Where that cloud has one,
            it selects the environment variable `scope_id` is injected
            as (see "Scope injection").
        targets:
          type: array
          description: |
            Optional `terraform plan -target=` filters. When omitted or
            empty, the entire configuration is planned.
          items:
            type: string
            minLength: 1
            maxLength: 1024
          maxItems: 256
        plan_file:
          type: string
          description: |
            Filename (not a path) the plan is written to via
            `-out <plan_file>`, relative to the workspace root. The
            caller passes the same name to subsequent `show` / `apply`
            jobs. Restricted to a single path segment so it cannot
            escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ShowRequest:
      type: object
      required: [workspace_path, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace. Restricted to a single path
            segment so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ApplyRequest:
      type: object
      required: [workspace_path, scope_id, terraform_provider, plan_file]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud scope the operation targets — Azure: subscription id,
            GCP: project id, AWS: account id, OCI: compartment OCID.
            Required: generated provider blocks do not carry a scope,
            so where the cloud has a provider-level variable for one
            the implementation injects it into the engine's
            environment for this command only (see "Scope injection").
          minLength: 1
          maxLength: 1024
        terraform_provider:
          $ref: "#/components/schemas/TerraformProvider"
          description: |
            Cloud the command runs against. Where that cloud has one,
            it selects the environment variable `scope_id` is injected
            as (see "Scope injection").
        plan_file:
          type: string
          description: |
            Filename (not a path) of a plan file previously written by a
            `plan` job on this workspace; `apply` executes exactly the
            changes recorded in it. Restricted to a single path segment
            so it cannot escape the workspace.
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          examples: ["a1b2c3d4e5f6.plan"]

    ImportRequest:
      type: object
      required: [workspace_path, scope_id, terraform_provider, address, resource_id]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud scope the operation targets — Azure: subscription id,
            GCP: project id, AWS: account id, OCI: compartment OCID.
            Required: generated provider blocks do not carry a scope,
            so where the cloud has a provider-level variable for one
            the implementation injects it into the engine's
            environment for this command only (see "Scope injection").
          minLength: 1
          maxLength: 1024
        terraform_provider:
          $ref: "#/components/schemas/TerraformProvider"
          description: |
            Cloud the command runs against. Where that cloud has one,
            it selects the environment variable `scope_id` is injected
            as (see "Scope injection").
        address:
          type: string
          description: |
            Terraform resource address to import into, e.g.
            `azurerm_resource_group.main`.
          minLength: 1
          maxLength: 4096
        resource_id:
          type: string
          description: |
            Provider-specific identifier of the existing cloud resource,
            e.g. an Azure resource ID or an AWS ARN.
          minLength: 1
          maxLength: 4096

    StateResourceIdsRequest:
      type: object
      required: [workspace_path]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]

    ScopeResourceIdsRequest:
      type: object
      required: [workspace_path, scope_id, terraform_provider]
      additionalProperties: false
      properties:
        workspace_path:
          type: string
          description: |
            Absolute filesystem path to the Terraform workspace as visible
            to the implementation. For the OSS docker-compose deployment,
            this is a path on the shared volume mounted into both the
            core and the IaC service. Used to resolve the provider
            credentials the scope query runs with.
          minLength: 1
          maxLength: 4096
          examples: ["/workspaces/my-iac_a1b2c3"]
        scope_id:
          type: string
          description: |
            Cloud provider scope to list — Azure: subscription id (or
            any value matched as a substring of resource IDs), GCP:
            project id, AWS: account id. Names the scope being listed
            rather than the scope a command runs against.
          minLength: 1
          maxLength: 1024
        terraform_provider:
          $ref: "#/components/schemas/TerraformProvider"
          description: Which cloud provider the scope query targets.

    TerraformProvider:
      type: string
      enum: [azure, gcp, aws, oci, kubernetes]
      description: |
        Cloud provider a request targets. Values follow the core's
        provider vocabulary (`azure`, `gcp`, `aws`, `oci`,
        `kubernetes`), not Terraform registry provider names
        (`azurerm`, `google`).

    OperationResult:
      type: object
      description: |
        Raw outcome of the single command a job ran. The
        service does not interpret it: `exit_code` is the process's
        exit status (non-zero means the command failed), and `stdout` /
        `stderr` are passed through verbatim. Discovery jobs
        (`state_resource_ids`, `scope_resource_ids`) synthesize the
        same shape: exit code 0 with a JSON array of ID strings in
        `stdout`, or a non-zero exit code with diagnostics in `stderr`.
      required: [exit_code, stdout, stderr]
      additionalProperties: false
      properties:
        exit_code:
          type: integer
          description: |
            Exit status of the terraform process. 0 means the command
            succeeded; any other value is a terraform-level failure
            (diagnostics in `stderr`).
        stdout:
          type: string
          description: |
            The command's standard output, verbatim. For `plan` this is
            the human-readable plan text; for `show` (exit code 0) it
            is the plan's JSON representation.
        stderr:
          type: string
          description: The command's standard error, verbatim.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]
      description: |
        `queued`: accepted, waiting for its workspace's FIFO queue.
        `running`: the job's command or query is executing.
        `succeeded`: command ran to completion — inspect `result` for
        the terraform-level outcome (`exit_code` may be non-zero).
        `failed`: service-level fault — inspect `error`.

    JobKind:
      type: string
      enum:
        [
          init,
          validate,
          plan,
          show,
          apply,
          import,
          state_resource_ids,
          scope_resource_ids,
        ]
      description: |
        Which operation the job runs: one of the six terraform
        commands, or one of the two import-discovery queries.

    JobAccepted:
      type: object
      description: Returned by the submitting endpoints when a job is enqueued.
      required: [job_id, status]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifier to poll at `GET /v1/jobs/{job_id}`.
        status:
          $ref: "#/components/schemas/JobStatus"
          description: Always `queued` at submission time.

    Job:
      type: object
      description: |
        A submitted terraform job. All keys are always present;
        `started_at`, `finished_at`, `result`, and `error` are null
        until they become meaningful.
      required:
        [job_id, kind, status, created_at, started_at, finished_at, result, error]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
          description: When the job was accepted (UTC).
        started_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the job left the queue and began running, or null while
            still `queued`.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the job reached a terminal state, or null.
        result:
          description: |
            Non-null iff `status` is `succeeded`: the raw outcome of
            the job's command or query, regardless of `kind`.
          oneOf:
            - $ref: "#/components/schemas/OperationResult"
            - type: "null"
        error:
          description: |
            Non-null iff `status` is `failed`. The embedded `status`
            member is the HTTP status code an equivalent synchronous

            API would have returned (e.g. 500 unexpected execution
            failure, 504 subprocess timeout, 503 shut down before
            completion).
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:

      type: object
      description: |
        Problem details for HTTP APIs (RFC 7807).

      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
