  /v1/import/state-resource-ids:
    post:
      operationId: state_resource_ids
      tags: [import]
      summary: Enqueue a job listing the resource IDs tracked in Terraform state.
      description: |
        Enqueues a job that runs `terraform state pull` against the
        workspace at `workspace_path` and extracts the
        provider-assigned `id` of every managed resource instance in
        the state, then returns `202 Accepted` immediately. Poll
        `GET /v1/jobs/{job_id}` for the OperationResult: on exit code
        0, `stdout` is a JSON array of resource ID strings (empty when
        the state tracks nothing). If `state pull` fails, its exit
        code and `stderr` are passed through verbatim and `stdout` is
        empty. The workspace must already be initialised (submit an
        `init` job first).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateResourceIdsRequest"
      responses:
