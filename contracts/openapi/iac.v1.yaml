  /v1/show:
    post:
      operationId: show
      tags: [show]
      summary: Enqueue a `terraform show -json` job for a plan file.
      description: |
        Enqueues a job that runs `terraform show -json <plan_file>`
        against the workspace at `workspace_path`, then returns
        `202 Accepted` immediately. Poll `GET /v1/jobs/{job_id}` for
        the OperationResult: on exit code 0, `stdout` is the plan's
        machine-readable JSON representation. The `plan_file` must have
        been written by a previous `plan` job on the same workspace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
