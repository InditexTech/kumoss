  /v1/import:
    post:
      operationId: import_resource
      tags: [import]
      summary: Enqueue a `terraform import` job for a workspace.
      description: |
        Enqueues a job that runs `terraform import <address>
        <resource_id>` against the workspace at `workspace_path`,
        bringing the existing cloud resource identified by
        `resource_id` under the Terraform resource address `address` in
        the workspace's state, then returns `202 Accepted` immediately.
        Poll `GET /v1/jobs/{job_id}` for the OperationResult carrying
        the command's exit code and raw output. The workspace must
        already be initialised (submit an `init` job first).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
              description: URL of the created job resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: |
            Request could not be parsed at the transport layer. The OSS
