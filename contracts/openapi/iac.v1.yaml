openapi: 3.1.0

info:
  title: Kumoss IaC Service
  version: "2.1.0"
  summary: Run individual terraform operations as asynchronous jobs against a checked-out workspace.
  description: |
    The IaC service is a raw executor for the Terraform CLI. Each POST
    endpoint enqueues a **job** that runs exactly one terraform command
    (`init`, `validate`, `plan`, `show`, `apply`, or `import`) against
    the workspace at `workspace_path` and returns `202 Accepted` with a
    job id immediately. Clients fetch progress and results by polling
    `GET /v1/jobs/{job_id}`.

    Orchestration is the caller's job: the service does not sequence
    commands, interpret plan output, or detect drift. A caller that
    wants "validate this workspace" submits `init`, then `validate`,
    then `plan` (and `show` if it needs the plan JSON) as separate
    jobs, deciding after each one whether to continue.

    Two discovery endpoints support import workflows without running a
    state-mutating command: `POST /v1/import/state-resource-ids` lists
    the provider IDs already tracked in the workspace's Terraform
    state, and `POST /v1/import/scope-resource-ids` lists the resource
    IDs that exist in a cloud scope, leaving out those whose lifecycle
    another control plane owns. Both follow the same job model; on
    success their `stdout` is a JSON array of ID strings, normalized by
    the implementation so the two are directly comparable. Callers
    typically diff them to decide which existing resources still need
    an `import` job.

    Jobs targeting the same `workspace_path` execute one at a time in
    submission (FIFO) order; jobs for different workspaces may run
    concurrently. A submission is never rejected because the
    workspace is busy — it queues.

    ## Environment and input variables

    The request mirrors what the Terraform CLI itself takes: the
    workspace it runs in, environment variables, variable files and
    input variable values. The service attaches no meaning to them;
    deciding which scope a command runs against (a subscription, a
    project, an account) is the caller's job, done through `env` and
    `vars`.

    - `env` (every command endpoint): environment variables added to
      the command's environment, e.g. `ARM_SUBSCRIPTION_ID` or
      `GOOGLE_PROJECT`. A request may add variables but never replace
      one: a name the implementation's own environment already sets
      (its provider credentials, `PATH`, ...) is rejected with `422`,
      and so are names that would change the command or the process
      rather than add to its environment: every `TF_*` and `TOFU_*`
      except `TF_VAR_*`, `TERRAFORM_CONFIG`, `LD_*`, `DYLD_*`,
      `BASH_ENV`, `ENV`, `GODEBUG`, `SSL_CERT_FILE`, `SSL_CERT_DIR`,
      and `HTTP_PROXY`, `HTTPS_PROXY`, `ALL_PROXY`, `NO_PROXY` in any
      case. A value may not contain a NUL character. Deployments
      therefore leave scope variables such as `ARM_SUBSCRIPTION_ID`
      unset and let each request carry them.
    - `var_files` (`plan` and `import`, the commands that evaluate the
      configuration): variable-definition files of the workspace,
      passed as `-var-file` in the order given, so a later one wins.
      Each is a path relative to `workspace_path`; an absolute path, a
      `..` segment or a NUL character is rejected with `422`, and a
      path that resolves outside the workspace (through a symlink) ends
      the job with exit code 1 without running the engine.
    - `vars` (`plan` and `import`): input variable values by name, of
      any JSON type. The implementation writes them to one variables
      file passed as the last `-var-file`, after `var_files`, so they
      win over every other source; files Terraform loads on its own
      (`terraform.tfvars`, `*.auto.tfvars`) still apply underneath.
      Since they arrive as a file, a value for a variable the
      configuration does not declare is only a warning.

    `vars` and `env` may hold secrets. Implementations MUST NOT log or
    persist their values, nor write them inside `workspace_path` (which
    may be committed or shared); the reference implementation writes
    `vars` to an owner-only temporary file outside the workspace for
    the duration of the command. Values are never echoed back in a job
    result beyond what Terraform itself prints.

    Every request schema sets `additionalProperties: false`: a field
    appears on a request only where the operation acts on it, and
    sending another one is a `422`.

    ## Project

    Every request may carry a `Kumoss-Project` header naming the
    project the workspace belongs to, as the user identified it (e.g.
    `sistemas-kumoss-rsg-esc1-dev`). The caller has already checked that
    it names the repository the workspace was checked out from. An
    implementation may pick the credentials the command runs with by it
    (for instance, reading them from the project's own secret store) and
    reject a project it cannot serve with `403`; it MUST NOT echo the
    credentials back. Without the header, or in an implementation that
    ignores it, commands run with the implementation's own environment.
    The header is never a credential itself.

    ## Versioning

    2.1.0 (additive) added the optional `Kumoss-Project` request header.

    2.0.0 (breaking) made the request a plain description of a CLI
    invocation: the `scope_id` / `terraform_provider` pair on `init`,
    `plan`, `apply` and `import`, and the `variables` field of `plan`
    and `import`, gave way to `env` on every command and `vars` on
    `plan` and `import`; `var_files` stays, with any path shape inside
    the workspace. `/v1/import/scope-resource-ids`
    names its cloud by Terraform provider type name (`azurerm`,
    `google`, `aws`) in its `provider` field.

    Two failure planes are kept distinct:

    * **Terraform-level failures** are normal outcomes: the job ends
      `succeeded` and its `OperationResult` carries the command's
      `exit_code` (non-zero on failure) plus the raw `stdout` and
      `stderr`. The service passes terraform's output through
      verbatim — including provider authentication errors. Failures
      of the underlying cloud query in a discovery job ride this same
      plane.
    * **Service-level faults** (subprocess timeout, unexpected errors,
      shutdown) end the job as `failed` with a `Problem` document in
      `error`; the embedded `status` is the HTTP status code an
      equivalent synchronous API would have returned.

    Errors detectable at submission time (missing/invalid token,
    malformed body, missing workspace, missing terraform binary) are
    still reported synchronously on the POST.

    Polling an expired or unknown job returns 404. The OSS reference impl keeps jobs in
    memory, so a restart also loses them — clients MUST treat an
    unexpected 404 as job loss and resubmit if needed.

    The OSS reference implementation under `services/iac/` runs
    `terraform` directly via subprocess and operates on a docker-compose
    shared volume mounted into both the core and the IaC service.
    Enterprise implementations may instead run the commands through
    internal pipelines, against centrally-managed state backends, or with
    stricter cost / policy gates — same contract, different mechanics.

    The contract makes no assumption about how the workspace ends up on
    disk. The OSS reference impl assumes the caller has already written
    the Terraform code at `workspace_path` (typically the path the core
    cloned the repo into); other implementations may pull from
    object storage, a content-addressable cache, or an upload endpoint.
  contact:
    name: Kumoss maintainers
    url: https://github.com/InditexTech/kumoss
  license:
    name: Apache-2.0

    url: https://www.apache.org/licenses/LICENSE-2.0


servers:
  - url: http://iac:8082
    description: Default in-cluster URL when running via docker-compose.

tags:
  - name: init
    description: Run `terraform init` in a workspace.
  - name: validate
    description: Run `terraform validate` in a workspace.
  - name: plan
    description: Run `terraform plan` in a workspace, writing a plan file.
  - name: show
    description: Render a previously written plan file as JSON.
  - name: apply
    description: Apply a previously written plan file.
  - name: import
    description: |
      Import existing cloud resources into Terraform state, and
      discover importable resource IDs (from the state or from a cloud
      scope).
  - name: jobs
    description: Poll asynchronous job status and results.
  - name: ops
    description: Operational endpoints (liveness, readiness).

paths:
  /v1/init:
    post:
      operationId: init
      tags: [init]
      summary: Enqueue a `terraform init` job for a workspace.
      description: |
        Enqueues a job that runs `terraform init` against the workspace
        at `workspace_path`, then returns `202 Accepted` immediately.
        Poll `GET /v1/jobs/{job_id}` for the OperationResult carrying
        the command's exit code and raw output.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRequest"
      responses:
        "202":
          description: |
            Job accepted and queued. Jobs for the same `workspace_path`
            run one at a time in submission order; poll
            `GET /v1/jobs/{job_id}` for progress and the result.
          headers:
            Location:
              description: URL of the created job resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: |
            Request could not be parsed at the transport layer. The OSS
            reference impl returns the framework-default body for this
            case (see `application/json`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            `workspace_path` does not exist or is not accessible from
            the implementation. Distinct from a terraform-level
            failure, which surfaces in the job result.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            Implementation is running but missing prerequisites needed
            to accept jobs (terraform binary, configured state backend,
            etc.). Faults that only surface while the job runs end the
            job as `failed` instead.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

