openapi: 3.1.0
info:
  title: Kumoss Authorization Service
  version: "1.0.0"
  summary: OpenID AuthZEN 1.0 Access Evaluation for organizational access control.
  description: |
    The authorization service implements the OpenID AuthZEN 1.0 Access
    Evaluation API. The Kumoss core sends an evaluation request before
    every IaC and PR write operation; the PDP returns a boolean decision.

    Kumoss does not bundle a PDP implementation. While `services.authz`
    is disabled (the default), the core never calls the PDP and treats
    every operation as authorized. Organizations that need access control
    deploy their own PDP (or the included stub) and point
    `services.authz.endpoint` at it.
  contact:
    name: Kumoss maintainers
    url: https://github.com/InditexTech/kumoss
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://authz.example.com
    description: Placeholder. Kumoss calls the URL set in `services.authz.endpoint`.

tags:
  - name: evaluation
    description: AuthZEN access evaluation.
  - name: ops
    description: Operational endpoints (liveness, readiness).

paths:
  /access/v1/evaluation:
    post:
      operationId: evaluate
      tags: [evaluation]
      summary: Evaluate an access request.
      description: |
        Returns whether the subject is permitted to perform the named
        action on the given resource, per OpenID AuthZEN 1.0 §5.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationRequest"
      responses:
        "200":
          description: Decision computed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationResponse"
        "400":
          description: Malformed request (bad JSON, non-UTF-8).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PDP itself denied the caller (e.g. PDP-level ACL).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Request body failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal PDP error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Downstream backend error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          description: Bearer challenge per RFC 9110 §11.6.1.
          required: true
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    AccessEvaluationRequest:
      type: object
      required: [subject, action, resource]
      additionalProperties: false
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/RequestContext"

    Subject:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [user]
        id:
          type: string
        properties:
          $ref: "#/components/schemas/SubjectProperties"

    SubjectProperties:
      type: object
      additionalProperties: true
      properties:
        issuer:
          type: string
        email:
          type: string

    Action:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          enum: [generate, drift, import, apply, pr.create, pr.merge]
        properties:
          type: object
          additionalProperties: true

    Resource:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [scope]
        id:
          type: string
        properties:
          $ref: "#/components/schemas/ResourceProperties"

    ResourceProperties:
      type: object
      additionalProperties: true
      properties:
        provider:
          type: string
          enum: [azure, gcp, aws, oci, kubernetes, vmware]
        repo_uri:
          type: string
        iac_path:
          type: string

    RequestContext:
      type: object
      additionalProperties: true
      properties:
        session_id:
          type: string
          format: uuid
        iteration:
          type: boolean

    AccessEvaluationResponse:
      type: object
      required: [decision]
      additionalProperties: true
      properties:
        decision:
          type: boolean
        context:
          $ref: "#/components/schemas/ResponseContext"

    ResponseContext:
      type: object
      additionalProperties: true
      properties:
        reason_user:
          type: object
          additionalProperties:
            type: string
        reason_admin:
          type: object
          additionalProperties:
            type: string

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      description: Problem details for HTTP APIs (RFC 9457).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
