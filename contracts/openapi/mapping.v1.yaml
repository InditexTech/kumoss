openapi: 3.1.0
info:
  title: Kumoss Mapping Service
  version: "1.0.0"
  summary: Resolve a business identifier into an IaC repository reference.
  description: |
    The mapping service translates a "business identifier" (project name,
    subscription code, product slug, full repo URL — whatever an
    organization uses) into the repository Kumoss should clone, plus
    whatever else the organization's catalogue already knows about that
    identifier: the Terraform provider it deploys with and the cloud
    scope it deploys into.

    Only `repo_url` is guaranteed. `terraform_provider` and `scope_id`
    are best effort, and **`null` means "I do not know, ask the user"** —
    never "there is none". Kumoss skips the wizard step for any field the
    mapper answers, so a confident wrong answer is worse than `null`: the
    user is never prompted and never sees it. Return `null` whenever the
    catalogue is not authoritative.

    The OSS reference implementation under `services/mapping/` is an
    identity passthrough: the input identifier is treated as the repo
    URL, `terraform_provider` echoes whatever the caller sent, and
    `scope_id` is always `null`. It deliberately guesses at nothing. It
    exists so a fresh OSS deploy works end-to-end without anyone needing
    to write a real mapper.

    Enterprise implementations look up the identifier against an internal
    catalogue (CMDB, Backstage, a shared spreadsheet, …) and return the
    canonical IaC repo for it. The contract carries the result and says
    nothing about where the lookup data lives.

    The mapping service is invoked only by the Kumoss core; browser
    callers reach it through the core passthrough at
    `POST /v1/mapping/resolve`.
  contact:
    name: Kumoss maintainers
    url: https://github.com/InditexTech/kumoss
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://mapping:8081
    description: Default in-cluster URL when running via docker-compose.

tags:
  - name: resolve
    description: Resolve identifiers to IaC references.
  - name: ops
    description: Operational endpoints (liveness, readiness).

paths:
  /v1/resolve:
    post:
      operationId: resolve
      tags: [resolve]
      summary: Resolve a business identifier into an IaC repository reference.
      description: |
        Translates `identifier` into the repository the rest of Kumoss
        operates on, and optionally into the Terraform provider and cloud
        scope the caller would otherwise have to ask the user for.

        `repo_url` is required. `terraform_provider` and `scope_id` are
        best effort: implementations MUST return `null` rather than a
        guess, because the caller skips its corresponding prompt for any
        field that comes back non-null. `identifier` MUST echo the
        request's `identifier` verbatim so callers can correlate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Identifier was resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: |
            Request could not be parsed at the transport layer (malformed
            JSON, non-UTF-8 bytes in a JSON body, missing Content-Type).
            Implementations MAY return either a Problem object or a
            framework-default body for this case; the OSS reference impl
            currently returns the latter for FastAPI-internal parse
            errors. Distinct from 422 (well-formed JSON failing schema
            validation).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            Identifier could not be resolved. Implementations SHOULD use this
            for a clean "not in our catalogue" response, distinct from
            transient backend failures (which use 5xx).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Request body failed validation (well-formed JSON but does not
            satisfy the schema).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Downstream catalogue/CMDB returned an error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-service bearer token. The token value is the contents of the
        environment variable named in the system config (default
        `KUMOSS_MAPPING_TOKEN`). Implementations MAY accept all requests
        when no token is configured for local development.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          description: |
            Bearer challenge. RFC 9110 11.6.1 requires a 401 to carry at
            least one challenge, so implementations must send this.
          required: true
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    TerraformProvider:
      type: string
      enum: [azure, gcp, aws, oci, kubernetes]
      description: |
        Cloud provider a deployment targets. Values follow the core's
        provider vocabulary (`azure`, `gcp`, `aws`, `oci`,
        `kubernetes`), not Terraform registry provider names
        (`azurerm`, `google`).

    ResolveRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: |
            Business identifier to resolve. Free-form by design — could be
            a project name, a subscription code, a product slug, a full
            repo URL, or anything else the implementation accepts. The
            identity reference impl treats this as the repo URL directly.
          minLength: 1
          maxLength: 1024
          examples: ["my-project", "https://github.com/me/my-iac.git"]
        terraform_provider:
          description: |
            Provider the caller already knows the deployment targets.
            Implementations MAY use it to disambiguate identifiers that
            span clouds, and MUST echo it back in the response when it is
            sent. May be omitted or sent as null, which means the caller
            does not know either.
          anyOf:
            - $ref: "#/components/schemas/TerraformProvider"
            - type: "null"

    ResolveResponse:
      type: object
      required: [repo_url, identifier]
      additionalProperties: false
      properties:
        repo_url:
          type: string
          description: |
            HTTPS URL Kumoss should clone. Must use the `https://` scheme
            (case-insensitive) and name a host: Nebula clones, pushes and
            opens pull requests over HTTPS only, and rejects SSH,
            `git://`, `http://`, `file://` and local paths. When the
            identifier already is an `https://` repository URL,
            implementations pass it through unchanged; an identifier
            that cannot be mapped to one answers `404`.
          minLength: 1
          maxLength: 2048
          pattern: "^[Hh][Tt][Tt][Pp][Ss]://"
        identifier:
          type: string
          description: |
            The request's `identifier`, echoed verbatim. Normative rather
            than conventional: callers correlate responses on it.
          minLength: 1
          maxLength: 1024
          examples: ["my-project", "https://github.com/me/my-iac.git"]
        terraform_provider:
          description: |
            Provider the deployment targets. Echoes the request's value
            when one was sent; otherwise the implementation's best-effort
            answer, or `null` for "I do not know, ask the user". Never
            guess — the caller skips its provider prompt when this is
            non-null, so a wrong value is never seen or corrected.
          anyOf:
            - $ref: "#/components/schemas/TerraformProvider"
            - type: "null"
        scope_id:
          type: [string, "null"]
          description: |
            Cloud scope the deployment targets — Azure: subscription id,
            GCP: project id, AWS: account id, OCI: compartment OCID — as
            a best-effort answer, or `null` for "I do not know, ask the
            user". Same warning as `terraform_provider`: the caller skips
            its scope prompt when this is non-null, so a wrong value
            sends the user into a plan against the wrong scope with
            nothing to catch it.
          minLength: 1
          maxLength: 1024
          examples: ["0000aaaa-11bb-cccc-dd22-eeeeee333333", "my-gcp-project"]

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      description: |
        Problem details for HTTP APIs (RFC 7807).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
