openapi: 3.1.0
info:
  title: Kumoss Mapping Service
  version: "2.0.0"
  summary: Resolve a business identifier into an IaC repository reference.
  description: |
    The mapping service translates a "business identifier" (project name,
    subscription code, product slug, full repo URL — whatever an
    organization uses) into the repository Kumoss should clone.

    Changed in 2.0.0: the response carries the repository only. The
    former best-effort `terraform_provider` and `scope_id` fields are
    gone, along with the `TerraformProvider` schema: the core reads a
    session's providers from the root module's `required_providers` and
    its scopes from the module's `kumoss.yaml` manifest, so nothing
    consumes them any more. A request that still sends
    `terraform_provider` fails validation (`422`).

    The core calls this service when the web wizard scans a repository
    (`POST /api/v1/repository/parse`), so a user can type an identifier
    instead of a clone URL. Kumoss bundles a reference implementation,
    enabled by default, that appends a bare repository name to a
    configured URL prefix (`foo` → `<prefix>foo.git`) and passes full
    `https://` URLs through. While `services.mapping` is disabled, the
    core never calls a mapper and treats the identifier as the repo URL
    (identity passthrough).

    Other implementations look the identifier up against an internal
    catalogue (CMDB, Backstage, a shared spreadsheet, …) and return the
    canonical IaC repo for it. The contract carries the result and says
    nothing about where the lookup data lives. A `404` problem
    document's `detail` is shown to the user, so it should say what to
    type instead.

    The mapping service is invoked only by the Kumoss core.
  contact:
    name: Kumoss maintainers
    url: https://github.com/InditexTech/kumoss
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://mapping.example.com
    description: Placeholder. Kumoss calls the URL set in `services.mapping.endpoint`.

tags:
  - name: resolve
    description: Resolve identifiers to IaC references.
  - name: ops
    description: Operational endpoints (liveness, readiness).

paths:
  /v1/resolve:
    post:
      operationId: resolve
      tags: [resolve]
      summary: Resolve a business identifier into an IaC repository reference.
      description: |
        Translates `identifier` into the repository the rest of Kumoss
        operates on. `identifier` MUST echo the request's `identifier`
        verbatim so callers can correlate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Identifier was resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: |
            Request could not be parsed at the transport layer (malformed
            JSON, non-UTF-8 bytes in a JSON body, missing Content-Type).
            Implementations MAY return either a Problem object or a
            framework-default body for this case. Distinct from 422 (well-formed JSON failing schema
            validation).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but not authorized to call this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            Identifier could not be resolved. Implementations SHOULD use this
            for a clean "not in our catalogue" response, distinct from
            transient backend failures (which use 5xx).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Request body failed validation (well-formed JSON but does not
            satisfy the schema).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Downstream catalogue/CMDB returned an error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-service bearer token. The token value is the contents of the
        environment variable named in the system config (default
        `KUMOSS_MAPPING_TOKEN`). Implementations MAY accept all requests
        when no token is configured for local development.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          description: |
            Bearer challenge. RFC 9110 11.6.1 requires a 401 to carry at
            least one challenge, so implementations must send this.
          required: true
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ResolveRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: |
            Business identifier to resolve. Free-form by design — could be
            a project name, a subscription code, a product slug, a full
            repo URL, or anything else the implementation accepts. The
            core's disabled-mode passthrough treats it as the repo URL
            directly.
          minLength: 1
          maxLength: 1024
          examples: ["my-project", "https://github.com/me/my-iac.git"]

    ResolveResponse:
      type: object
      required: [repo_url, identifier]
      additionalProperties: false
      properties:
        repo_url:
          type: string
          description: |
            HTTPS URL Kumoss should clone. Must use the `https://` scheme
            (case-insensitive) and name a host: Kumoss clones, pushes and
            opens pull requests over HTTPS only, and rejects SSH,
            `git://`, `http://`, `file://` and local paths. When the
            identifier already is an `https://` repository URL,
            implementations pass it through unchanged; an identifier
            that cannot be mapped to one answers `404`.
          minLength: 1
          maxLength: 2048
          pattern: "^[Hh][Tt][Tt][Pp][Ss]://"
        identifier:
          type: string
          description: |
            The request's `identifier`, echoed verbatim. Normative rather
            than conventional: callers correlate responses on it.
          minLength: 1
          maxLength: 1024
          examples: ["my-project", "https://github.com/me/my-iac.git"]

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      description: |
        Problem details for HTTP APIs (RFC 7807).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
