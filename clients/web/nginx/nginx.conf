# duplicate entries let NGINX "try the next server" even though it's the same socket
upstream app_upstream {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:8000 max_fails=1 fail_timeout=2s;
    keepalive 32;
}

upstream trace_upstream {
    server 127.0.0.1:6006 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:6006 max_fails=1 fail_timeout=2s;
    keepalive 8;
}
server {
    listen 80;

    # Security Headers
    add_header X-Frame-Options            "SAMEORIGIN";
    add_header X-Content-Type-Options     "nosniff";

    client_max_body_size 4m;

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fail fast on dead listener; keep long timeouts for slow handlers
        proxy_connect_timeout 2s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Retry once on upstream connect/timeouts/temporary 5xx
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;        # 1 original try + 1 retry = 2
        proxy_next_upstream_timeout 3s;     # total budget for retries

        proxy_pass http://app_upstream;
    }

    # Phoenix Tracer
    location /monitoring/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_pass http://trace_upstream/; # trailing slash needed
    }

    # priority with ^~
    location ^~ /favicon/ {
        root /public;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # user portal
    location / {
        root /public/user_portal/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # Compression
    gzip on;
    gzip_http_version 1.1;
    gzip_types text/css application/javascript application/json text/javascript;
    gzip_min_length 1k;
    gzip_comp_level 6;

    # Logging
    access_log /dev/stdout combined;
    error_log /dev/stdout warn;
}
