version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      first-party-actions:
        patterns:
          - InditexTech/gh-actions/*
      # init and analyze are entrypoints of the same github/codeql-action repo
      # and share one release version; CodeQL rejects a run whose init and
      # analyze versions differ. Grouping the family forces one PR that bumps
      # every entrypoint to the same version together.
      codeql-action:
        patterns:
          - github/codeql-action/*

  # Python packages live in uv-managed projects (core + services/*).
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /services/authz
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /services/iac
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /services/mapping
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
