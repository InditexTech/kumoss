#
# Code scanning configuration for the adhoc CodeQL workflow
# (.github/workflows/codeql.yml). Paths are repository-root relative.
#
# Python (core, services/*, contracts), actions and JS/TS (client/web, docs)
# are analyzed over the whole tree; node_modules and build output only are
# excluded.

paths:
  - client/web
  - docs
  - core
  - services
  - contracts
  - .github

paths-ignore:
  - client/web/node_modules
  - client/web/dist
  - docs/node_modules
