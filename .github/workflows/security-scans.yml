name: Security Scans

on:
  pull_request:
  schedule:
    # Mondays 05:23 UTC, after the weekly dependabot wave.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan (report only)
        continue-on-error: true
        run: semgrep scan --config auto --exclude-rule generic.secrets.security.detected-generic-secret --sarif --output semgrep.sarif --error

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: semgrep.sarif

  bandit:
    name: Bandit (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, services/authz, services/iac, services/mapping, services/notifications]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Run Bandit
        # Advisory until the backlog is triaged: core alone reports 145
        # pre-existing findings (assert/subprocess patterns), the other 4
        # packages are clean.
        continue-on-error: true
        run: uvx --from 'bandit[toml]' bandit -r . -x tests -f sarif -o bandit.sarif

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{ matrix.package }}/bandit.sarif

  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - core/Dockerfile
          - nginx/Dockerfile
          - services/authz/Dockerfile
          - services/iac/Dockerfile
          - services/mapping/Dockerfile
          - services/notifications/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Pre-existing debt: DL3008 in core/iac (unpinned apt), DL3003/4006
          # in iac. Only error-level findings block; warnings are tracked for
          # a follow-up cleanup.
          failure-threshold: error
          ignore: DL3008,DL3003,DL4006

  osv-scanner:
    name: OSV Scanner (dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=table
            ./core/uv.lock
            ./services/authz/uv.lock
            ./services/iac/uv.lock
            ./services/mapping/uv.lock
            ./services/notifications/uv.lock
            ./client/web/package-lock.json
            ./docs/package-lock.json
