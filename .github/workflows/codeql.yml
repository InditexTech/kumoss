name: CodeQL

on:
  push:
    # This repository runs trunk-based development on `main` only.
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanning-availability:
    name: Resolve code scanning availability
    # kumoss is not engine-governed: no DEVELOPMENT_FLOW / CODE_SCANNING_ENABLED
    # repo vars exist. Availability is decided from the repository itself.
    # Enable GHAS scanning on public repos and private repos with an Advanced
    # Security seat; the workflow runs regardless of that decision.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
    steps:
      - name: Resolve availability
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.visibility' 2>/dev/null || echo unknown)"
          seat="$(gh api "/repos/${GITHUB_REPOSITORY}" \
            --jq '.security_and_analysis.advanced_security.status // "unknown"' 2>/dev/null || echo unknown)"
          enabled=false
          if [ "${visibility}" = "public" ]; then
            enabled=true
          elif [ "${seat}" = "enabled" ]; then
            enabled=true
          fi
          echo "Code scanning availability: visibility=${visibility} seat=${seat} enabled=${enabled}"
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scanning-availability
    if: needs.scanning-availability.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Lets CodeQL read run metadata for SARIF dedup.
      contents: read
      packages: read # Lets CodeQL fetch language packs for analysis.
      security-events: write # Lets CodeQL publish SARIF results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
            paths: |
              client/web
              docs
            paths-ignore: |
              client/web/node_modules
              docs/node_modules
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
          paths: ${{ matrix.paths || '' }}
          paths-ignore: ${{ matrix.paths-ignore || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}
