# Publishes every Kumoss-built image to ghcr.io/inditextech/kumoss/<image>
# when a GitHub Release is published. release-please publishes the Release
# with the GitHub App token (see release-please.yml), so the
# `release: published` event does reach this workflow.
#
# Tags pushed for release vX.Y.Z: X.Y.Z, X.Y, X and latest. The image names
# and the release-please-bumped tags in docker-compose.yml must match.
name: Publish Images
permissions: {}

on:
  release:
    types: [published]

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # Push to GHCR with GITHUB_TOKEN.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: core/Dockerfile
          - image: authz
            dockerfile: services/authz/Dockerfile
          - image: iac
            dockerfile: services/iac/Dockerfile
          - image: mapping
            dockerfile: services/mapping/Dockerfile
          - image: notifications
            dockerfile: services/notifications/Dockerfile
          - image: proxy
            dockerfile: nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/inditextech/kumoss/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=kumoss-${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Every Dockerfile copies paths relative to the repository root.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
