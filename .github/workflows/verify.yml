name: Verify

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  services:
    name: services/${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [iac, notifications, mapping]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group tooling

      - name: Tests
        run: uv run --no-sync pytest

  policies:
    name: Compliance policy
    runs-on: ubuntu-latest
    env:
      # Same OPA as the core image (core/Dockerfile).
      OPA_IMAGE: openpolicyagent/opa:1.22.4-static@sha256:12cecac5a174368f7d3f09d3a19d040ebe0c91d576e520335ae7a985a26e39d3
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        run: docker run --rm -v "$PWD:/core:ro" -w /core "$OPA_IMAGE" fmt --diff --fail prompts/seed/*/policies tests/policies

      - name: Check
        run: docker run --rm -v "$PWD:/core:ro" -w /core "$OPA_IMAGE" check prompts/seed/*/policies tests/policies

      - name: Tests
        run: docker run --rm -v "$PWD:/core:ro" -w /core "$OPA_IMAGE" test --verbose prompts/seed/*/policies tests/policies

  lockfiles:
    name: lockfile/${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [core, contracts/conformance/authz]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
