name: Verify

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  core:
    name: core
    runs-on: ubuntu-latest
    # Same toolchain image as core/Dockerfile's build stage.
    container: rust:1-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kumoss
          POSTGRES_PASSWORD: kumoss
          POSTGRES_DB: kumoss_test
        options: >-
          --health-cmd "pg_isready -U kumoss -d kumoss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database for the integration tests (schema parity, API catalog).
      KUMOSS_TEST_DATABASE_URL: postgres://kumoss:kumoss@postgres:5432/kumoss_test
      CARGO_NET_RETRY: "10"
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  services:
    name: services/${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [llm, iac, notifications]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group tooling

      - name: Tests
        run: uv run --no-sync pytest

  lockfiles:
    name: lockfile/${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [services/llm, contracts/conformance/authz]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
