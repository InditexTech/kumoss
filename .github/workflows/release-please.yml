# Keeps a release PR open against main that bumps every version field listed
# in release-please-config.json and prepends the CHANGELOG entry; merging it
# tags vX.Y.Z and publishes the GitHub Release.
#
# Everything is done with the GitHub App token rather than GITHUB_TOKEN:
# events raised by GITHUB_TOKEN don't trigger other workflows, so the release
# PR would skip pr-verify/verify and the published Release would never reach
# docouture-release.yml (which republishes docs/stable on `release: published`).
name: Release Please
permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    # The CLI job below needs to know whether this run cut a release, and its tag.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Git app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # The `autorelease: pending|tagged` labels go through the issues API.
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attaches the CLI archives to the Release release-please already published.
  # Append mode: no second release, no new version field. The tag drives the
  # version, so nothing here reads the manifest.
  cli-binaries:
    name: CLI binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Upload assets to the Release.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # goreleaser reads the tag from the git history.

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: client/cli/go.mod
          cache-dependency-path: client/cli/go.sum

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config client/cli/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
