# Keeps a release PR open against main that bumps every version field listed
# in release-please-config.json and prepends the CHANGELOG entry; merging it
# tags vX.Y.Z and publishes the GitHub Release.
#
# Everything is done with the GitHub App token rather than GITHUB_TOKEN:
# events raised by GITHUB_TOKEN don't trigger other workflows, so the release
# PR would skip pr-verify/verify and the published Release would never reach
# docouture-release.yml (which republishes docs/stable on `release: published`).
name: Release Please
permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Git app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # The `autorelease: pending|tagged` labels go through the issues API.
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please writes the Release body from the release PR body, which
      # does not pick up notes committed to CHANGELOG.md on the release branch
      # (highlights, upgrade notes). Copy the released CHANGELOG section over
      # it so the GitHub Release and CHANGELOG.md say the same thing.
      - name: Sync the Release notes with CHANGELOG.md
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          # The release commit: reading by SHA doesn't depend on the new tag
          # being visible through the API yet.
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${SHA}" \
            -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/CHANGELOG.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' "${RUNNER_TEMP}/CHANGELOG.md" > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md at ${TAG} has no ${VERSION} section; see CONTRIBUTING.md (Releases) to sync the Release by hand"
            exit 1
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/notes.md"
