# Default Nebula system config bundled with the docker-compose stack.
#
# This file is read by the core when NEBULA_CONFIG points at it (the
# docker-compose `api` service sets that env var and mounts this file
# read-only at /etc/nebula/config.yaml). It carries deployment-tunable
# knobs — no secrets.
#
# Secrets live in env vars. The core looks them up by name; the default
# names (AWS_ACCESS_KEY_ID, GOOGLE_APPLICATION_CREDENTIALS, GIT_TOKEN,
# NEBULA_<SERVICE>_TOKEN, …) are defined in code and don't need to be
# repeated here. Override only if you need a different env var name —
# see core/src/shared/config/system_config.py for the `*_env` fields.
#
# To customize, edit this file (e.g., flip `services.mapping.enabled` to
# true and point it at a self-hosted mapper) or override per-environment
# via a docker-compose.override.yml / your own NEBULA_CONFIG path.

# development | staging | production. Surface only — used in telemetry/log
# tagging; no behavior gates are keyed on it today.
environment: "development"

# OIDC issuer settings used by the React frontend when it logs in to the
# core. Leave blank to disable OIDC auth (dev default).
oidc:
  issuer_url: ""
  client_id: ""
  audience: ""

# Bootstrap administrator. The address listed here is granted the
# root-admin role on first run. Leave blank to skip the bootstrap.
admin:
  default_root_email: ""

# LLM model selection — powered by LiteLLM Router.
#
# `model` and `small_model` pick which model_list entry is used for each
# role.  `model_list` follows the LiteLLM Router format; credential
# values use the `os.environ/VAR_NAME` syntax so secrets stay in env
# vars — the core validates every such reference at boot.
#
# Refer to:
#   - Readme # LiteLLM models and params reference
#   or
#   - https://models.litellm.ai/              — model IDs
#   - https://docs.litellm.ai/docs/providers  — provider credential keys

llm:
  # Complex tasks model
  model: "vertex_ai/claude-sonnet-5"
  temperature: 0.1
  max_output_tokens: 32000
  # Simple tasks model
  small_model: "vertex_ai/gemini-3.7-flash"
  small_model_temperature: 0.1
  small_model_max_output_tokens: 32000

  model_list:
    # Google Vertex AI
    - model_name: "vertex_ai/claude-sonnet-5"
      litellm_params:
        model: "vertex_ai/claude-sonnet-5"
        vertex_project: "os.environ/VERTEXAI_PROJECT"
        vertex_location: "os.environ/VERTEXAI_LOCATION"
        vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"
    - model_name: "vertex_ai/gemini-3.7-flash"
      litellm_params:
        model: "vertex_ai/gemini-3.7-flash"
        vertex_project: "os.environ/VERTEXAI_PROJECT"
        vertex_location: "os.environ/VERTEXAI_LOCATION"
        vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"

    # Azure AI Foundry
    # - model_name: "azure_ai/claude-sonnet-5"
    #   litellm_params:
    #     model: "azure_ai/claude-sonnet-5"
    #     api_key: "os.environ/AZURE_AI_API_KEY"
    #     api_base: "os.environ/AZURE_AI_API_BASE"
    # - model_name: "azure_ai/claude-haiku-4-5"
    #   litellm_params:
    #     model: "azure_ai/claude-haiku-4-5"
    #     api_key: "os.environ/AZURE_AI_API_KEY"
    #     api_base: "os.environ/AZURE_AI_API_BASE"

    # # AWS Bedrock
    # - model_name: "bedrock/anthropic.claude-3-5-haiku-20241022-v1:0"
    #   litellm_params:
    #     model: "bedrock/anthropic.claude-3-5-haiku-20241022-v1:0"
    #     aws_access_key_id: "os.environ/AWS_ACCESS_KEY_ID"
    #     aws_secret_access_key: "os.environ/AWS_SECRET_ACCESS_KEY"
    #     aws_region_name: "os.environ/AWS_REGION_NAME"

    # # Google Vertex AI
    # - model_name: "vertex_ai/claude-haiku-4-5@20251001"
    #   litellm_params:
    #     model: "vertex_ai/claude-haiku-4-5@20251001"
    #     vertex_project: "os.environ/VERTEXAI_PROJECT"
    #     vertex_location: "os.environ/VERTEXAI_LOCATION"
    #     vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"

    # # OpenAI Direct
    # - model_name: "openai/gpt-4o"
    #   litellm_params:
    #     model: "openai/gpt-4o"
    #     api_key: "os.environ/OPENAI_API_KEY"

    # # Local Ollama
    # - model_name: "ollama/llama3.2"
    #   litellm_params:
    #     model: "ollama/llama3.2"
    #     api_base: "os.environ/OLLAMA_API_BASE"

# Microservice wiring. `endpoint` is the base URL the core calls.
# `token_env` is the name of the env var that holds the bearer token
# the core sends on every request. `timeout` is the per-request HTTP
# budget in seconds — every call returns promptly (long work runs as
# asynchronous jobs the core polls), so it only needs to cover one
# request/response round trip. Any enabled service whose token_env
# resolves to an empty value will refuse the core's boot — flip
# `enabled: false` to skip a service entirely.
services:
  notifications:
    enabled: true
    endpoint: "http://notifications:8080"
    token_env: "NEBULA_NOTIFICATIONS_TOKEN"
    timeout: 30.0
  mapping:
    enabled: true
    endpoint: "http://mapping:8081"
    token_env: "NEBULA_MAPPING_TOKEN"
    timeout: 30.0
  authz:
    enabled: false
    endpoint: "http://authz:8083"
    token_env: "NEBULA_AUTHZ_TOKEN"
    timeout: 30.0
  iac:
    enabled: true
    endpoint: "http://iac:8082"
    token_env: "NEBULA_IAC_TOKEN"
    timeout: 30.0
    job_poll_interval: 5.0
    job_timeout: 3600.0

# Iteration limits and batch sizes for the core's orchestration loops.
# Raise carefully — these bound runaway-loop costs.
#
# enable_compliance_checker: When enabled, critical agent chains
# include a check_compliance tool that validates output
# against curated rules before allowing completion.
#
# max_drift_reports: TODO
orchestration:
  enable_compliance_checker: true
  max_drift_reports: 3
  max_validation_iteration: 5
  max_tool_chain_executions: 70
  max_session_events_iteration: 2160
  drift_group_operations: 8
  pull_request_readiness_seconds: 10

