# Default Kumoss system config bundled with the docker-compose stack.
#
# This file is baked into the kumoss-core image at build time (the
# Dockerfile copies it to /etc/kumoss/config.yaml, the path the core
# reads by default; set KUMOSS_CONFIG to load a different file). Edits
# here are NOT hot-reloaded — `docker compose watch` only syncs ./core —
# so rebuild after changing it: `docker compose build core`. It carries
# deployment-tunable knobs — no secrets.
#
# Secrets live in env vars. The core looks them up by name; the default
# names (GIT_USER, GIT_TOKEN, KUMOSS_SQL_DATABASE_URL, RUSTFS_ACCESS_KEY,
# KUMOSS_<SERVICE>_TOKEN, …) are defined in code and don't need to be
# repeated here. LLM provider credentials use LiteLLM's own variable
# names:
#   https://inditextech.github.io/kumoss/prerelease/main/reference/llm-providers/
# Override only if you need a different env var name — see
# core/src/shared/config/system_config.py for the `*_env` fields.
#
# To customize, edit this file (e.g., flip `services.mapping.enabled` to
# true and point it at a self-hosted mapper) or override per-environment
# via a docker-compose.override.yml / your own KUMOSS_CONFIG path.

# development | staging | production. Selects the Phoenix tracing project
# prefix (dev-/pre-/pro-) and is the tag used when seeding and fetching
# Phoenix prompts:
#   https://inditextech.github.io/kumoss/prerelease/main/guides/monitor-with-phoenix/
#   https://inditextech.github.io/kumoss/prerelease/main/guides/customize-prompts/
# No security gates are keyed on it.
environment: "development"

# OIDC login + bearer-token validation. Blank issuer_url disables auth
# entirely (dev default: every request acts as a local developer with
# top roles). Optional overrides (`audience`, `scope`), per-IdP setup
# and quirks (Entra ID, Keycloak, Auth0):
#   https://inditextech.github.io/kumoss/prerelease/main/guides/enable-authentication/
# clock_skew_seconds is the allowed leeway on exp/iat/nbf.
oidc:
  issuer_url: ""
  client_id: ""
  clock_skew_seconds: 60

# Bootstrap administrator. The user whose access token carries an `email`
# claim matching this address together with `email_verified: true` is
# elevated to the top role of both role groups (operation devops + panel
# admin) when they log in — on first login for new users, on the next
# login for existing ones. IdPs that never emit `email_verified` (Entra
# ID, Auth0, Okta) cannot bootstrap this way: set the roles in the users
# table instead — see "Bootstrap admin" at
#   https://inditextech.github.io/kumoss/prerelease/main/guides/enable-authentication/
# Elevation is one-way: clearing this field later never demotes anyone.
# Leave blank to skip.
admin:
  default_root_email: ""

# Microservice wiring. `endpoint` is the base URL the core calls.
# `token_env` is the name of the env var that holds the bearer token
# the core sends on every request. `timeout` is the per-request HTTP
# budget in seconds — every call returns promptly (long work runs as
# asynchronous jobs the core polls), so it only needs to cover one
# request/response round trip. Any service the core calls whose
# token_env resolves to an empty value will refuse the core's boot —
# flip `enabled: false` to skip an optional service entirely.
services:
  notifications:
    enabled: true
    endpoint: "http://notifications:8080"
    token_env: "KUMOSS_NOTIFICATIONS_TOKEN"
    timeout: 30.0
  mapping:
    enabled: false
    endpoint: "http://mapping:8081"
    token_env: "KUMOSS_MAPPING_TOKEN"
    timeout: 30.0
  authz:
    enabled: false
    endpoint: "http://authz:8083"
    token_env: "KUMOSS_AUTHZ_TOKEN"
    timeout: 30.0
  iac:
    endpoint: "http://iac:8082"
    token_env: "KUMOSS_IAC_TOKEN"
    timeout: 30.0
    job_poll_interval: 5.0
    job_timeout: 3600.0

# Iteration limits and behaviour switches for the core's orchestration
# loops. Raise the limits carefully — they bound runaway-loop costs.
#
# The two gates below both default to false in code, so an
# orchestration block that omits them turns them off.
#
# enable_compliance_checker: When enabled, a validated generate round is
# audited by a second small-model agent against the
# general-compliance-report rules. A finding of severity "error" or
# "critical" locks the session; "warning" is only reported.
#
# block_on_high_impact: When enabled, a generate round whose report
# comes back with a "high" impact banner locks the session too. The
# banner is produced either way; this only decides whether it gates.
#
# A locked session refuses apply and PR merge with 409 until a later
# clean generate round or a panel editor unlocks it.
#
# max_drift_reports: maximum detect-and-remediate iterations in a drift
# session. Every knob is described at
#   https://inditextech.github.io/kumoss/prerelease/main/reference/configuration/
orchestration:
  enable_compliance_checker: true
  block_on_high_impact: true
  max_drift_reports: 5
  max_validation_iteration: 8
  max_tool_chain_executions: 70
  max_session_events_iteration: 2160
  drift_group_operations: 8
  pull_request_readiness_seconds: 10

# LLM model selection — powered by LiteLLM Router.
#
# `model` handles complex tasks, `small_model` cheap filler tasks. Both
# are LiteLLM model strings (`provider/model-id`). Credentials are read
# from the provider's standard env vars, set in core/.env — the models
# below need ANTHROPIC_API_KEY. For providers LiteLLM can validate
# (anthropic/..., vertex_ai/..., openai/..., azure/...) the core fails
# boot when the required env vars are missing; for the rest (azure_ai/...
# among them) a missing or invalid credential is only detected on the
# first LLM call.
# Advanced routing (load balancing, custom credential env var names,
# per-entry endpoints) is available via an optional `model_list` key.
# The core passes only that list to the Router, so router-level
# fallbacks between different models are not configurable.
#
# Refer to:
#   - https://inditextech.github.io/kumoss/prerelease/main/reference/llm-providers/  — Kumoss's LiteLLM guide
#   - https://models.litellm.ai/                                                     — model IDs
#   - https://docs.litellm.ai/docs/providers                                         — provider credential keys
llm:
  # Complex tasks model
  model: "vertex_ai/claude-sonnet-4-6"
  # Simple tasks model
  small_model: "vertex_ai/gemini-3.8-flash"
  # Applied to both models
  temperature: 0.1
  max_output_tokens: 32000
  timeout: 600

# Filesystem paths used by the core. `upload_folder` must be writable
# and (in the docker stack) shared with the IaC service via the
# `workspaces` volume so both see the same cloned-repo paths.
# `session_plan_filename` names the plan artifact inside a session
# workspace (written by plan, carried by the pinned workspace, executed
# by apply); it must be a bare filename (single path segment) and should
# keep the `.plan` suffix so the injected terraform gitignore covers it.
paths:
  upload_folder: "/workspaces"
  session_plan_filename: "session.plan"

# Kumoss Postgres database. Connection URLs embed credentials, so they are
# referenced indirectly: this key names the env var that holds the actual URL.
# Override only to read different env var names.
# The core refuses to boot when the env var resolves empty.
database:
  kumoss_database_url_env: "KUMOSS_SQL_DATABASE_URL"

# Redis session store / cache. The URL may embed a password, so it is
# read from the env var named by `redis_url_env`; when that env var is
# unset, `default_url` (the docker-compose service) is used. Timeouts
# (seconds) are deliberately aggressive: Redis is a cache, so a slow or
# unreachable server should fail fast and let reads fall through to the
# database instead of stalling requests. `pool_timeout` is how long a
# request may wait for a free pooled connection under a burst.
redis:
  redis_url_env: "KUMOSS_REDIS_URL"
  default_url: "redis://redis:6379/0"
  max_connections: 20
  socket_connect_timeout: 2.0
  socket_timeout: 2.0
  pool_timeout: 2.0

# OTel telemetry. `collector_url` is a base URL; the OTLP endpoint is
# computed at use time as `f"{collector_url}v1/traces"`. The value below
# is also the in-code default: Phoenix as reachable on the docker
# network. Running the core outside docker needs http://localhost:6006/.
telemetry:
  collector_url: "http://phoenix:6006/"
  otel_attribute_count_limit: 1024
  otel_console_exporter: false

# Browser-facing CORS origins. The docker-compose stack serves the
# frontend via nginx on :80, so http://localhost is the default. Add
# http://localhost:5173 if you run the Vite dev server outside docker
# and point it at the API container.
http:
  cors_origins:
    - "http://localhost"

# Object storage for generated artifacts (reports, terraform plans, code
# changes). `provider` is ObjectStorageProvider enum names (see
# core/src/shared/constants.py::ObjectStorageProvider): RUSTFS (the
# bundled store, or any custom-endpoint S3-compatible server), S3
# (real AWS S3 on its regional default endpoints), or STORAGE_ACCOUNT
# (a public Azure storage account — point both URLs at the account
# blob endpoint https://<account>.blob.core.windows.net; the account
# name is derived from endpoint_url, the container from `bucket`, and
# the shared key from the STORAGE_ACCOUNT_KEY env var; `region` is
# ignored).
#
# `terraform_state_bucket` ships SET, so Kumoss owns Terraform state out
# of the box: a second bucket (blob container on STORAGE_ACCOUNT) in the
# same store as `bucket`, created at boot, with a matching backend
# written into every workspace before `init`, keyed by project. It is
# separate from `bucket` so state does not inherit the artifacts
# bucket's lifecycle or presign policy, and it is what lets a repository
# that declares no backend of its own work unchanged.
#
# Set it to "" to turn managed state off: Kumoss then writes no backend
# override and every repository must declare its own, with the iac
# sidecar holding that backend's credentials. Use an explicit "" rather
# than an empty value — the field is a string, and a YAML null fails
# validation at boot. Deleting the key restores the default, which is
# this same bucket name. See
#   https://inditextech.github.io/kumoss/prerelease/main/guides/configure-state-backends/
#
# `presign_expiry_seconds` must outlive the 24h cached finished-session
# aggregate that embeds these URLs: the core refuses values under 30h
# (108000) or over the SigV4 7-day limit (604800).
#
# `connect_timeout` / `read_timeout` are per-request budgets in seconds;
# `max_attempts` is the botocore standard-mode retry count.
storage:
  provider: "RUSTFS"
  bucket: "kumoss-artifacts"
  terraform_state_bucket: "kumoss-terraform-state"
  endpoint_url: "http://object-storage:9000"
  public_endpoint_url: "http://localhost:9000"
  region: "us-east-1"
  connect_timeout: 3.0
  read_timeout: 10.0
  max_attempts: 3
  presign_expiry_seconds: 172800

# Git push provider + author. Credentials (username + PAT) are read from
# env at boot (default GIT_USER / GIT_TOKEN). When either is empty the
# core logs a warning and skips the credential setup (push will then
# need a mounted ~/.git-credentials or SSH keys; note that pull-request
# creation and merge call the provider REST API with GIT_TOKEN over
# HTTPS, so SSH alone cannot open or merge pull requests).
#
# `provider` defaults to GITHUB and must be a GitProviderName enum name
# or value (see core/src/shared/constants.py::GitProviderName): GITHUB,
# AZURE_DEVOPS, GITLAB. Full field reference:
#   https://inditextech.github.io/kumoss/prerelease/main/reference/configuration/
git:
  provider: "GITHUB"
  author_name: "Kumoss"
  author_email: "kumoss@noreply.invalid"


