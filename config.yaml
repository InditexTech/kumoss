# Filesystem paths used by the core. `upload_folder` must be writable
# and (in the docker stack) shared with the IaC service via the
# `workspaces` volume so both see the same cloned-repo paths.
paths:
  upload_folder: "/workspaces"

# Databases (Nebula postgres + Phoenix collector). Connection URLs embed
# credentials, so they are referenced indirectly: these keys name the
# env vars that hold the actual URLs (defaults shown). Override only to
# read different env var names. The core refuses to boot when either
# env var resolves empty.
database:
  nebula_database_url_env: "NEBULA_SQL_DATABASE_URL"
  phoenix_database_url_env: "PHOENIX_SQL_DATABASE_URL"

# Redis session store / cache. The URL may embed a password, so it is
# read from the env var named by `redis_url_env`; when that env var is
# unset, `default_url` (the docker-compose service) is used. Timeouts
# (seconds) are deliberately aggressive: Redis is a cache, so a slow or
# unreachable server should fail fast and let reads fall through to the
# database instead of stalling requests. `pool_timeout` is how long a
# request may wait for a free pooled connection under a burst.
redis:
  redis_url_env: "NEBULA_REDIS_URL"
  default_url: "redis://redis:6379/0"
  max_connections: 20
  socket_connect_timeout: 2.0
  socket_timeout: 2.0
  pool_timeout: 2.0

# OTel telemetry. `collector_url` is a base URL; the OTLP endpoint is
# computed at use time as `f"{collector_url}v1/traces"`. Phoenix is
# reachable as `phoenix:6006` on the docker network; the in-code default
# (http://localhost:6006/) only works when running the core outside docker.
telemetry:
  collector_url: "http://phoenix:6006/"
  otel_attribute_count_limit: 1024
  otel_console_exporter: false

# Browser-facing CORS origins. The docker-compose stack serves the
# frontend via nginx on :80, so http://localhost is the default. Add
# http://localhost:5173 if you run the Vite dev server outside docker
# and point it at the API container.
http:
  cors_origins:
    - "http://localhost"

# Object storage for generated artifacts (reports, terraform plans, code
# changes). `provider` is ObjectStorageProvider enum names (see
# core/src/shared/constants.py::ObjectStorageProvider): RUSTFS (the
# bundled store, or any custom-endpoint S3-compatible server), S3
# (real AWS S3 on its regional default endpoints), or STORAGE_ACCOUNT
# (a public Azure storage account — point both URLs at the account
# blob endpoint https://<account>.blob.core.windows.net; the account
# name is derived from endpoint_url, the container from `bucket`, and
# the shared key from the STORAGE_ACCOUNT_KEY env var; `region` is
# ignored).
#
# `presign_expiry_seconds` must outlive the 24h cached finished-session
# aggregate that embeds these URLs: the core refuses values under 30h
# (108000) or over the SigV4 7-day limit (604800).
#
# `connect_timeout` / `read_timeout` are per-request budgets in seconds;
# `max_attempts` is the botocore standard-mode retry count.
storage:
  provider: "RUSTFS"
  bucket: "nebula-artifacts"
  endpoint_url: "http://object-storage:9000"
  public_endpoint_url: "http://localhost:9000"
  region: "us-east-1"
  connect_timeout: 3.0
  read_timeout: 10.0
  max_attempts: 3
  presign_expiry_seconds: 172800

# Git push provider + author. Credentials (username + PAT) are read from
# env at use time (default GIT_USER / GIT_TOKEN). Leave `provider` blank to
# disable push-credential setup (push will then need mounted
# ~/.git-credentials, SSH keys, or PAT-embedded repo_uri).
#
# `provider` is GitProviderName enum names (see
# core/src/shared/constants.py::GitProviderName). Examples: GITHUB,
# AZURE_DEVOPS, GITLAB.
git:
  provider: "GITHUB"
  author_name: "Nebula"
  author_email: "nebula@noreply.invalid"

