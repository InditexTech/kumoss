{{- range $component := list "proxy" "core" "iac" "notifications" }}
{{- $c := index $.Values $component }}
{{- if and $c.serviceAccount.create (or (ne $component "notifications") $c.enabled) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kumoss.serviceAccountName" (list $ $component) }}
  labels:
    {{- include "kumoss.componentLabels" (list $ $component) | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $c.serviceAccount.automount }}
{{- end }}
{{- end }}
