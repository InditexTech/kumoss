{{- /* One Secret per component that sets secretEnv in values. */ -}}
{{- range $component := list "proxy" "core" "iac" "notifications" }}
{{- with (index $.Values $component).secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kumoss.envSecret" (list $ $component) }}
  labels:
    {{- include "kumoss.componentLabels" (list $ $component) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
