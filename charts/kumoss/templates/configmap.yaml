apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kumoss.component" (list . "core") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "core") | nindent 4 }}
data:
  config.yaml: |
    {{- include "kumoss.coreConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kumoss.component" (list . "proxy") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "proxy") | nindent 4 }}
data:
  default.conf: |
    {{- include "kumoss.nginxConf" . | nindent 4 }}
{{- if .Values.searxng.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kumoss.component" (list . "searxng") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "searxng") | nindent 4 }}
data:
  settings.yml: |
    {{- .Files.Get "files/searxng-settings.yml" | nindent 4 }}
{{- end }}
{{- if and .Values.caBundle.certificates (not .Values.caBundle.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kumoss.caBundle.configMap" . }}
  labels:
    {{- include "kumoss.labels" . | nindent 4 }}
data:
  extra-roots.crt: |
    {{- .Values.caBundle.certificates | nindent 4 }}
{{- end }}
