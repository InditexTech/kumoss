{{- /*
Credentials shared between components. Each value is, in order: the one
set in values, the one already stored in this Secret (so upgrades keep
it), or a fresh random one. Everything derived from a password (the
connection URLs) is computed here, in the same render, so it always
matches.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "kumoss.internalSecret" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pick := dict }}
{{- range $key, $value := dict
  "KUMOSS_IAC_TOKEN" .Values.secrets.iacToken
  "KUMOSS_NOTIFICATIONS_TOKEN" .Values.secrets.notificationsToken
  "RUSTFS_ACCESS_KEY" .Values.secrets.objectStorageAccessKey
  "RUSTFS_SECRET_KEY" .Values.secrets.objectStorageSecretKey
  "CORE_DB_PASSWORD" .Values.secrets.coreDbPassword
  "PHOENIX_DB_PASSWORD" .Values.secrets.phoenixDbPassword
  "SEARXNG_SECRET" .Values.secrets.searxngSecret }}
{{- if $value }}
{{- $_ := set $pick $key $value }}
{{- else if hasKey $existing $key }}
{{- $_ := set $pick $key (index $existing $key | b64dec) }}
{{- else }}
{{- $_ := set $pick $key (randAlphaNum 32) }}
{{- end }}
{{- end }}
{{- $coreDbUrl := .Values.postgres.core.externalUrl }}
{{- if .Values.postgres.core.enabled }}
{{- $coreDbUrl = printf "postgresql://postgres:%s@%s:5432/%s" (urlquery $pick.CORE_DB_PASSWORD | replace "+" "%20") (include "kumoss.component" (list . "core-db")) .Values.postgres.core.database }}
{{- end }}
{{- $phoenixDbUrl := .Values.postgres.phoenix.externalUrl }}
{{- if .Values.postgres.phoenix.enabled }}
{{- $phoenixDbUrl = printf "postgresql://postgres:%s@%s:5432/%s" (urlquery $pick.PHOENIX_DB_PASSWORD | replace "+" "%20") (include "kumoss.component" (list . "phoenix-db")) .Values.postgres.phoenix.database }}
{{- end }}
{{- if not $coreDbUrl }}
{{- fail "postgres.core.externalUrl is required when postgres.core.enabled is false" }}
{{- end }}
{{- if and .Values.phoenix.enabled (not $phoenixDbUrl) }}
{{- fail "postgres.phoenix.externalUrl is required when postgres.phoenix.enabled is false" }}
{{- end }}
{{- $redisUrl := .Values.redis.externalUrl }}
{{- if .Values.redis.enabled }}
{{- $redisUrl = printf "redis://%s:6379/0" (include "kumoss.component" (list . "redis")) }}
{{- end }}
{{- if not $redisUrl }}
{{- fail "redis.externalUrl is required when redis.enabled is false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kumoss.labels" . | nindent 4 }}
  annotations:
    # Uninstall keeps the database volumes; their passwords must survive
    # with them, or a reinstall generates new ones the data rejects. A
    # reinstall of the same release adopts this Secret and reuses it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := $pick }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  KUMOSS_SQL_DATABASE_URL: {{ $coreDbUrl | quote }}
  PHOENIX_SQL_DATABASE_URL: {{ $phoenixDbUrl | quote }}
  KUMOSS_REDIS_URL: {{ $redisUrl | quote }}
{{- end }}
