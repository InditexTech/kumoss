{{- if .Values.searxng.enabled }}
{{- /*
The Kumoss image, which already ships the repository's settings.yml and
resolves SEARXNG_SECRET at start; the ConfigMap below re-applies the same
file so a chart-only edit lands without republishing the image.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kumoss.component" (list . "searxng") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "searxng") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kumoss.selectorLabels" (list . "searxng") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kumoss.selectorLabels" (list . "searxng") | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/searxng-settings.yml" | sha256sum }}
        checksum/secrets: {{ include "kumoss.secretsChecksum" (list . "searxng") }}
        {{- include "kumoss.caBundle.checksum" . | nindent 8 }}
    spec:
      {{- if include "kumoss.caBundle.enabled" . }}
      initContainers:
        {{- include "kumoss.caBundle.initContainer" (dict "root" . "image" (include "kumoss.image" (list . .Values.searxng.image)) "pullPolicy" .Values.searxng.image.pullPolicy) | nindent 8 }}
      {{- end }}
      containers:
        - name: searxng
          image: {{ include "kumoss.image" (list . .Values.searxng.image) }}
          imagePullPolicy: {{ .Values.searxng.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: SEARXNG_PORT
              value: "8888"
            - name: SEARXNG_BASE_URL
              value: {{ printf "http://%s:8888" (include "kumoss.component" (list . "searxng")) | quote }}
            {{- include "kumoss.secretKeyRef" (list . "SEARXNG_SECRET" "SEARXNG_SECRET") | nindent 12 }}
            {{- include "kumoss.caBundle.env" . | nindent 12 }}
            {{- with .Values.searxng.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            {{- include "kumoss.caBundle.mounts" . | nindent 12 }}
            {{- with .Values.searxng.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.searxng.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: settings
          configMap:
            name: {{ include "kumoss.component" (list . "searxng") }}
        {{- include "kumoss.caBundle.volumes" . | nindent 8 }}
        {{- with .Values.searxng.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kumoss.component" (list . "searxng") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "searxng") | nindent 4 }}
spec:
  selector:
    {{- include "kumoss.selectorLabels" (list . "searxng") | nindent 4 }}
  ports:
    - name: http
      port: 8888
      targetPort: http
{{- end }}
