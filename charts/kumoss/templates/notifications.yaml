{{- if .Values.notifications.enabled }}
{{- $c := .Values.notifications }}
{{- if not (or $c.secretEnv.SLACK_WEBHOOK_URL $c.existingSecret) }}
{{- fail "notifications.enabled needs SLACK_WEBHOOK_URL in notifications.secretEnv or notifications.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kumoss.component" (list . "notifications") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "notifications") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kumoss.selectorLabels" (list . "notifications") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kumoss.selectorLabels" (list . "notifications") | nindent 8 }}
        {{- range $k, $v := .Values.notifications.podLabels }}
        {{ $k }}: {{ $v | toString | quote }}
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "kumoss.podIdentity" (list . "notifications") | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notifications
          image: {{ include "kumoss.image" (list . $c.image) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          {{- include "kumoss.envFrom" (list . "notifications" $c) | nindent 10 }}
          env:
            {{- include "kumoss.secretKeyRef" (list . "KUMOSS_NOTIFICATIONS_TOKEN" "KUMOSS_NOTIFICATIONS_TOKEN") | nindent 12 }}
            {{- include "kumoss.extraEnv" $c | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          {{- with $c.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $c.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "kumoss.scheduling" $c | nindent 6 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kumoss.component" (list . "notifications") }}
  labels:
    {{- include "kumoss.componentLabels" (list . "notifications") | nindent 4 }}
spec:
  selector:
    {{- include "kumoss.selectorLabels" (list . "notifications") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
