name: nebula

# Per-service env_file is the source of truth for every service in this
# stack. Copy each `env.sample` to a `.env` next to it before
# `docker compose up` (see README.md). The `required: false` flag lets
# the stack boot even if a particular service's .env is missing — useful
# for the OSS quickstart where most knobs have safe defaults.

services:
  proxy:
    image: nebula-nginx:latest
    restart: on-failure
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
      # Presigned artifact URLs: browser -> localhost:9000 -> nginx ->
      # object-storage:9000 (see nginx/nginx.conf).
      - "9000:9000"
    expose:
      - 80
    depends_on:
      - core
      - phoenix
      - object-storage
    networks:
      - bridge-network

  core:
    image: nebula-core:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    expose:
      - 8000
    env_file:
      - path: ./core/.env
        required: true
    volumes:
      - workspaces:/workspaces
    depends_on:
      - core-db
      - notifications
      - mapping
      - iac
      - authz
      - redis
      - object-storage
    develop:
      watch:
        - action: sync
          path: ./core
          target: /usr/src/app
    networks:
      - bridge-network

  core-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nebula
    expose:
      - 5432
    volumes:
      - core_db_data:/var/lib/postgresql/data
    networks:
      - bridge-network

  notifications:
    image: nebula-notifications:latest
    build:
      context: ./services/notifications
    env_file:
      - path: ./services/notifications/.env
        required: false
    expose:
      - 8080
    networks:
      - bridge-network

  mapping:
    image: nebula-mapping:latest
    build:
      context: ./services/mapping
    env_file:
      - path: ./services/mapping/.env
        required: false
    expose:
      - 8081
    networks:
      - bridge-network

  iac:
    image: nebula-iac:latest
    build:
      context: ./services/iac
    env_file:
      - path: ./services/iac/.env
        required: false
    volumes:
      - workspaces:/workspaces
    # Hardening (issue #103). The IaC engine executes provider plugins
    # and provisioners from LLM-generated code, so this container gets
    # the least privilege the stack can give it: the image already runs
    # as an unprivileged user (see services/iac/Dockerfile); on top of
    # that, no Linux capabilities, no privilege escalation via setuid
    # binaries, a read-only root filesystem (only the workspaces volume,
    # /tmp and the user's home are writable), and bounded CPU, memory
    # and process count so a runaway provider cannot exhaust the host.
    # Tune the limits to your workloads: large provider plans can need
    # more than 4 GiB.
    read_only: true
    # The home tmpfs must be owned by the runtime uid/gid (Docker would
    # otherwise mount it root-owned with the image dir's 0700 mode and
    # az/gcloud/aws could not create their config dirs). Keep these
    # numbers in sync with the NEBULA_UID/NEBULA_GID build ARGs.
    tmpfs:
      - /tmp
      - /home/nebula:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
          pids: 512
    expose:
      - 8082
    networks:
      - bridge-network

  authz:
    image: nebula-authz:latest
    build:
      context: ./services/authz
    env_file:
      - path: ./services/authz/.env
        required: false
    volumes:
      # Roles persist across container restarts.
      - authz_data:/data
    expose:
      - 8083
    networks:
      - bridge-network

  phoenix:
    image: arizephoenix/phoenix:20.6.0
    expose:
      - 6006
      - 4317
    depends_on:
      - phoenix-db
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@phoenix-db:5432/phoenix
      - PHOENIX_HOST_ROOT_PATH=/monitoring
      - PHOENIX_ENABLE_MCP_SERVER=false
    networks:
      - bridge-network

  phoenix-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=phoenix
    expose:
      - 5432
    volumes:
      - phoenix_db_data:/var/lib/postgresql/data
    networks:
      - bridge-network

  redis:
    image: redis:8.8
    expose:
      - 6379
    networks:
      - bridge-network

  object-storage:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    expose:
      - 9000
    volumes:
      - object_storage_data:/data
    networks:
      - bridge-network

volumes:
  core_db_data:
    driver: local
  phoenix_db_data:
    driver: local
  object_storage_data:
    driver: local
  # Shared read-write by core and iac. Both images run as the same
  # unprivileged uid/gid (build ARGs NEBULA_UID/NEBULA_GID, default
  # 10001) and pre-create /workspaces owned by it, so a *new* volume
  # comes up with the right ownership. A volume created by an older,
  # root-running stack keeps root-owned directories the IaC engine can
  # no longer write to; fix it once, with the stack stopped, via
  #   docker run --rm -v nebula_workspaces:/w alpine chown -R 10001:10001 /w
  # or drop it (it only holds transient clones): docker volume rm nebula_workspaces
  workspaces:
    driver: local
  authz_data:
    driver: local

networks:
  bridge-network:
    driver: bridge

