name: nebula

# Per-service env_file is the source of truth for every service in this
# stack. Copy each `env.sample` to a `.env` next to it before
# `docker compose up` (see README.md). The `required: false` flag lets
# the stack boot even if a particular service's .env is missing — useful
# for the OSS quickstart where most knobs have safe defaults.

services:
  proxy:
    image: nebula-nginx:latest
    restart: on-failure
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    expose:
      - 80
    depends_on:
      - core
      # - webapp
      - phoenix
    networks:
      - bridge-network

  core:
    image: nebula-core:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./core/.env
        required: true
    volumes:
      - workspaces:/workspaces
    depends_on:
      - core-db
      - notifications
      - mapping
      - iac
      - authz
    develop:
      watch:
        - action: sync
          path: ./core
          target: /usr/src/app
    networks:
      - bridge-network

  core-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nebula
    ports:
      - "5432:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    networks:
      - bridge-network


  notifications:
    image: nebula-notifications:latest
    build:
      context: ./services/notifications
    env_file:
      - path: ./services/notifications/.env
        required: false
    expose:
      - 8080
    networks:
      - bridge-network

  mapping:
    image: nebula-mapping:latest
    build:
      context: ./services/mapping
    env_file:
      - path: ./services/mapping/.env
        required: false
    expose:
      - 8081
    networks:
      - bridge-network

  authz:
    image: nebula-authz:latest
    build:
      context: ./services/authz
    env_file:
      - path: ./services/authz/.env
        required: false
    volumes:
      # Roles persist across container restarts.
      - authz_data:/data
    expose:
      - 8083
    networks:
      - bridge-network

  iac:
    image: nebula-iac:latest
    build:
      context: ./services/iac
    env_file:
      - path: ./services/iac/.env
        required: false
    volumes:
      - workspaces:/workspaces
    expose:
      - 8082
    networks:
      - bridge-network

  phoenix:
    image: arizephoenix/phoenix:17.30.0
    ports:
      - "6006"
      - "4317"
    depends_on:
      - phoenix-db
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@phoenix-db:5432/phoenix
      - PHOENIX_HOST_ROOT_PATH=/monitoring
    networks:
      - bridge-network

  phoenix-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=phoenix
    ports:
      - "5433:5432"
    volumes:
      - phoenix_db_data:/var/lib/postgresql/data
    networks:
      - bridge-network

  object-store:
    image: quay.io/minio/minio:latest
    container_name: minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - object_store_data:/data
    command: server /data --console-address ":9001"
    # restart: unless-stopped

volumes:
  core_db_data:
    driver: local
  phoenix_db_data:
    driver: local
  object_store_data:
    driver: local
  workspaces:
    driver: local
  authz_data:
    driver: local

networks:
  bridge-network:
    driver: bridge
