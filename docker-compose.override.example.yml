# Template for a local Compose override. Copy it, do not rename it in
# place:
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Compose loads `docker-compose.override.yml` automatically; this example
# is not loaded and is the only `docker-compose.override.*` file git
# tracks. See the "Behind a TLS-inspecting proxy" section of the
# development guide for the full diagnosis.
#
# ---------------------------------------------------------------------
# Trusting a TLS-inspecting proxy
# ---------------------------------------------------------------------
# A corporate proxy that terminates HTTPS re-signs it with its own root,
# which the containers do not trust: page reads then fail with
# `[SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: self-signed
# certificate in certificate chain`. Confirm the interception with:
#
#   docker compose exec core sh -c \
#     'echo | openssl s_client -connect example.com:443 \
#      -servername example.com 2>/dev/null | openssl x509 -noout -issuer'
#
# An issuer naming your company rather than a public CA confirms it.
#
# The fix is two-part, both wired below:
#
#   * Build — both images fetch their dependencies over HTTPS, so the
#     corporate roots are needed at build time too. The `host-certs` build context points at the host
#     directory holding them.
#   * Runtime — the same roots are mounted into the containers at
#     KUMOSS_CA_DIR, where each entrypoint merges them into a trust bundle
#     before starting.
#
# Set KUMOSS_HOST_CA_DIR to the host directory holding your corporate
# roots (one file per root, PEM or DER). On Linux the default is the
# system's extra-roots directory; elsewhere point it at wherever your
# corporate roots live. The certificates stay on the host — this override
# is gitignored and carries a path, never a certificate.

x-host-ca: &host-ca
  build:
    additional_contexts:
      host-certs: ${KUMOSS_HOST_CA_DIR:-/usr/local/share/ca-certificates}
  environment:
    - KUMOSS_CA_DIR=/usr/local/share/ca-certificates/host
  volumes:
    - ${KUMOSS_HOST_CA_DIR:-/usr/local/share/ca-certificates}:/usr/local/share/ca-certificates/host:ro

services:
  # Reads result pages for `web_search` and clones repositories.
  core: *host-ca
  # Answers the core's web searches, reaching the engines over HTTPS.
  searxng: *host-ca
