[project]
name = "nebula-iac"
version = "0.1.0"
description = "Reference implementation of contracts/openapi/iac.v1.yaml — local IaC engine CLI (OpenTofu by default)."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0",
]

[dependency-groups]
tooling = [
    "basedpyright>=1.39.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
