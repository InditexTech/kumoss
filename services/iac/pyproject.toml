[project]
name = "nebula-iac"
version = "0.1.0"
description = "Reference implementation of contracts/openapi/iac.v1.yaml — local IaC engine CLI (OpenTofu by default)."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "azure-identity>=1.25.3",
    "google-auth[requests]>=2.58.0",
    "boto3>=1.43.95",
    "httpx>=0.28.1",
]

[dependency-groups]
tooling = [
    "basedpyright>=1.39.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]
