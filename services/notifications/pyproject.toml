dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
]

[dependency-groups]
tooling = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
    "pytest-cov>=6.0",
]
