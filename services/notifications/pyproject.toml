[project]
name = "nebula-notifications"
version = "0.1.0"
description = "Reference implementation of contracts/openapi/notifications.v1.yaml — Slack-backed notification dispatch."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
