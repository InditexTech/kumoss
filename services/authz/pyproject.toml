[project]
name = "nebula-authz"
version = "0.1.0"
description = "Reference implementation of contracts/openapi/authz.v1.yaml — header-asserted identity + JSON-file role store + permissive cloud check."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
